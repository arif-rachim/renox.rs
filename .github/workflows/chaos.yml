name: chaos

# The fault-injection harness (bench/chaos, #104; docs/23-failure-modes.md
# section 6): every scenario against a fresh two-node stack (control/api and
# two controlled renox-workers on the runner, MinIO from
# control/docker-compose.yml for the artifact store), weekly and on demand.
# A failure opens an issue labelled `chaos` (or comments on the open one).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: chaos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch x86_64-unknown-linux-gnu "$RUNNER_TEMP/rusty_v8")
          echo "RUSTY_V8_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Fetch and verify Litestream
        run: |
          bin=$(ops/scripts/fetch-litestream.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/bin")
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: chaos
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build renox-worker
        run: |
          cargo build --release --locked -p renox-cell --bin renox-worker
          echo "RENOX_WORKER_PATH=$PWD/target/release/renox-worker" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: MinIO for storage-down
        run: docker compose -f control/docker-compose.yml up -d --wait minio minio-init
      # Root: disk-full loop-mounts a file system, and each node gets a tmpfs
      # data directory. The development credentials are the compose file's.
      - name: Run every scenario
        env:
          RENOX_CHAOS_S3_ENDPOINT: http://127.0.0.1:9000
          RENOX_CHAOS_S3_ACCESS_KEY_ID: renox
          RENOX_CHAOS_S3_SECRET_ACCESS_KEY: renox-dev-minio
          RENOX_CHAOS_S3_DOWN: docker pause renox-control-minio-1
          RENOX_CHAOS_S3_UP: docker unpause renox-control-minio-1
          BENCH_PROFILE: github-ubuntu-24.04
        run: sudo -E env "PATH=$PATH" bench/chaos/run.sh all --out "$RUNNER_TEMP/chaos"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chaos-results
          path: ${{ runner.temp }}/chaos
          if-no-files-found: warn
      # The result files name the failed checks; the issue links the run.
      - name: Open or update the chaos issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ runner.temp }}/chaos
        run: |
          gh label create chaos --color B60205 --description "bench/chaos weekly run failed" 2>/dev/null || true
          failed=$(grep -l -- '→ FAIL' "$RESULTS"/*.md 2>/dev/null | xargs -r -n1 basename | sed 's/^/- /' || true)
          body=$(printf 'The weekly chaos run failed: %s\n\nFailed scenarios:\n%s\n\nThe result files are in the run'"'"'s `chaos-results` artifact (bench/chaos/README.md).\n' "$RUN_URL" "${failed:-- (the harness did not finish; see the log)}")
          open=$(gh issue list --label chaos --state open --json number --jq '.[0].number' || true)
          if [[ -n "$open" ]]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Weekly chaos run failed" --label chaos --body "$body"
          fi
