name: journey

# The real-browser tests (#586) and the developer journey (#587) in Chromium:
# on every push to main, nightly and on demand. Not part of the PR checks, so
# pull requests stay fast. `make journey` runs with RENOX_JOURNEY=1: a browser
# test that cannot load Playwright or the worker fails instead of skipping. A
# failed run opens (or comments on) an issue labelled `journey`.
on:
  push:
    # TEMPORARY (#586): the batch branch, because workflow_dispatch cannot reach
    # a workflow that is not on main yet; removed before the PR is ready.
    branches: [main, ccr-53abc3f2-fenwfr]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: journey
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Reading the worker artifact of a ci.yml run on main.
      actions: read
      # The issue on failure.
      issues: write
    env:
      # Playwright's version for its Chromium, the same as lighthouse.yml
      # (.github/scripts/playwright-version.test.ts checks they agree); the
      # package lives outside the repository (no Playwright dependency).
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The worker built from main's crates: the newest renox-worker-ci-packaged
      # of a completed push run of ci.yml on main (as ci.yml's ts job does),
      # else the pinned release (cli/scripts/fetch-worker.ts checks its SHA-256).
      - name: Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$RUNNER_TEMP/worker
          source=""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=30" \
            --jq '.workflow_runs[] | select(.head_repository.id == .repository.id) | "\(.id) \(.head_sha)"')
          while read -r id sha; do
            [[ -n "$id" ]] || continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n renox-worker-ci-packaged -D "$dir" 2>/dev/null; then
              source="built by ci.yml run $id on main from $sha"
              break
            fi
          done <<< "$runs"
          if [[ -z "$source" ]]; then
            path=$(bun cli/scripts/fetch-worker.ts | sed 's/.* -> //')
            mkdir -p "$dir" && cp "$path" "$dir/renox-worker"
            source="the pinned release (cli/scripts/fetch-worker.ts), no worker artifact on main"
          fi
          chmod +x "$dir/renox-worker"
          echo "RENOX_WORKER_PATH=$dir/renox-worker" >> "$GITHUB_ENV"
          echo "renox-worker for the journey: $source" | tee -a "$GITHUB_STEP_SUMMARY"
      # The same step as lighthouse.yml.
      - name: Install Playwright and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      # The pass/skip/fail counts go to the run summary.
      - name: make journey
        env:
          RENOX_JOURNEY: "1"
        run: |
          set -o pipefail
          status=0
          make journey 2>&1 | tee "$RUNNER_TEMP/journey.log" || status=$?
          { echo '```'; grep -E '^ *[0-9]+ (pass|skip|todo|fail)$|^Ran [0-9]+ tests|^\((pass|fail|skip)\)' "$RUNNER_TEMP/journey.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Only for main (push and nightly): a manual run on a branch reports in its log.
      - name: Open or update the journey issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          LOG: ${{ runner.temp }}/journey.log
        run: |
          gh label create journey --color B60205 --description "journey.yml run failed" 2>/dev/null || true
          failed=$(grep -E '^\(fail\)' "$LOG" 2>/dev/null | sed 's/^/- /' || true)
          body=$(printf 'The journey run failed on `%s` (%s): %s\n\nFailed tests:\n%s\n\nRun it locally with `make journey` (docs/12-developer-experience.md, "Browser tests").\n' "$REF" "$SHA" "$RUN_URL" "${failed:-- (no test failed; a set-up step did, see the log)}")
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label journey --state open --json number --jq '.[0].number' || true)
          if [[ -n "$open" ]]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "journey.yml run failed" --label journey --body "$body"
          fi
