name: CI

# Each job runs only when its paths change (docs/12-developer-experience.md,
# "Build and compile strategy", rule 6): docs changes never trigger a Rust or
# TypeScript build. On a push the filter compares with the commit before the
# push; on a pull request with the base branch.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On push: compare with the commit before this push, not with the
          # default branch. Ignored on pull_request (compares with the base).
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'crates/**'
              - 'bench/spike/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            ts:
              - '*.ts'
              - 'sdk*/**'
              - 'cli*/**'
              - 'control/**'
              - 'modules/**'
              - 'examples/**'
              - 'bench/**'
              - '.github/scripts/**'
              - 'package.json'
              - 'bun.lock*'
              - 'tsconfig*.json'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/scripts/check-links.ts'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      # renox-runtime links deno_runtime and V8: with debug info, target/
      # outgrows the runner's free disk. CI needs no debugger symbols.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # sccache stores rustc outputs in the GitHub Actions cache (B20,
      # docs/12-developer-experience.md rule 6). It cannot cache incremental
      # builds, so incremental compilation is off.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      # The runner image ships ~14 GB free; the SDKs below are unused here
      # and free about 30 GB for the Deno/V8 build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      # rustup on the runner reads rust-toolchain.toml and installs the pinned version.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: mozilla-actions/sccache-action@v0.0.9
      # Caches ~/.cargo and target/. The key is the job, the rustc version
      # (rust-toolchain.toml), Cargo.lock and the Cargo.toml files.
      - uses: Swatinem/rust-cache@v2
      - run: make rust-check
      - run: make rust-test
      # Hit rate for B20 (bench/scenarios/B20/run.sh reads job timings only).
      - run: sccache --show-stats

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: make ts-check
      - run: make ts-test
      - name: Benchmark harness smoke test
        run: bench/run.sh B0 --runs 1

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Link check (relative links only, no network) and docs/contracts type-check.
      - run: make docs-check
