name: CI

# Each job runs only when its paths change (docs/12-developer-experience.md,
# "Build and compile strategy", rule 6): docs changes never trigger a Rust or
# TypeScript build. On a push the filter compares with the commit before the
# push; on a pull request with the base branch. The `lint` job (path filter,
# pinned actions, cargo-deny, bun audit, docs) runs on every push and PR, so it
# can be a required check (docs/22-development-plan.md, "Branch protection").
# The small checks are steps of one job, not five jobs (#189): each job is
# billed rounded up to a full minute.
#
# Only `pull_request` is used, never `pull_request_target`: PRs from forks run
# without secrets and with the read-only token below (issue #109).
# `push` is limited to `main`: a branch with a pull request already runs on
# `pull_request`, and a push run on top of it doubled the Actions minutes
# (85 of 113 push runs in October 2026 were on feature branches).
on:
  push:
    branches:
      - main
  pull_request:

# A push run on main is never cancelled: it is the one that builds and uploads renox-worker-ci-packaged
# for the ts job of later pull requests (#520). Its group is per commit, so a queued main run is not
# replaced by the next push either (#619: GitHub keeps one pending run per group); several main runs
# can run at once. Pull request runs still cancel their older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# `shell: bash` named explicitly runs every step as `bash -eo pipefail` (#356).
# The runner's default is `bash -e` without pipefail: a pipeline answers its
# last command's status, so `make ts-test | tee` stayed green while tests
# failed, and `cargo metadata | jq` would go on with empty input.
defaults:
  run:
    shell: bash

jobs:
  # Every check that is not a build: the path filter the other jobs read, then
  # one step per former job. Each check step runs even when an earlier one
  # failed, so one run reports every failure; the jobs below read the filter
  # outputs even when a lint step failed (`!cancelled()`), so a bun audit
  # finding does not hide a test failure.
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      rust_files: ${{ steps.filter.outputs.rust_files }}
      macos: ${{ steps.filter.outputs.macos }}
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # No token left in .git: bun install and cargo-deny run in this job.
      # The repository is public, so paths-filter fetches on push without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # On push: compare with the commit before this push, not with the
          # default branch. Ignored on pull_request (compares with the base).
          base: ${{ github.ref }}
          # rust_files: the rust job tests only the changed crates on a PR.
          list-files: json
          filters: |
            rust:
              - 'crates/**'
              - 'bench/spike/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'ops/**'
              # The rust job builds the renox-worker the ts job tests with
              # (#186), so a change to the jobs runs it too.
              - '.github/workflows/ci.yml'
            # The `macos` job: renox-runtime and what it links. macOS runners
            # are 10x the price of Linux, so the filter is narrower than the
            # `rust` job's (#212, #139).
            macos:
              - 'crates/renox-runtime/**'
              - 'crates/renox-data/**'
              - 'crates/renox-cell/src/disk.rs'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'ops/v8-*'
              - '.github/workflows/ci.yml'
            ts:
              - '*.ts'
              - 'sdk*/**'
              - 'cli*/**'
              - 'control/**'
              - 'packages/**'
              # control/api, packages/artifact-validate and cli import the
              # contract schemas and examples, so a contract change runs them.
              - 'docs/contracts/**'
              - 'modules/**'
              - 'examples/**'
              - 'bench/**'
              - '.github/scripts/**'
              - 'ops/**'
              - 'package.json'
              - 'bun.lock*'
              - 'tsconfig*.json'
              # A change to the jobs themselves runs them.
              - '.github/workflows/ci.yml'
              - 'Makefile'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/scripts/check-links.ts'
              - '.github/workflows/ci.yml'
              - 'Makefile'

      # Every third-party action is pinned to a full commit SHA (issue #109).
      - name: actions-pinned
        if: success() || failure()
        run: |
          unpinned=$(grep -rnE '^[[:space:]-]*uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "$unpinned" ]]; then
            echo "::error::actions must be pinned to a 40-character commit SHA (version in a comment):"
            echo "$unpinned"
            exit 1
          fi
          echo "all actions pinned"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: success() || failure()
        with:
          bun-version: 1.4.4
      # Known-vulnerable npm packages in bun.lock (sdk, cli, control, modules, bench).
      - name: bun-audit
        if: success() || failure()
        run: |
          bun install --frozen-lockfile
          bun audit
      # Link check (relative links only, no network), docs/contracts type-check,
      # and docs/contracts/validate.ts (schemas, examples, contract rules).
      - name: docs
        if: (success() || failure()) && steps.filter.outputs.docs == 'true'
        run: make docs-check
      # ops/ (#252, #366): the systemd units and timers verify, the scripts pass shellcheck
      # (warnings and errors; the runner image ships it), and the Litestream
      # fetcher refuses a tarball whose SHA-256 differs from ops/litestream.lock.
      - name: ops
        if: success() || failure()
        run: |
          ops/scripts/verify-units.sh
          shellcheck --version | head -2
          shellcheck --severity=warning ops/scripts/*.sh
          ops/scripts/fetch-litestream.test.sh
          ops/scripts/move-to-microvm.test.sh
          # The single host (#366, #420): the pinned cloudflared fetcher, the
          # backup script (fakes, no network), the tunnel-only firewall (only
          # SSH open) in two containers.
          ops/scripts/fetch-cloudflared.test.sh
          ops/scripts/pin-cloudflared.test.sh
          # renox-alert.sh (#450, #545): stubs for curl and journalctl, no network.
          ops/scripts/renox-alert.test.sh
          command -v age >/dev/null || sudo apt-get install -y --no-install-recommends age
          ops/scripts/backup-control-db.test.sh
          # Local backups without R2 (#517): sqlite3 and pg_restore for the real copies.
          command -v sqlite3 >/dev/null || sudo apt-get install -y --no-install-recommends sqlite3
          ops/scripts/backup-local.test.sh
          # restore-check.sh's steps on a local and an R2 host (#538): stub Postgres tools.
          ops/scripts/restore-check.test.sh
          # bootstrap-node.sh --worker-variant pdf (#525): fetch_worker against a file:// release.
          ops/scripts/bootstrap-worker-variant.test.sh
          ops/scripts/firewall-single-host.test.sh
          # No command piped into grep -q in the single-host e2e test (#569): SIGPIPE under pipefail.
          ops/scripts/pipe-grep-q.test.sh
      # ops/observability (#296): promtool from the Prometheus release pinned
      # in ops/observability/prometheus.lock, its SHA-256 checked before the
      # one file is extracted, then `promtool check rules`.
      - name: promtool
        if: success() || failure()
        run: |
          lock=ops/observability/prometheus.lock
          version=$(awk '$1 == "version" { print $2 }' "$lock")
          read -r sum tarball < <(awk '$1 == "x86_64-unknown-linux-gnu" { print $2, $3 }' "$lock")
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --output "$RUNNER_TEMP/$tarball" "https://github.com/prometheus/prometheus/releases/download/v$version/$tarball"
          echo "$sum  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          dir=${tarball%.tar.gz}
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --no-same-owner --no-same-permissions "$dir/promtool"
          "$RUNNER_TEMP/$dir/promtool" check rules ops/observability/rules/*.yml
      # The dashboards and rules against ops/observability/README.md (families,
      # docs/23 rows, panel layout), and the laptop compose file.
      - name: observability
        if: success() || failure()
        run: |
          bun ops/observability/check.ts
          docker compose -f ops/observability/docker-compose.observability.yml config -q
      # RustSec advisories, licences, sources (deny.toml).
      - name: Rust toolchain for cargo-deny
        if: success() || failure()
        run: rustup show active-toolchain || rustup toolchain install
      # Prebuilt cargo-deny, checksum-verified by install-action.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: success() || failure()
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny
        if: success() || failure()
        run: cargo deny --locked check

  rust:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    env:
      # renox-runtime links deno_runtime and V8: with debug info, target/
      # outgrows the runner's free disk. CI needs no debugger symbols.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # sccache stores rustc outputs in the GitHub Actions cache (B20,
      # docs/12-developer-experience.md rule 6). It cannot cache incremental
      # builds, so incremental compilation is off.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      # The runner image ships ~14 GB free; the SDKs below are unused here
      # and free about 30 GB for the Deno/V8 build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup on the runner reads rust-toolchain.toml and installs the pinned version.
      - run: rustup show active-toolchain || rustup toolchain install
      # The prebuilt V8 archive, checked against ops/v8-checksums.txt before
      # cargo runs; the v8 build script then copies it instead of downloading.
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch x86_64-unknown-linux-gnu "$RUNNER_TEMP/rusty_v8")
          echo "RUSTY_V8_ARCHIVE=$archive" >> "$GITHUB_ENV"
      # The pinned Litestream (ops/litestream.lock, SHA-256 verified) on PATH,
      # so the replication tests of renox-cell run instead of skipping (#252, #255).
      - name: Fetch and verify Litestream
        run: |
          bin=$(ops/scripts/fetch-litestream.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/bin")
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Caches ~/.cargo and target/. The key is the job, the rustc version
      # (rust-toolchain.toml), Cargo.lock and the Cargo.toml files.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The v8 build script puts librusty_v8.a under target/debug/gn_out, which
      # rust-cache does not keep. When a partial cache match makes cargo
      # rebuild the v8 crate without rerunning its build script, the link
      # fails; drop the build script's state so it copies the archive again.
      - name: Rerun the v8 build script when its archive copy is gone
        run: |
          if [[ ! -d target/debug/gn_out ]]; then
            rm -rf target/debug/build/v8-* target/debug/.fingerprint/v8-*
          fi
      - run: make rust-check
      # #189: on a pull request, test only the changed crates and the
      # workspace packages that depend on them. The file list reaches the
      # shell through the environment, never through ${{ }} in the script.
      - name: Crates to test
        env:
          EVENT: ${{ github.event_name }}
          FILES: ${{ needs.lint.outputs.rust_files }}
        run: |
          crates=""
          if [[ "$EVENT" == "pull_request" ]]; then
            crates=$(cargo metadata --format-version 1 --no-deps --locked | jq -r --argjson files "$FILES" '
            # Workspace packages to test for the changed files: the crates under crates/
            # that changed, plus every package that depends on them (by path). Empty
            # (the whole workspace) when a file outside crates/ changed.
            if any($files[]; startswith("crates/") | not) then "" else
              [.packages[] | {name, dir: (.manifest_path | split("/") | .[-3:-1] | join("/")),
                              deps: [.dependencies[] | select(.path != null) | .name]}] as $p
              | ($files | map(split("/")[0:2] | join("/")) | unique) as $dirs
              | def grow: . as $s
                  | ($s + [$p[] | select(any(.deps[]; . as $d | any($s[]; . == $d))) | .name] | unique) as $n
                  | if $n == $s then $s else $n | grow end;
              [$p[] | select(.dir as $d | any($dirs[]; . == $d)) | .name] | unique | grow | join(" ")
            end
            ')
          fi
          echo "CRATES=$crates" >> "$GITHUB_ENV"
          echo "rust tests: ${crates:-the whole workspace}" | tee -a "$GITHUB_STEP_SUMMARY"
      # #253: renox-cell's suite runs under the worker's seccomp allowlist
      # (enforce: a syscall outside it kills the test process).
      - run: make rust-test
        env:
          RENOX_TEST_SANDBOX: enforce
      # A process the seccomp filter killed leaves a kernel audit record
      # (type=1326) naming the syscall; printed when the tests failed.
      - name: seccomp kills (on failure)
        if: failure()
        run: sudo dmesg | grep -E 'type=1326|seccomp' | tail -50 || true
      # The worker the ts job runs the CLI template, shop build and dev e2e
      # tests with (#186): built from this commit, without the test-hooks
      # feature that `cargo test` turns on in renox-runtime.
      #
      # Packaged (#356): an unpackaged build reads the Deno extensions' sources
      # from ~/.cargo/registry when it builds its snapshot at startup, and the
      # ts job's runner has no registry, so every worker test failed there
      # with exit code 101. The same two steps as release-worker.yml, in the
      # debug profile.
      - name: Build renox-worker for the ts job
        run: |
          RENOX_PACKAGED_DIR="$RUNNER_TEMP/packaged" cargo test --locked \
            -p renox-runtime --test packaged -- --ignored --exact write_packaged_sources
          RENOX_PACKAGED_DIR="$RUNNER_TEMP/packaged" cargo build --locked -p renox-cell --bin renox-worker \
            --features renox-runtime/packaged
          mkdir -p "$RUNNER_TEMP/worker"
          cp target/debug/renox-worker "$RUNNER_TEMP/worker/"
      # ops/scripts/bootstrap-node.sh in an ubuntu:24.04 container booted with
      # systemd, with the worker just built (#252); skips with a reason where
      # systemd cannot run in a container.
      - name: Node bootstrap in a systemd container
        run: ops/scripts/bootstrap-node.test.sh "$RUNNER_TEMP/worker/renox-worker"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renox-worker-ci-packaged
          path: ${{ runner.temp }}/worker/renox-worker
          if-no-files-found: error
          # main keeps its worker for the TypeScript-only PRs that follow.
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}
      # Hit rate for B20 (bench/scenarios/B20/run.sh reads job timings only).
      - run: sccache --show-stats

  # The per-request CPU limit on macOS, where `renox dev` runs the prebuilt
  # worker. `limits/cpu.rs` reads the isolate thread's CPU through its Mach
  # port there instead of pthread_getcpuclockid (#139), and the watchdog
  # cross-checks that reading against the wall clock because
  # `thread_info(THREAD_BASIC_INFO)` lags for a thread running on another
  # core (#212, `docs/24-threat-model.md` B, "CPU, memory, wall-clock
  # exhaustion"). The rest of the workspace is tested on Linux only.
  # `macos-15` (aarch64) is the current ARM runner; macos-14 was retired
  # on 2026-11-02 (actions/runner-images#13518).
  macos:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.macos == 'true' }}
    runs-on: macos-15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # ops/v8-archive.sh checks with sha256sum, which macOS lacks.
      - name: sha256sum
        run: |
          if ! command -v sha256sum >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
            chmod +x "$RUNNER_TEMP/bin/sha256sum"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch aarch64-apple-darwin "$RUNNER_TEMP/rusty_v8")
          echo "RUSTY_V8_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rerun the v8 build script when its archive copy is gone
        run: |
          if [[ ! -d target/debug/gn_out ]]; then
            rm -rf target/debug/build/v8-* target/debug/.fingerprint/v8-*
          fi
      # The CPU clock and watchdog units run without V8 (fast).
      - name: Thread clock and watchdog units
        run: cargo test --locked -p renox-runtime --no-default-features --lib limits::cpu
      # The acceptance test for #212: the loop is terminated at 50 ms ± 5 ms
      # of CPU, three consecutive runs. The CPU-sensitive tests in limits.rs
      # and termination.rs share a `tokio::sync::Mutex` that serialises them,
      # and `-- cpu` filters to those (the heap test reads /proc).
      - name: CPU-limit tests (three runs)
        run: |
          for i in 1 2 3; do
            echo "::group::macOS CPU-limit run $i"
            cargo test --locked -p renox-runtime --test limits --test termination -- cpu
            echo "::endgroup::"
          done
      # The per-request CPU accounting (#155): one slow handler cannot steal
      # CPU from faster concurrent requests.
      - name: Per-request CPU accounting
        run: cargo test --locked -p renox-runtime --test cpu_accounting
      # The statvfs disk probe on macOS (#465): renox-cell's disk units,
      # including the one-warning stop of an unsupported probe.
      - name: Disk probe
        run: cargo test --locked -p renox-cell --lib disk
      - run: sccache --show-stats

  # The per-thread CPU clock on Windows (#527, #529, parent #442). The pure
  # units of `limits::cpu` (QueryThreadCycleTime clock, watchdog) run without
  # V8; then the CPU-limit tests run on V8 from the verified prebuilt archive
  # (rusty_v8 .lib.gz, ops/v8-archive.sh), like the `macos` job. Same path
  # filter as `macos`, which already covers renox-runtime. The runner's bash
  # provides sha256sum, curl and awk for ops/v8-archive.sh.
  windows-runtime:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.macos == 'true' }}
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch x86_64-pc-windows-msvc "$RUNNER_TEMP/rusty_v8")
          # Bash prints /d/a/...; the v8 build script needs a Windows path.
          echo "RUSTY_V8_ARCHIVE=$(cygpath -m "$archive")" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rerun the v8 build script when its archive copy is gone
        run: |
          if [[ ! -d target/debug/gn_out ]]; then
            rm -rf target/debug/build/v8-* target/debug/.fingerprint/v8-*
          fi
      - name: Thread clock and watchdog units
        run: cargo test --locked -p renox-runtime --no-default-features --lib limits::cpu
      # The acceptance test: the infinite loop is terminated at 50-55 ms of
      # CPU. `-- cpu` filters to the serialised CPU tests (the heap test reads
      # /proc, Linux only).
      - name: CPU-limit tests
        run: cargo test --locked -p renox-runtime --test limits --test termination -- cpu
      - name: Per-request CPU accounting
        run: cargo test --locked -p renox-runtime --test cpu_accounting
      - run: sccache --show-stats

  # renox-worker on Windows (#528, parent #442): the binary builds, clippy is
  # clean for the crates #530 gated, and the renox-cell unit tests (including
  # the `#[cfg(not(unix))]` config tests: unix listen, [process] and
  # [replication] refused) and the renox-gateway tests pass. V8 comes from the
  # verified prebuilt archive, like `windows-runtime`. Same path filter as the
  # `rust` job, which covers renox-cell and renox-gateway.
  windows-worker:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.rust == 'true' }}
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch x86_64-pc-windows-msvc "$RUNNER_TEMP/rusty_v8")
          # Bash prints /d/a/...; the v8 build script needs a Windows path.
          echo "RUSTY_V8_ARCHIVE=$(cygpath -m "$archive")" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rerun the v8 build script when its archive copy is gone
        run: |
          if [[ ! -d target/debug/gn_out ]]; then
            rm -rf target/debug/build/v8-* target/debug/.fingerprint/v8-*
          fi
      - name: Build renox-worker
        run: cargo build --locked -p renox-cell --bin renox-worker
      # Same flags as `make rust-check` (-D warnings, --all-targets), for the
      # crates this job builds.
      - name: Clippy
        run: cargo clippy --locked -p renox-cell -p renox-gateway -p renox-runtime --all-targets -- -D warnings
      - name: renox-cell unit tests
        run: cargo test --locked -p renox-cell --lib
      - name: renox-gateway tests
        run: cargo test --locked -p renox-gateway
      - run: sccache --show-stats

  # Runs on a TypeScript change and on a Rust change: the CLI template, shop
  # build and dev e2e tests run on a renox-worker binary (#186). The worker is
  # the one the rust job built from this commit; when rust is skipped
  # (TypeScript-only change), the one built by the latest green push run on
  # main, else the pinned release (cli/scripts/fetch-worker.ts verifies its
  # SHA-256). `make ts-test` fails in CI without RENOX_WORKER_PATH.
  ts:
    needs: [lint, rust]
    if: >-
      !cancelled()
      && (needs.lint.outputs.ts == 'true' || needs.lint.outputs.rust == 'true')
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reading the worker artifact of an earlier run on main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.rust.result == 'success'
        with:
          name: renox-worker-ci-packaged
          path: ${{ runner.temp }}/worker
      - run: make ts-check
      - name: Worker for the tests
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_RAN: ${{ needs.rust.result == 'success' }}
        run: |
          dir=$RUNNER_TEMP/worker
          if [[ "$RUST_RAN" == "true" ]]; then
            source="built by the rust job of this run from $GITHUB_SHA"
          else
            # Only push runs on main: a pull request (a fork's included) can
            # never supply the binary. Completed runs, not only green ones:
            # the artifact is uploaded only when the rust job built and tested
            # the worker, and a run that is red elsewhere (a ts test) still
            # carries the newest worker; taking the last fully green run
            # instead tested PRs with a worker older than main's crates.
            source=""
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=30" \
              --jq '.workflow_runs[] | select(.head_repository.id == .repository.id) | "\(.id) \(.head_sha)"')
            while read -r id sha; do
              [[ -n "$id" ]] || continue
              if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n renox-worker-ci-packaged -D "$dir" 2>/dev/null; then
                source="built by run $id on main from $sha"
                break
              fi
            done <<< "$runs"
            if [[ -z "$source" ]]; then
              path=$(bun cli/scripts/fetch-worker.ts | sed 's/.* -> //')
              mkdir -p "$dir" && cp "$path" "$dir/renox-worker"
              source="the pinned release (cli/scripts/fetch-worker.ts), no worker artifact on main"
            fi
          fi
          chmod +x "$dir/renox-worker"
          echo "RENOX_WORKER_PATH=$dir/renox-worker" >> "$GITHUB_ENV"
          echo "renox-worker for the ts tests: $source" | tee -a "$GITHUB_STEP_SUMMARY"
      # The pass/skip/fail counts go to the run summary: the worker tests
      # count as run there, not skipped (#186).
      - name: make ts-test
        # The test status, not tee's, ends the step (pipefail, `defaults`
        # above), after the counts are written to the summary.
        run: |
          status=0
          make ts-test 2>&1 | tee "$RUNNER_TEMP/ts-test.log" || status=$?
          { echo '```'; grep -E '^ *[0-9]+ (pass|skip|todo|fail)$|^Ran [0-9]+ tests' "$RUNNER_TEMP/ts-test.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Benchmark harness smoke test
        run: bench/run.sh B0 --runs 1
      # ops/single-host.md steps 3 to 12 in one ubuntu:24.04 container booted
      # with systemd (#407): Postgres, bootstrap --single-host, the control
      # API on Postgres, the controlled worker with the sandbox enforced, the
      # platform tenant's dashboard and www deployed with the CLI and served
      # through the tunnel's socket, the backup, alert and billing units, and
      # the runbook's health checks. Needs Bun, node_modules and a worker,
      # which this job has; skips with a reason where systemd cannot run in
      # a container.
      - name: Single host end to end
        run: ops/scripts/single-host-e2e.test.sh "$RENOX_WORKER_PATH"

  # The compiled CLI as a developer gets it (#448): `bun build --compile` with
  # the embedded modules and test harness (cli/scripts/compile.ts), then the
  # first-hour steps from a directory outside the repository
  # (cli/scripts/smoke.sh): new, bun install, check, build, test, add auth,
  # dev with a request to /api/hello. The worker is the pinned release,
  # installed beside the binary as install.sh does; the app installs this
  # commit's SDK (packed), not the npm release.
  cli-smoke:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.ts == 'true' }}
    # #462: macOS too, where $TMPDIR is a symlink under /var and the worker
    # has no statvfs probe; the first hour must behave the same there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Compile the CLI and install the pinned worker beside it
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/sdk"
          (cd cli && bun scripts/compile.ts --outfile "$RUNNER_TEMP/bin/renox")
          git diff --exit-code cli/src/lib/embedded.ts
          worker=$(bun cli/scripts/fetch-worker.ts | sed 's/.* -> //')
          cp "$worker" "$RUNNER_TEMP/bin/renox-worker"
          (cd sdk && bun run build && bun pm pack --destination "$RUNNER_TEMP/sdk")
      - name: Smoke test from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/cli/scripts/smoke.sh" "$RUNNER_TEMP/bin/renox" "$RUNNER_TEMP"/sdk/*.tgz | tee "$RUNNER_TEMP/smoke.log"
          { echo '```'; grep -E '^== |at most|GET / ->|passed' "$RUNNER_TEMP/smoke.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The worker-free CLI on Windows (#509, parent #441): the test files that
  # need no renox-worker (they do not import tests/worker-env.ts), then new,
  # check and build of a blank app, then the artifact hashes of two examples,
  # which the next job compares with the ones built on Linux. The worker is
  # not built for Windows, so RENOX_WORKER_PATH stays unset.
  windows:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.ts == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # The runner's git defaults to core.autocrlf=true, which would check
      # the sources out with CRLF and change the artifact hash. Set before
      # checkout, so the hashes are those of the LF files on Linux.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: CLI tests that need no worker
        run: cd cli && bun test tests/paths.test.ts tests/hash.test.ts tests/routes.test.ts tests/credentials-path.test.ts tests/worker-unavailable.test.ts tests/install-ps1.test.ts
      - name: new, check, build of a blank app
        # Outside the repository: inside it, check would find the workspace's
        # typescript but not the app's own @renoxium/sdk (no bun install there).
        run: |
          cli="$PWD/cli/src/main.ts"
          cd "$RUNNER_TEMP"
          bun "$cli" new demo --template blank
          cd demo
          bun "$cli" check
          bun "$cli" build
      - name: Artifact hashes of the examples
        run: bun cli/scripts/build-hash.ts examples/hello examples/npm-compat > hashes-windows.txt
      # #532: the pinned renox-worker.exe of worker-v<WORKER_VERSION>, checked
      # against PINNED_WORKER, runs renox dev and renox test natively.
      - name: renox dev of examples/hello, renox test of hello and shop, with the pinned worker
        env:
          RENOX_WORKER_PATH: ""
        run: |
          bun cli/scripts/fetch-worker.ts
          cli="$PWD/cli/src/main.ts"
          cd examples/hello
          bun "$cli" dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          pid=$!
          code=""
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/hello || true)
            [[ "$code" == 200 ]] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          echo "GET /api/hello -> $code"
          body=$(curl -s http://localhost:8787/api/hello || true)
          # Stop renox dev and its worker: the whole Windows process tree.
          taskkill //F //T //PID "$(cat "/proc/$pid/winpid")" > /dev/null 2>&1 || kill "$pid" 2>/dev/null || true
          echo "--- renox dev output"; cat "$RUNNER_TEMP/dev.log"
          [[ "$code" == 200 && "$body" == '{"ok":true}' ]]
          bun "$cli" test
          # #442: the shop's tests too (modules, pages, the e2e build).
          cd ../shop
          bun "$cli" test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-windows
          path: hashes-windows.txt
          if-no-files-found: error

  # The same examples build to the same hashes on Linux and Windows (#509).
  windows-hash-parity:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun cli/scripts/build-hash.ts examples/hello examples/npm-compat > hashes-linux.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hashes-windows
      - name: Compare
        run: |
          cat hashes-linux.txt hashes-windows.txt
          diff hashes-linux.txt hashes-windows.txt

  # control/api on a real Postgres: PGlite (the default in `make ts-test`)
  # hides driver differences, e.g. Bun's client double-encoding a string bound
  # to `$n::jsonb` (control/api/README.md, "Tests").
  control-postgres:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.ts == 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: renox
          POSTGRES_PASSWORD: renox-ci
          POSTGRES_DB: renox_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renox -d renox_harness"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: renox-ci
      CONTROL_TEST_HARNESS_URL: postgres://renox:renox-ci@localhost:5432/renox_harness
      CONTROL_TEST_DATABASE_URL: postgres://renox:renox-ci@localhost:5432/renox_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: psql -h localhost -U renox -d renox_harness -c 'create database renox_test'
      - run: bun test
        working-directory: control/api
