name: CI

# Each job runs only when its paths change (docs/12-developer-experience.md,
# "Build and compile strategy", rule 6): docs changes never trigger a Rust or
# TypeScript build. On a push the filter compares with the commit before the
# push; on a pull request with the base branch. The supply-chain jobs
# (actions-pinned, cargo-deny, bun-audit) run on every push and PR, so they can
# be required checks (docs/22-development-plan.md, "Branch protection").
#
# Only `pull_request` is used, never `pull_request_target`: PRs from forks run
# without secrets and with the read-only token below (issue #109).
# `push` is limited to `main`: a branch with a pull request already runs on
# `pull_request`, and a push run on top of it doubled the Actions minutes
# (85 of 113 push runs in October 2026 were on feature branches).
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # On push: compare with the commit before this push, not with the
          # default branch. Ignored on pull_request (compares with the base).
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'crates/**'
              - 'bench/spike/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'ops/**'
              # The rust job builds the renox-worker the ts job tests with
              # (#186), so a change to the jobs runs it too.
              - '.github/workflows/ci.yml'
            ts:
              - '*.ts'
              - 'sdk*/**'
              - 'cli*/**'
              - 'control/**'
              - 'packages/**'
              # control/api, packages/artifact-validate and cli import the
              # contract schemas and examples, so a contract change runs them.
              - 'docs/contracts/**'
              - 'modules/**'
              - 'examples/**'
              - 'bench/**'
              - '.github/scripts/**'
              - 'ops/**'
              - 'package.json'
              - 'bun.lock*'
              - 'tsconfig*.json'
              # A change to the jobs themselves runs them.
              - '.github/workflows/ci.yml'
              - 'Makefile'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/scripts/check-links.ts'
              - '.github/workflows/ci.yml'
              - 'Makefile'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      # renox-runtime links deno_runtime and V8: with debug info, target/
      # outgrows the runner's free disk. CI needs no debugger symbols.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # sccache stores rustc outputs in the GitHub Actions cache (B20,
      # docs/12-developer-experience.md rule 6). It cannot cache incremental
      # builds, so incremental compilation is off.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      # The runner image ships ~14 GB free; the SDKs below are unused here
      # and free about 30 GB for the Deno/V8 build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup on the runner reads rust-toolchain.toml and installs the pinned version.
      - run: rustup show active-toolchain || rustup toolchain install
      # The prebuilt V8 archive, checked against ops/v8-checksums.txt before
      # cargo runs; the v8 build script then copies it instead of downloading.
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch x86_64-unknown-linux-gnu "$RUNNER_TEMP/rusty_v8")
          echo "RUSTY_V8_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # Caches ~/.cargo and target/. The key is the job, the rustc version
      # (rust-toolchain.toml), Cargo.lock and the Cargo.toml files.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make rust-check
      - run: make rust-test
      # The worker the ts job runs the CLI template, shop build and dev e2e
      # tests with (#186): built from this commit, without the test-hooks
      # feature that `cargo test` turns on in renox-runtime.
      - name: Build renox-worker for the ts job
        run: |
          cargo build --locked -p renox-cell --bin renox-worker
          mkdir -p "$RUNNER_TEMP/worker"
          cp target/debug/renox-worker "$RUNNER_TEMP/worker/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renox-worker-ci
          path: ${{ runner.temp }}/worker/renox-worker
          if-no-files-found: error
          # main keeps its worker for the TypeScript-only PRs that follow.
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}
      # Hit rate for B20 (bench/scenarios/B20/run.sh reads job timings only).
      - run: sccache --show-stats

  # Runs on a TypeScript change and on a Rust change: the CLI template, shop
  # build and dev e2e tests run on a renox-worker binary (#186). The worker is
  # the one the rust job built from this commit; when rust is skipped
  # (TypeScript-only change), the one built by the latest green push run on
  # main, else the pinned release (cli/scripts/fetch-worker.ts verifies its
  # SHA-256). `make ts-test` fails in CI without RENOX_WORKER_PATH.
  ts:
    needs: [changes, rust]
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.changes.outputs.ts == 'true' || needs.changes.outputs.rust == 'true')
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reading the worker artifact of an earlier run on main.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.rust.result == 'success'
        with:
          name: renox-worker-ci
          path: ${{ runner.temp }}/worker
      - run: make ts-check
      - name: Worker for the tests
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_RAN: ${{ needs.rust.result == 'success' }}
        run: |
          dir=$RUNNER_TEMP/worker
          if [[ "$RUST_RAN" == "true" ]]; then
            source="built by the rust job of this run from $GITHUB_SHA"
          else
            # Only push runs on main: a pull request (a fork's included) can
            # never supply the binary.
            source=""
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" \
              --jq '.workflow_runs[] | select(.head_repository.id == .repository.id) | "\(.id) \(.head_sha)"')
            while read -r id sha; do
              [[ -n "$id" ]] || continue
              if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n renox-worker-ci -D "$dir" 2>/dev/null; then
                source="built by run $id on main from $sha"
                break
              fi
            done <<< "$runs"
            if [[ -z "$source" ]]; then
              path=$(bun cli/scripts/fetch-worker.ts | sed 's/.* -> //')
              mkdir -p "$dir" && cp "$path" "$dir/renox-worker"
              source="the pinned release (cli/scripts/fetch-worker.ts), no worker artifact on main"
            fi
          fi
          chmod +x "$dir/renox-worker"
          echo "RENOX_WORKER_PATH=$dir/renox-worker" >> "$GITHUB_ENV"
          echo "renox-worker for the ts tests: $source" | tee -a "$GITHUB_STEP_SUMMARY"
      # The pass/skip/fail counts go to the run summary: the worker tests
      # count as run there, not skipped (#186).
      - name: make ts-test
        run: |
          make ts-test 2>&1 | tee "$RUNNER_TEMP/ts-test.log"
          { echo '```'; grep -E '^ *[0-9]+ (pass|skip|todo|fail)$|^Ran [0-9]+ tests' "$RUNNER_TEMP/ts-test.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark harness smoke test
        run: bench/run.sh B0 --runs 1

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Link check (relative links only, no network), docs/contracts type-check,
      # and docs/contracts/validate.ts (schemas, examples, contract rules).
      - run: make docs-check

  # control/api on a real Postgres: PGlite (the default in `make ts-test`)
  # hides driver differences, e.g. Bun's client double-encoding a string bound
  # to `$n::jsonb` (control/api/README.md, "Tests").
  control-postgres:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: renox
          POSTGRES_PASSWORD: renox-ci
          POSTGRES_DB: renox_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renox -d renox_harness"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: renox-ci
      CONTROL_TEST_HARNESS_URL: postgres://renox:renox-ci@localhost:5432/renox_harness
      CONTROL_TEST_DATABASE_URL: postgres://renox:renox-ci@localhost:5432/renox_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: psql -h localhost -U renox -d renox_harness -c 'create database renox_test'
      - run: bun test
        working-directory: control/api

  # Every third-party action is pinned to a full commit SHA (issue #109).
  actions-pinned:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: No action referenced by tag or branch
        run: |
          unpinned=$(grep -rnE '^[[:space:]-]*uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "$unpinned" ]]; then
            echo "::error::actions must be pinned to a 40-character commit SHA (version in a comment):"
            echo "$unpinned"
            exit 1
          fi
          echo "all actions pinned"

  # RustSec advisories, licences, sources (deny.toml).
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # Prebuilt cargo-deny, checksum-verified by install-action.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # Known-vulnerable npm packages in bun.lock (sdk, cli, control, modules, bench).
  bun-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit
