name: Release worker

# Builds the renox-worker release binary and publishes it as a GitHub Release
# asset that the CLI downloads (docs/12-developer-experience.md rule 5, #32).
# Runs only on a `worker-v*` tag or by hand, never on docs or TypeScript
# changes (rule 6). A manual run without a version builds and size-checks
# the binary and keeps it as a workflow artifact, without a release.
#
# Asset name: renox-worker-<version>-<target>, plus <asset>.sha256, on the
# release tagged worker-v<version>. cli/scripts/fetch-worker.ts downloads the
# same names (#154).
#
# Two variants per target (#381): the default build has no `pdf` feature
# (ctx.pdf answers RENOX_INTERNAL, reason `pdf_unavailable`) and stays the
# one install.sh and fetch-worker.ts fetch; the `pdf` variant has the typst
# engine and is published gzip-compressed as
# renox-worker-<version>-<target>-pdf.gz (+ .sha256), because the binary
# (about 134 MiB) is over the 128 MiB cosign verifies
# (COSIGN_MAX_ATTACHMENT_SIZE) and the .gz is well under it.
# SHA256SUMS.unpacked lists the sha256 of each binary after gunzip; it is
# signed like SHA256SUMS and is what PINNED_WORKER.pdf in
# cli/src/worker/verify.ts pins. `fetch-worker.ts --pdf` fetches it.
#
# Signed releases (#129; docs/24-threat-model.md F, "Tampered release"): the
# release job also publishes
#   SHA256SUMS                                   every binary's sha256
#   <asset>.sigstore.json, SHA256SUMS.sigstore.json
#       cosign keyless signatures (sigstore bundle: signature, certificate,
#       Rekor entry), identity this workflow on the worker-v* tag
#   renox-worker-<version>.provenance.sigstore.json
#       SLSA v1 build provenance for every binary (actions/attest-build-provenance)
# and verifies all of them with cosign in a fresh container before
# publishing. cli/src/worker/verify.ts checks the same identity.
#
# The binary is packaged (#154; crates/renox-runtime/build.rs, README
# "Packaging"): the platform snapshot and Deno's residual lazy sources are
# embedded, so it runs without the cargo registry. Two builds of the same
# source: the first writes them (Runtime::write_packaged), the second embeds
# them (feature renox-runtime/packaged).
#
# Never on a pull request (#189: 28 minutes a run). A merge to main that
# changes this packaging or the per-OS CPU clock (Rust or this file only,
# rule 6) builds and smoke-tests the binary on every target once, without
# publishing it; the path filter does not apply to the tag push.
on:
  push:
    tags:
      - "worker-v*"
    branches:
      - main
    paths:
      - ".github/workflows/release-worker.yml"
      - "crates/renox-runtime/build.rs"
      - "crates/renox-runtime/src/limits/cpu.rs"
      - "crates/renox-runtime/src/runtime.rs"
      - "crates/renox-runtime/tests/packaged.rs"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the worker-v prefix (for example 0.1.0). Empty: build and size check only."
        required: false
        default: ""

permissions:
  contents: read

# The Windows runner would default to pwsh; every script here is bash.
defaults:
  run:
    shell: bash

concurrency:
  group: release-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  # B20 target (docs/14-benchmarks.md): the binary must stay at or under this.
  # The hard ceiling is 128: `cosign verify-blob-attestation` refuses an
  # artefact over 128 MiB (COSIGN_MAX_ATTACHMENT_SIZE), so a larger binary
  # must fail here, in the build job, not in the release job's "Verify in a
  # fresh container" (run 41321600807, #372). 120 keeps headroom under it.
  # The F7 PDF engine (typst) brought the x86_64 Linux build to 133.7 MB;
  # the release is built without the `pdf` feature (below): 107.4 MB
  # (bench/results/2026-11-01-B20-binary-size-bloat-renox-worker.md).
  MAX_BINARY_MB: "120"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          # macOS is off for now: the macos-15-intel runner failed worker-v0.6.0
          # three times on HTTP 504 downloads (setup-bun, rusty_v8, sccache).
          # Restore these two rows and the two in `include` below together.
          # - aarch64-apple-darwin
          # - x86_64-apple-darwin
          # #528: Windows x86_64, default variant only (see exclude).
          - x86_64-pc-windows-msvc
        # #381: `default` without the `pdf` feature, `pdf` with it.
        variant: [default, pdf]
        include:
          # Every target builds natively: step 1 below runs a test binary
          # that writes the snapshot, which a cross build cannot (#139).
          # smoke: native = the binary runs on this runner, so the
          # fetch-worker + renox dev test runs; docker = that plus the
          # clean-container test (Linux).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            smoke: docker
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            smoke: docker
          # #212 restored the macOS rows: the watchdog now cross-checks the
          # per-thread CPU clock with the wall clock (within a slice the
          # isolate thread holds V8 and runs JavaScript, so wall is a tight
          # upper bound on CPU and does not lag like `thread_info` does).
          # `macos-15` (aarch64) is the current ARM runner; macos-14 was
          # retired on 2026-11-02 (actions/runner-images#13518).
          # - target: aarch64-apple-darwin
          #   runner: macos-15
          #   smoke: native
          # - target: x86_64-apple-darwin
          #   runner: macos-15-intel
          #   smoke: native
          # #528: no smoke test: fetch-worker.ts and renox dev do not run on
          # Windows yet (the CLI pin and fetch are F7-106, F7-107).
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            smoke: ''
        exclude:
          # The pdf variant on Windows is a follow-up (#528, out of scope).
          - target: x86_64-pc-windows-msvc
            variant: pdf
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      # B20 (#154): the released binary is built for size on top of the
      # workspace [profile.release] (thin LTO, codegen-units 1, strip).
      # Without these it is 122.8 MB packaged, with them 94.7 MB
      # (bench/results/2026-10-28-B20-binary-size-opt-s-renox-worker.md);
      # B4 is not worse. Both steps below build with them, so the snapshot
      # and the binary come from the same build. panic stays "unwind": a
      # panic on one isolate thread must not abort every tenant on the node.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
      CARGO_PROFILE_RELEASE_LTO: "fat"
      TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
      # Inputs reach the shell through the environment only, never through
      # ${{ }} inside a script.
      INPUT_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF_NAME#worker-v}
          else
            version=$INPUT_VERSION
          fi
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$version' is not semver (expected for example 0.1.0)"
            exit 1
          fi
          # #401: the binary reports the crate version (`renox-worker
          # --version`, `worker_version` at registration). A release whose
          # tag differs from it fails here, before the build: bump
          # crates/renox-cell/Cargo.toml (and Cargo.lock) first, then tag.
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/renox-cell/Cargo.toml | head -n 1)
          if [[ -n "$version" && "$version" != "$crate" ]]; then
            echo "::error::release version $version differs from crates/renox-cell/Cargo.toml version $crate; set the crate version to $version before tagging worker-v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
      - run: rustup show active-toolchain || rustup toolchain install
      # ops/v8-archive.sh checks with sha256sum, which macOS lacks.
      - name: sha256sum on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v sha256sum >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
            chmod +x "$RUNNER_TEMP/bin/sha256sum"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      # Verified prebuilt V8 (ops/v8-checksums.txt, issue #109).
      - name: Fetch and verify the rusty_v8 archive
        run: |
          archive=$(ops/v8-archive.sh fetch "$TARGET" "$RUNNER_TEMP/rusty_v8")
          # Bash prints /d/a/... on Windows; the v8 build script needs a Windows path.
          [[ $TARGET == *windows-msvc ]] && archive=$(cygpath -m "$archive")
          echo "RUSTY_V8_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Check the workspace has a renox-worker binary
        run: |
          if ! cargo metadata --format-version 1 --no-deps --locked \
            | jq -e '[.packages[].targets[] | select(.name == "renox-worker" and (.kind | index("bin")))] | length > 0' >/dev/null; then
            echo "::error::no renox-worker binary target in the workspace (crates/renox-cell, docs/18-build-plan.md P5)"
            exit 1
          fi
      # Step 1 of the packaged build: snapshot and residual lazy sources,
      # written by the same source, features and v8 as the binary below.
      #
      # Features (#372, 2026-11-02): the default variant leaves the `pdf`
      # feature (the typst engine behind ctx.pdf, 26 MiB) out, so the binary
      # fits under the cosign ceiling: on that worker `ctx.pdf.render`
      # answers RENOX_INTERNAL with reason `pdf_unavailable`. The `pdf`
      # variant (#381) adds it and ships compressed (Package below). `media`
      # and `avif` stay in both. The op set is the same with or without
      # `pdf`, so the snapshot is the same; both steps still name the
      # features so they cannot drift apart (crates/renox-runtime/README.md,
      # "Packaging").
      - name: Write the packaged sources
        run: |
          echo "RENOX_PACKAGED_DIR=$RUNNER_TEMP/packaged" >> "$GITHUB_ENV"
          RENOX_PACKAGED_DIR="$RUNNER_TEMP/packaged" cargo test --release --locked \
            -p renox-runtime --test packaged --no-default-features --features v8 \
            -- --ignored --exact write_packaged_sources --nocapture
      - name: Build
        run: |
          features=media,avif,renox-runtime/packaged
          [[ "$VARIANT" == pdf ]] && features=$features,pdf
          cargo build --release --locked -p renox-cell --bin renox-worker \
            --no-default-features --features "$features"
          exe=""; [[ $TARGET == *windows-msvc ]] && exe=.exe
          cp "target/release/renox-worker$exe" "target/renox-worker$exe"
      # #401: the built binary reports the crate version, which the Version
      # step matched against the tag; a mismatch fails the release.
      - name: Version check
        env:
          CRATE_VERSION: ${{ steps.version.outputs.crate }}
        run: |
          exe=""; [[ $TARGET == *windows-msvc ]] && exe=.exe
          got=$(target/renox-worker$exe --version)
          echo "$got" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$got" != "renox-worker $CRATE_VERSION" ]]; then
            echo "::error::renox-worker --version printed '$got', expected 'renox-worker $CRATE_VERSION'"
            exit 1
          fi
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # An unreleased build is 0.0.0-dev, still a semver for fetch-worker.ts.
          exe=""; [[ $TARGET == *windows-msvc ]] && exe=.exe
          name="renox-worker-${VERSION:-0.0.0-dev}-$TARGET"
          mkdir dist
          if [[ "$VARIANT" == pdf ]]; then
            # #381: gzip -n (no name or time in the header), so the .gz is a
            # function of the binary. The unpacked sha256 goes to
            # <name>-pdf.unpacked, which the release job folds into the
            # signed SHA256SUMS.unpacked; it is not a .sha256 asset, so
            # SHA256SUMS lists only what is published.
            gzip -9 -n -c target/renox-worker > "dist/$name-pdf.gz"
            (cd dist && shasum -a 256 "$name-pdf.gz" > "$name-pdf.gz.sha256")
            printf '%s  %s\n' "$(shasum -a 256 target/renox-worker | cut -d ' ' -f 1)" "$name-pdf" > "dist/$name-pdf.unpacked"
          else
            cp "target/renox-worker$exe" "dist/$name$exe"
            if [[ -n "$exe" ]]; then
              # Git Bash's sha256sum writes binary-mode lines ("<hash> *<name>");
              # SHA256SUMS needs the two-space form shasum writes.
              printf '%s  %s\n' "$(sha256sum "dist/$name$exe" | cut -d ' ' -f 1)" "$name$exe" > "dist/$name$exe.sha256"
            else
              (cd dist && shasum -a 256 "$name" > "$name.sha256")
            fi
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renox-worker-${{ matrix.target }}-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
      # #154: the binary serves examples/hello in a clean container, with no
      # cargo registry and no checkout.
      - name: Smoke test in a clean container
        if: matrix.smoke == 'docker'
        run: |
          smoke=$RUNNER_TEMP/smoke
          hash=802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a
          mkdir -p "$smoke/artifacts"
          cp target/renox-worker "$smoke/"
          cp -r "docs/contracts/examples/hello-artifact/$hash" "$smoke/artifacts/"
          cat > "$smoke/worker.toml" <<'TOML'
          listen = "0.0.0.0:18080"
          data_dir = "/tmp/renox/data"
          artifacts_dir = "artifacts"
          routes_file = "routes.json"
          meters_dir = "/tmp/renox/meters"
          logs_dir = "/tmp/renox/logs"
          TOML
          printf '{"version":0,"entries":[{"hostname":"hello.test","tenant_id":"t_hello","deployment_hash":"%s","status":"active","updated_at":1}]}\n' \
            "$hash" > "$smoke/routes.json"
          docker run -d --name renox-smoke -p 127.0.0.1:18080:18080 -v "$smoke:/srv:ro" ubuntu:24.04 \
            sh -c 'test ! -e /root/.cargo && exec /srv/renox-worker --config /srv/worker.toml'
          body=""
          for _ in $(seq 1 60); do
            body=$(curl -fsS -H 'Host: hello.test' http://127.0.0.1:18080/api/hello) && break
            sleep 1
          done
          docker logs renox-smoke 2>&1 | tail -20
          docker rm -f renox-smoke >/dev/null
          if [[ "$body" != '{"ok":true}' ]]; then
            echo "::error::the packaged renox-worker did not serve examples/hello in a clean container (got '$body')"
            exit 1
          fi
          echo "clean container: GET /api/hello -> $body" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.smoke != ''
      # #154: fetch-worker.ts downloads and verifies the asset under the
      # release layout (served locally), and renox dev runs it.
      - name: fetch-worker and renox dev
        if: matrix.smoke != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun install --frozen-lockfile
          v=${VERSION:-0.0.0-dev}
          mkdir -p "$RUNNER_TEMP/release/worker-v$v"
          cp dist/* "$RUNNER_TEMP/release/worker-v$v/"
          (cd "$RUNNER_TEMP/release" && python3 -m http.server 18000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          flag=()
          [[ "$VARIANT" == pdf ]] && flag=(--pdf)
          worker=$(RENOX_RELEASE_BASE=http://127.0.0.1:18000 bun cli/scripts/fetch-worker.ts "${flag[@]}" "$v" | sed 's/.* -> //')
          # #381: the downloaded (for pdf: unpacked) worker is the binary built here.
          cmp "$worker" target/renox-worker
          RENOX_WORKER_PATH="$worker" bun test cli/tests/dev.e2e.test.ts
          # ctx.pdf renders the bilingual invoice on the pdf variant and
          # answers pdf_unavailable on the default one.
          pdf=0
          [[ "$VARIANT" == pdf ]] && pdf=1
          RENOX_WORKER_PATH="$worker" RENOX_WORKER_PDF=$pdf bun test cli/tests/dev-pdf.e2e.test.ts
      # B20, last: a binary over the limit fails the job (and no release is
      # published) after the smoke tests above have still run.
      #
      # #381: for the pdf variant the limit applies to what is signed and
      # verified, the .gz; the unpacked binary is reported, not limited.
      - name: Size check
        run: |
          mib() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1048576 }'; }
          exe=""; [[ $TARGET == *windows-msvc ]] && exe=.exe
          bin=target/renox-worker$exe
          bin_bytes=$(wc -c < "$bin" | tr -d ' ')
          if [[ "$VARIANT" == pdf ]]; then
            asset=$(ls dist/*-pdf.gz)
            bytes=$(wc -c < "$asset" | tr -d ' ')
            echo "renox-worker ($TARGET, pdf): $(mib "$bytes") MB compressed, $(mib "$bin_bytes") MB unpacked (limit $MAX_BINARY_MB MB on the compressed asset)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            bytes=$bin_bytes
            echo "renox-worker ($TARGET): $(mib "$bytes") MB (limit $MAX_BINARY_MB MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if (( bytes > MAX_BINARY_MB * 1048576 )); then
            echo "::error::renox-worker ($VARIANT) is $(mib "$bytes") MB, over the $MAX_BINARY_MB MB B20 limit"
            exit 1
          fi
      - run: sccache --show-stats

  release:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      # Creating a release and uploading assets.
      contents: write
      # Keyless signing (the OIDC token is the signing identity) and the
      # provenance attestation (#129).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # #381: SHA256SUMS lists the published files (the pdf variant as its
      # .gz); SHA256SUMS.unpacked the pdf binaries after gunzip, checked
      # here by unpacking each one.
      - name: SHA256SUMS
        run: |
          cd dist
          cat renox-worker-*.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS
          cat renox-worker-*-pdf.unpacked > SHA256SUMS.unpacked && rm renox-worker-*-pdf.unpacked
          while read -r hash name; do
            got=$(gunzip -c "$name.gz" | sha256sum | cut -d ' ' -f 1)
            [[ "$got" == "$hash" ]] || { echo "::error::$name.gz unpacks to $got, SHA256SUMS.unpacked says $hash"; exit 1; }
          done < SHA256SUMS.unpacked
          cat SHA256SUMS.unpacked
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign
        run: |
          cd dist
          for f in SHA256SUMS SHA256SUMS.unpacked $(cut -d ' ' -f 3 SHA256SUMS); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach the provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/renox-worker-$VERSION.provenance.sigstore.json"
      # #129: the published files verify with cosign alone, in a container
      # that has neither this checkout nor the signing token.
      - name: Verify in a fresh container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$(command -v cosign):/usr/local/bin/cosign:ro" \
            -e REPO="$GITHUB_REPOSITORY" -e V="$VERSION" ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq ca-certificates >/dev/null
              cd /dist
              id="^https://github\.com/$(printf %s "$REPO" | sed "s/\./\\\\./g")/\.github/workflows/release-worker\.yml@refs/tags/worker-v"
              sha256sum -c SHA256SUMS
              for f in SHA256SUMS SHA256SUMS.unpacked $(cut -d " " -f 3 SHA256SUMS); do
                cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
              done
              for f in $(cut -d " " -f 3 SHA256SUMS); do
                cosign verify-blob-attestation --bundle "renox-worker-$V.provenance.sigstore.json" --new-bundle-format \
                  --type slsaprovenance1 --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
              done
            '
          echo "fresh container: SHA256SUMS, cosign signatures and provenance verify" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="worker-v$VERSION"
          # A version with a suffix (0.2.0-rc.1) is a pre-release.
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* "${pre[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "renox-worker $VERSION" \
              --notes "renox-worker $VERSION built from $GITHUB_SHA, signed with sigstore, with SLSA provenance. Verify with sha256sum -c SHA256SUMS and cosign: docs/12-developer-experience.md, \"Installing the CLI\"."
          fi
