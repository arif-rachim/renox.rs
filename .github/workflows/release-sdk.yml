name: Release SDK

# Publishes the SDK package `@renoxium/sdk` (sdk/) to npm (#376;
# docs/12-developer-experience.md, "Installing the CLI"). The CLI and the SDK
# release at one version: this runs on the same `cli-v<version>` tag as
# release-cli.yml, or by hand. A pull request that changes this file, sdk/ or
# the dependency line `renox new` writes, and a manual run without a version,
# build, pack, run the packed-package test and `npm publish --dry-run
# --provenance` without publishing anything.
#
# How it publishes: npm trusted publishing, where the registry accepts this
# workflow's OIDC token as the identity (no long-lived token; configured on
# npmjs.com for package @renoxium/sdk: GitHub Actions, repository arif-rachim/renox.rs,
# workflow release-sdk.yml). Until that is configured, or as a fallback, the
# repository secret NPM_TOKEN (a granular token, publish-only for `@renoxium/sdk`)
# is read by npm from the environment of the publish step only, through an
# .npmrc that names the variable, never its value; nothing prints it.
# Either way the tarball is published with provenance: an attestation that
# ties it to this workflow run, logged in Sigstore and shown on npmjs.com
# (`npm view @renoxium/sdk --json | jq .dist.attestations`).
#
# What a tag must satisfy: sdk/package.json and cli/package.json carry the
# same version, and it equals the tag's. The owner's first publish of the
# name is a manual step (the PR of #376 lists it); this workflow takes over
# from the second version. A version npm already has (0.1.0, published by
# hand for #431) is not published again: the tag's run skips the upload
# with a notice, and the dry run checks a throwaway prerelease of it.
on:
  push:
    tags:
      - "cli-v*"
  pull_request:
    paths:
      - ".github/workflows/release-sdk.yml"
      - "sdk/**"
      - "cli/src/commands/new.ts"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the cli-v prefix (for example 0.1.0); must equal sdk/package.json and cli/package.json. Empty: build, pack, test and dry run only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm provenance and trusted publishing: the OIDC token is the identity.
      id-token: write
    env:
      # Inputs reach the shell through the environment only, never through
      # ${{ }} inside a script.
      INPUT_VERSION: ${{ inputs.version }}
      # A pull request from a fork gets no OIDC token: its dry run cannot
      # attest provenance and runs without --provenance.
      HEAD_IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # npm 11.5.1 or later for trusted publishing; Node 24 ships it. No
      # registry-url here: setup-node would write an .npmrc with a token
      # placeholder that gets in the way of the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF_NAME#cli-v}
          else
            version=$INPUT_VERSION
          fi
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$version' is not semver (expected for example 0.1.0)"
            exit 1
          fi
          sdk=$(jq -r .version sdk/package.json)
          cli=$(jq -r .version cli/package.json)
          if [[ "$sdk" != "$cli" ]]; then
            echo "::error::sdk/package.json is $sdk but cli/package.json is $cli: the SDK and the CLI release at one version"
            exit 1
          fi
          if [[ -n "$version" && "$version" != "$sdk" ]]; then
            echo "::error::release $version but sdk/package.json says $sdk"
            exit 1
          fi
          npm_version=$(npm --version)
          if [[ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "@renoxium/sdk ${version:-0.0.0-dev (dry run)}; sdk/package.json $sdk; npm $npm_version" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bun install --frozen-lockfile
      # `npm pack` runs `prepare` (bun run build): the tarball holds a fresh
      # build. The acceptance of #376: dist/ JS and declarations, README.md
      # and LICENSE, no src/, tests or node_modules.
      - name: Build and pack
        run: |
          cd sdk
          bun run build
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json" | sort > "$RUNNER_TEMP/files.txt"
          bad=$(grep -vE '^(package\.json|README\.md|LICENSE|dist/.*\.(js|d\.ts))$' "$RUNNER_TEMP/files.txt" || true)
          if [[ -n "$bad" ]]; then
            echo "::error::the tarball ships files outside dist/: $(tr '\n' ' ' <<< "$bad")"
            exit 1
          fi
          for f in index kysely drizzle fakes test; do
            grep -qx "dist/$f.js" "$RUNNER_TEMP/files.txt" && grep -qx "dist/$f.d.ts" "$RUNNER_TEMP/files.txt" \
              || { echo "::error::dist/$f.js or dist/$f.d.ts is missing from the tarball"; exit 1; }
          done
          grep -qx LICENSE "$RUNNER_TEMP/files.txt" || { echo "::error::LICENSE is missing from the tarball"; exit 1; }
          {
            echo "tarball: $(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json"), $(jq -r '.[0].size' "$RUNNER_TEMP/pack.json") bytes, $(wc -l < "$RUNNER_TEMP/files.txt") files"
            echo '```'; cat "$RUNNER_TEMP/files.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A fresh `renox new` app outside the monorepo installs the tarball,
      # type-checks against the declarations and runs a test with @renoxium/sdk/fakes.
      - name: Packed-package test
        run: |
          cd sdk
          bun test tests/pack.test.ts
      # A version that is already on the registry is never published again
      # (npm refuses it, and from npm 11 its dry run too). That happens when
      # a release's SDK went out first, as 0.1.0 did by hand (#431), and on
      # every pull request until sdk/package.json moves to the next version.
      - name: Already on the registry?
        id: registry
        run: |
          name=$(jq -r .name sdk/package.json)
          version=$(jq -r .version sdk/package.json)
          # 404 (no such package or version) and a network error both read as
          # "not published"; the publish below fails loudly if that is wrong.
          found=$(npm view "$name@$version" version 2>/dev/null || true)
          if [[ "$found" == "$version" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Everything the publish does, up to the upload: metadata, files,
      # access, and the provenance attestation (OIDC) where a token exists.
      # When the version is already published, the dry run uses a throwaway
      # prerelease of it, so the rest is still checked; package.json is
      # restored afterwards and nothing is committed.
      - name: npm publish --dry-run --provenance
        env:
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.published }}
        run: |
          cd sdk
          flags=(--provenance)
          if [[ "$HEAD_IS_FORK" == "true" ]]; then
            echo "::notice::pull request from a fork: no OIDC token, so the dry run skips --provenance"
            flags=()
          fi
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            cp package.json "$RUNNER_TEMP/package.json.orig"
            trap 'cp "$RUNNER_TEMP/package.json.orig" package.json' EXIT
            dry="$(jq -r .version package.json)-dryrun.$GITHUB_RUN_ID"
            npm pkg set version="$dry"
            # npm 11 refuses a prerelease without a dist-tag, even in a dry run.
            flags+=(--tag dryrun)
            echo "::notice::this version is already on npm; the dry run uses $dry"
          fi
          npm publish --dry-run --access public "${flags[@]}"
      - name: Publish
        if: steps.version.outputs.version != '' && steps.registry.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            # The fallback: npm reads the token from the environment variable
            # the .npmrc names; the value is never written or printed.
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
            echo "publishing with the NPM_TOKEN secret (configure the Trusted Publisher on npmjs.com to retire it)"
          else
            echo "publishing with npm trusted publishing (this workflow's OIDC identity)"
          fi
          npm publish --provenance --access public
          echo "published @renoxium/sdk@$VERSION with provenance: https://www.npmjs.com/package/@renoxium/sdk/v/$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
      # A release tag whose SDK version is already on npm (the CLI part of
      # the release still runs in release-cli.yml): nothing to upload.
      - name: Skip the publish of a version npm already has
        if: steps.version.outputs.version != '' && steps.registry.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::@renoxium/sdk@$VERSION is already on npm; not published again (the next version publishes from its cli-v tag)"
          echo "@renoxium/sdk@$VERSION already on npm: publish skipped" >> "$GITHUB_STEP_SUMMARY"
