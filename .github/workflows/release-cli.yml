name: Release CLI

# Builds the renox CLI as four standalone binaries (bun build --compile, no
# Bun needed on the user's machine) and publishes them, with their SHA-256,
# the install script and the pinned worker version, as a GitHub Release
# (#163; docs/12-developer-experience.md, "Installing the CLI"). Runs only on
# a `cli-v*` tag or by hand, never on docs or Rust changes. A manual run
# without a version, or a pull request that changes this file or the install
# script, builds and smoke-tests without publishing.
#
# Assets on the release tagged cli-v<version>:
#   renox-<version>-<os>-<arch>, renox-<version>-<os>-<arch>.sha256
#       os linux or darwin, arch x64 or arm64
#   worker-version.txt   the renox-worker version this CLI pins
#                        (WORKER_VERSION in cli/scripts/fetch-worker.ts)
#   install.sh           cli/scripts/install.sh
#   SHA256SUMS           the sha256 of every binary and install.sh
#   <asset>.sigstore.json
#       cosign keyless signature of each binary, install.sh and SHA256SUMS
#       (sigstore bundle), identity this workflow on the cli-v* tag (#129)
#   renox-<version>.provenance.sigstore.json
#       SLSA v1 build provenance for the same files
# Every file is verified with cosign in a fresh container before publishing.
# The CLI bakes in the sha256 of the pinned worker per target
# (PINNED_WORKER in cli/src/worker/verify.ts); the build job refuses a
# release whose pins differ from that worker release's .sha256 assets.
on:
  push:
    tags:
      - "cli-v*"
  pull_request:
    paths:
      - ".github/workflows/release-cli.yml"
      - "cli/scripts/install.sh"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the cli-v prefix (for example 0.1.0); must equal cli/package.json. Empty: build and smoke test only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Inputs reach the shell through the environment only, never through
      # ${{ }} inside a script.
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF_NAME#cli-v}
          else
            version=$INPUT_VERSION
          fi
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$version' is not semver (expected for example 0.1.0)"
            exit 1
          fi
          package=$(jq -r .version cli/package.json)
          if [[ -n "$version" && "$version" != "$package" ]]; then
            echo "::error::release $version but cli/package.json says $package"
            exit 1
          fi
          worker=$(bun -e 'import { WORKER_VERSION } from "./cli/scripts/fetch-worker.ts"; console.log(WORKER_VERSION)')
          if [[ ! "$worker" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::WORKER_VERSION in cli/scripts/fetch-worker.ts is not semver: '$worker'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "renox ${version:-0.0.0-dev}, pinned renox-worker $worker" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bun install --frozen-lockfile
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # #129: the worker sha256 the CLI checks before running a worker must be
      # the pinned release's. A tag fails on any difference, a dry run warns.
      # A worker release with SHA256SUMS.sigstore.json has its signature
      # verified too (releases before #129 have none).
      - name: Check the pinned worker hashes
        env:
          WORKER: ${{ steps.version.outputs.worker }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail() {
            if [[ -n "$VERSION" ]]; then echo "::error::$1"; exit 1; else echo "::warning::$1"; fi
          }
          pins=$(bun -e 'import { PINNED_WORKER as p } from "./cli/src/worker/verify.ts"; console.log(p.version); for (const [t, h] of Object.entries(p.sha256)) console.log(`${t} ${h}`)')
          pinned_version=$(head -n 1 <<< "$pins")
          [[ "$pinned_version" == "$WORKER" ]] || fail "PINNED_WORKER.version is $pinned_version, WORKER_VERSION is $WORKER"
          dir=$RUNNER_TEMP/pins
          mkdir -p "$dir"
          if gh release download "worker-v$WORKER" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern 'renox-worker-*.sha256' --pattern 'SHA256SUMS*'; then
            if [[ -f "$dir/SHA256SUMS.sigstore.json" ]]; then
              id="^https://github\.com/$(printf %s "$GITHUB_REPOSITORY" | sed "s/\./\\\\./g")/\.github/workflows/release-worker\.yml@refs/tags/worker-v"
              cosign verify-blob --bundle "$dir/SHA256SUMS.sigstore.json" --certificate-identity-regexp "$id" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$dir/SHA256SUMS" \
                || fail "SHA256SUMS of worker-v$WORKER does not verify"
              (cd "$dir" && for f in renox-worker-*.sha256; do grep -qxF "$(cat "$f")" SHA256SUMS || fail "$f is not in the signed SHA256SUMS"; done)
            else
              echo "::warning::worker-v$WORKER predates signed releases (#129): its .sha256 assets are not signed"
            fi
            tail -n +2 <<< "$pins" | while read -r target hash; do
              f="$dir/renox-worker-$WORKER-$target.sha256"
              [[ -f "$f" ]] || fail "worker-v$WORKER has no $target build, but PINNED_WORKER pins one"
              released=$(cut -d ' ' -f 1 "$f")
              [[ "$released" == "$hash" ]] || fail "PINNED_WORKER pins $hash for $target, worker-v$WORKER has $released"
              echo "pinned $target $hash = worker-v$WORKER"
            done
          else
            fail "no release worker-v$WORKER to check PINNED_WORKER against"
          fi
      - name: Compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORKER: ${{ steps.version.outputs.worker }}
        run: |
          v=${VERSION:-0.0.0-dev}
          mkdir dist
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            name="renox-$v-$t"
            (cd cli && bun build --compile --minify --target="bun-$t" src/main.ts --outfile "../dist/$name")
            (cd dist && sha256sum "$name" > "$name.sha256")
          done
          echo "$WORKER" > dist/worker-version.txt
          cp cli/scripts/install.sh dist/install.sh
          ls -l dist
      # Each binary is the format of its name (a cross-compile that silently
      # fell back to the host target would pass every other check here).
      - name: Check the binary formats
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v=${VERSION:-0.0.0-dev}
          check() {
            out=$(file -b "dist/renox-$v-$1")
            echo "$1: $out"
            [[ "$out" == *"$2"* ]] || { echo "::error::renox-$v-$1 is not $2"; exit 1; }
          }
          check linux-x64 "ELF 64-bit LSB executable, x86-64"
          check linux-arm64 "ELF 64-bit LSB executable, ARM aarch64"
          check darwin-x64 "Mach-O 64-bit x86_64"
          check darwin-arm64 "Mach-O 64-bit arm64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renox-cli
          path: dist/
          if-no-files-found: error
      # The pinned worker must be released before a CLI that pins it: a tag
      # fails here, a pull request or a manual dry run only warns.
      - name: Mirror the pinned worker for the smoke test
        id: worker
        env:
          WORKER: ${{ steps.version.outputs.worker }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release/worker-v$WORKER"
          mkdir -p "$dir"
          asset="renox-worker-$WORKER-x86_64-unknown-linux-gnu"
          if gh release download "worker-v$WORKER" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern "$asset" --pattern "$asset.sha256"; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION" ]]; then
            echo "::error::the pinned worker release worker-v$WORKER has no $asset; release the worker first"
            exit 1
          else
            echo "::warning::worker-v$WORKER has no $asset; the smoke test installs the CLI without a worker"
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi
      # #163: install.sh in a fresh container (no Bun, no checkout) installs
      # and verifies the CLI and its worker; renox new and renox build run.
      # The release layout is served locally (RENOX_RELEASE_BASE).
      - name: Smoke test in a fresh container
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORKER_AVAILABLE: ${{ steps.worker.outputs.available }}
        run: |
          v=${VERSION:-0.0.0-dev}
          mkdir -p "$RUNNER_TEMP/release/cli-v$v"
          cp dist/* "$RUNNER_TEMP/release/cli-v$v/"
          (cd "$RUNNER_TEMP/release" && python3 -m http.server 18000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          no_worker=1
          [[ "$WORKER_AVAILABLE" == 1 ]] && no_worker=0
          docker run --rm --network host -v "$PWD/cli/scripts/install.sh:/install.sh:ro" \
            -e V="$v" -e NO_WORKER="$no_worker" ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null
              if command -v bun >/dev/null; then echo "bun is installed; not a fresh container"; exit 1; fi
              if [ "$NO_WORKER" = 1 ]; then export RENOX_NO_WORKER=1; fi
              RENOX_RELEASE_BASE=http://127.0.0.1:18000 sh /install.sh "$V"
              export PATH="$HOME/.renox/bin:$PATH"
              if [ "$NO_WORKER" = 0 ]; then test -x "$HOME/.renox/bin/renox-worker"; fi
              cd /tmp && renox new smoke && cd smoke && renox build
              ls .renox/artifact/*/manifest.json
            '
          echo "fresh container: install.sh, renox new, renox build ok (worker installed: $((1 - no_worker)))" | tee -a "$GITHUB_STEP_SUMMARY"
          # A binary whose checksum does not match is never installed.
          echo tampered >> "$RUNNER_TEMP/release/cli-v$v/renox-$v-linux-x64"
          if RENOX_NO_WORKER=1 RENOX_INSTALL_DIR="$RUNNER_TEMP/tampered" RENOX_RELEASE_BASE=http://127.0.0.1:18000 \
              sh cli/scripts/install.sh "$v"; then
            echo "::error::install.sh installed a binary whose checksum does not match"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/tampered/renox"

  release:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      # Creating a release and uploading assets.
      contents: write
      # Keyless signing (the OIDC token is the signing identity) and the
      # provenance attestation (#129).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: renox-cli
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          { cat renox-*.sha256; sha256sum install.sh; } > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign
        run: |
          cd dist
          for f in SHA256SUMS $(cut -d ' ' -f 3 SHA256SUMS); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach the provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/renox-$VERSION.provenance.sigstore.json"
      # #129: the published files verify with cosign alone, in a container
      # that has neither this checkout nor the signing token.
      - name: Verify in a fresh container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$(command -v cosign):/usr/local/bin/cosign:ro" \
            -e REPO="$GITHUB_REPOSITORY" -e V="$VERSION" ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq ca-certificates >/dev/null
              cd /dist
              id="^https://github\.com/$(printf %s "$REPO" | sed "s/\./\\\\./g")/\.github/workflows/release-cli\.yml@refs/tags/cli-v"
              sha256sum -c SHA256SUMS
              for f in SHA256SUMS $(cut -d " " -f 3 SHA256SUMS); do
                cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
              done
              for f in $(cut -d " " -f 3 SHA256SUMS); do
                cosign verify-blob-attestation --bundle "renox-$V.provenance.sigstore.json" --new-bundle-format \
                  --type slsaprovenance1 --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
              done
            '
          echo "fresh container: SHA256SUMS, cosign signatures and provenance verify" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cli-v$VERSION"
          worker=$(cat dist/worker-version.txt)
          # A version with a suffix (0.2.0-rc.1) is a pre-release.
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* "${pre[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "renox CLI $VERSION" \
              --notes "renox CLI $VERSION built from $GITHUB_SHA, signed with sigstore, with SLSA provenance; pins renox-worker $worker. Install: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh | sh (verifies the checksums, and the signatures when cosign is installed). Verify by hand: docs/12-developer-experience.md, \"Installing the CLI\"."
          fi
