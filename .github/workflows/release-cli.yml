name: Release CLI

# Builds the renox CLI as five standalone binaries (bun build --compile, no
# Bun needed on the user's machine) and publishes them, with their SHA-256,
# the install script and the pinned worker version, as a GitHub Release
# (#163; docs/12-developer-experience.md, "Installing the CLI"). Runs only on
# a `cli-v*` tag or by hand, never on docs or Rust changes. A manual run
# without a version, or a pull request that changes this file or the install
# script, builds and smoke-tests without publishing.
#
# Assets on the release tagged cli-v<version>:
#   renox-<version>-<os>-<arch>, renox-<version>-<os>-<arch>.sha256
#       os linux or darwin, arch x64 or arm64
#   renox-<version>-windows-x64.exe, renox-<version>-windows-x64.exe.sha256
#   worker-version.txt   the renox-worker version this CLI pins
#                        (WORKER_VERSION in cli/scripts/fetch-worker.ts)
#   install.sh           cli/scripts/install.sh
#   install.ps1          cli/scripts/install.ps1 (Windows PowerShell)
#   SHA256SUMS           the sha256 of every binary, install.sh and install.ps1
#   <asset>.sigstore.json
#       cosign keyless signature of each binary, install.sh and SHA256SUMS
#       (sigstore bundle), identity this workflow on the cli-v* tag (#129)
#   renox-<version>.provenance.sigstore.json
#       SLSA v1 build provenance for the same files
# The npm job then publishes @renoxium/cli and create-renox (#440, D30).
# Every file is verified with cosign in a fresh container before publishing.
# The CLI bakes in the sha256 of the pinned worker per target
# (PINNED_WORKER in cli/src/worker/verify.ts); the build job refuses a
# release whose pins differ from that worker release's .sha256 assets.
on:
  push:
    tags:
      - "cli-v*"
  pull_request:
    paths:
      - ".github/workflows/release-cli.yml"
      - "cli/scripts/install.sh"
      - "cli/scripts/install.ps1"
      - "cli/scripts/compile.ts"
      - "cli/scripts/smoke.sh"
      - "cli/scripts/pack-npm.ts"
      - "cli/npm/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the cli-v prefix (for example 0.1.0); must equal cli/package.json. Empty: build and smoke test only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Inputs reach the shell through the environment only, never through
      # ${{ }} inside a script.
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF_NAME#cli-v}
          else
            version=$INPUT_VERSION
          fi
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$version' is not semver (expected for example 0.1.0)"
            exit 1
          fi
          package=$(jq -r .version cli/package.json)
          if [[ -n "$version" && "$version" != "$package" ]]; then
            echo "::error::release $version but cli/package.json says $package"
            exit 1
          fi
          worker=$(bun -e 'import { WORKER_VERSION } from "./cli/scripts/fetch-worker.ts"; console.log(WORKER_VERSION)')
          if [[ ! "$worker" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::WORKER_VERSION in cli/scripts/fetch-worker.ts is not semver: '$worker'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "renox ${version:-0.0.0-dev}, pinned renox-worker $worker" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bun install --frozen-lockfile
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      # #129: the worker sha256 the CLI checks before running a worker must be
      # the pinned release's. A tag fails on any difference, a dry run warns.
      # A worker release with SHA256SUMS.sigstore.json has its signature
      # verified too (releases before #129 have none).
      - name: Check the pinned worker hashes
        env:
          WORKER: ${{ steps.version.outputs.worker }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail() {
            if [[ -n "$VERSION" ]]; then echo "::error::$1"; exit 1; else echo "::warning::$1"; fi
          }
          pins=$(bun -e 'import { PINNED_WORKER as p } from "./cli/src/worker/verify.ts"; console.log(p.version); for (const [t, h] of Object.entries(p.sha256)) console.log(`${t} ${h}`); for (const [t, h] of Object.entries(p.pdf)) console.log(`pdf ${t} ${h}`)')
          pinned_version=$(head -n 1 <<< "$pins")
          [[ "$pinned_version" == "$WORKER" ]] || fail "PINNED_WORKER.version is $pinned_version, WORKER_VERSION is $WORKER"
          dir=$RUNNER_TEMP/pins
          mkdir -p "$dir"
          if gh release download "worker-v$WORKER" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern 'renox-worker-*.sha256' --pattern 'SHA256SUMS*'; then
            if [[ -f "$dir/SHA256SUMS.sigstore.json" ]]; then
              id="^https://github\.com/$(printf %s "$GITHUB_REPOSITORY" | sed "s/\./\\\\./g")/\.github/workflows/release-worker\.yml@refs/tags/worker-v"
              cosign verify-blob --bundle "$dir/SHA256SUMS.sigstore.json" --certificate-identity-regexp "$id" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$dir/SHA256SUMS" \
                || fail "SHA256SUMS of worker-v$WORKER does not verify"
              (cd "$dir" && for f in renox-worker-*.sha256; do grep -qxF "$(cat "$f")" SHA256SUMS || fail "$f is not in the signed SHA256SUMS"; done)
            else
              echo "::warning::worker-v$WORKER predates signed releases (#129): its .sha256 assets are not signed"
            fi
            tail -n +2 <<< "$pins" | grep -v '^pdf ' | while read -r target hash; do
              # The Windows build is an .exe (#532): its asset is renox-worker-<v>-x86_64-pc-windows-msvc.exe.sha256.
              ext=""; [[ "$target" == *-windows-* ]] && ext=".exe"
              f="$dir/renox-worker-$WORKER-$target$ext.sha256"
              [[ -f "$f" ]] || fail "worker-v$WORKER has no $target build, but PINNED_WORKER pins one"
              released=$(cut -d ' ' -f 1 "$f")
              [[ "$released" == "$hash" ]] || fail "PINNED_WORKER pins $hash for $target, worker-v$WORKER has $released"
              echo "pinned $target $hash = worker-v$WORKER"
            done
            # #381: the pdf variant's pins are the sha256 of the unpacked binary, listed in the signed SHA256SUMS.unpacked.
            pdf_pins=$(grep '^pdf ' <<< "$pins" || true)
            if [[ -z "$pdf_pins" ]]; then
              echo "::notice::no pdf pins in PINNED_WORKER.pdf; nothing to check against SHA256SUMS.unpacked"
            elif [[ ! -f "$dir/SHA256SUMS.unpacked" ]]; then
              fail "PINNED_WORKER.pdf has pins, but worker-v$WORKER has no SHA256SUMS.unpacked"
            else
              if [[ -f "$dir/SHA256SUMS.unpacked.sigstore.json" ]]; then
                id="^https://github\.com/$(printf %s "$GITHUB_REPOSITORY" | sed "s/\./\\\\./g")/\.github/workflows/release-worker\.yml@refs/tags/worker-v"
                cosign verify-blob --bundle "$dir/SHA256SUMS.unpacked.sigstore.json" --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$dir/SHA256SUMS.unpacked" \
                  || fail "SHA256SUMS.unpacked of worker-v$WORKER does not verify"
              else
                fail "SHA256SUMS.unpacked of worker-v$WORKER has no signature"
              fi
              while read -r _ target hash; do
                grep -qxF "$hash  renox-worker-$WORKER-$target-pdf" "$dir/SHA256SUMS.unpacked" \
                  || fail "PINNED_WORKER.pdf pins $hash for $target, worker-v$WORKER has $(grep -F "renox-worker-$WORKER-$target-pdf" "$dir/SHA256SUMS.unpacked" | cut -d ' ' -f 1 || true)"
                echo "pinned pdf $target $hash = worker-v$WORKER"
              done <<< "$pdf_pins"
            fi
          else
            fail "no release worker-v$WORKER to check PINNED_WORKER against"
          fi
      - name: Compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORKER: ${{ steps.version.outputs.worker }}
        run: |
          v=${VERSION:-0.0.0-dev}
          mkdir dist
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            name="renox-$v-$t"
            [[ "$t" == windows-* ]] && name="$name.exe"
            # #448: the official modules and the test harness are embedded (cli/scripts/compile.ts).
            (cd cli && bun scripts/compile.ts --target "bun-$t" --outfile "../dist/$name")
            (cd dist && sha256sum "$name" > "$name.sha256")
          done
          echo "$WORKER" > dist/worker-version.txt
          cp cli/scripts/install.sh dist/install.sh
          cp cli/scripts/install.ps1 dist/install.ps1
          ls -l dist
      # Each binary is the format of its name (a cross-compile that silently
      # fell back to the host target would pass every other check here).
      - name: Check the binary formats
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v=${VERSION:-0.0.0-dev}
          check() {
            out=$(file -b "dist/renox-$v-$1$3")
            echo "$1: $out"
            [[ "$out" == *"$2"* ]] || { echo "::error::renox-$v-$1$3 is not $2"; exit 1; }
          }
          check linux-x64 "ELF 64-bit LSB executable, x86-64"
          check linux-arm64 "ELF 64-bit LSB executable, ARM aarch64"
          check darwin-x64 "Mach-O 64-bit x86_64"
          check darwin-arm64 "Mach-O 64-bit arm64"
          check windows-x64 "PE32+ executable" .exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renox-cli
          path: dist/
          if-no-files-found: error
      # The pinned worker must be released before a CLI that pins it: a tag
      # fails here, a pull request or a manual dry run only warns.
      - name: Mirror the pinned worker for the smoke test
        id: worker
        env:
          WORKER: ${{ steps.version.outputs.worker }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release/worker-v$WORKER"
          mkdir -p "$dir"
          asset="renox-worker-$WORKER-x86_64-unknown-linux-gnu"
          if gh release download "worker-v$WORKER" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern "$asset" --pattern "$asset.sha256"; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION" ]]; then
            echo "::error::the pinned worker release worker-v$WORKER has no $asset; release the worker first"
            exit 1
          else
            echo "::warning::worker-v$WORKER has no $asset; the smoke test installs the CLI without a worker"
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi
      # #163: install.sh in a fresh container (no Bun, no checkout) installs
      # and verifies the CLI and its worker; renox new and renox build run.
      # The release layout is served locally (RENOX_RELEASE_BASE).
      - name: Smoke test in a fresh container
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORKER_AVAILABLE: ${{ steps.worker.outputs.available }}
        run: |
          v=${VERSION:-0.0.0-dev}
          mkdir -p "$RUNNER_TEMP/release/cli-v$v"
          cp dist/* "$RUNNER_TEMP/release/cli-v$v/"
          (cd "$RUNNER_TEMP/release" && python3 -m http.server 18000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          no_worker=1
          [[ "$WORKER_AVAILABLE" == 1 ]] && no_worker=0
          docker run --rm --network host -v "$PWD/cli/scripts/install.sh:/install.sh:ro" \
            -e V="$v" -e NO_WORKER="$no_worker" ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null
              if command -v bun >/dev/null; then echo "bun is installed; not a fresh container"; exit 1; fi
              if [ "$NO_WORKER" = 1 ]; then export RENOX_NO_WORKER=1; fi
              RENOX_RELEASE_BASE=http://127.0.0.1:18000 sh /install.sh "$V"
              export PATH="$HOME/.renox/bin:$PATH"
              if [ "$NO_WORKER" = 0 ]; then test -x "$HOME/.renox/bin/renox-worker"; fi
              cd /tmp && renox new smoke && cd smoke && renox build
              ls .renox/artifact/*/manifest.json
            '
          echo "fresh container: install.sh, renox new, renox build ok (worker installed: $((1 - no_worker)))" | tee -a "$GITHUB_STEP_SUMMARY"
          # A binary whose checksum does not match is never installed.
          echo tampered >> "$RUNNER_TEMP/release/cli-v$v/renox-$v-linux-x64"
          if RENOX_NO_WORKER=1 RENOX_INSTALL_DIR="$RUNNER_TEMP/tampered" RENOX_RELEASE_BASE=http://127.0.0.1:18000 \
              sh cli/scripts/install.sh "$v"; then
            echo "::error::install.sh installed a binary whose checksum does not match"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/tampered/renox"

      # #448: the first hour with the compiled linux-x64 binary, from a
      # directory outside the checkout: new, bun install, check, build, test
      # (one renox process at most), add auth, dev and a request to
      # /api/hello. The app installs this commit's SDK (packed): the npm
      # release of the same version is published by release-sdk.yml only
      # after the tag.
      - name: First-hour smoke test of the linux-x64 binary
        if: steps.worker.outputs.available == '1'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORKER: ${{ steps.version.outputs.worker }}
        run: |
          v=${VERSION:-0.0.0-dev}
          bin="$RUNNER_TEMP/smoke-bin"
          mkdir -p "$bin" "$RUNNER_TEMP/smoke-sdk"
          cp "dist/renox-$v-linux-x64" "$bin/renox"
          cp "$RUNNER_TEMP/release/worker-v$WORKER/renox-worker-$WORKER-x86_64-unknown-linux-gnu" "$bin/renox-worker"
          chmod +x "$bin/renox" "$bin/renox-worker"
          (cd sdk && bun run build && bun pm pack --destination "$RUNNER_TEMP/smoke-sdk")
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/cli/scripts/smoke.sh" "$bin/renox" "$RUNNER_TEMP"/smoke-sdk/*.tgz)
          echo "first-hour smoke test of renox-$v-linux-x64: ok" | tee -a "$GITHUB_STEP_SUMMARY"

  # The compiled windows-x64 binary on a Windows runner, before the release
  # is created. The worker is not built for Windows: renox dev must stop with
  # RENOX_CLI_WORKER_UNAVAILABLE (exit 3); renox new and renox build need none.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    # renox dev serves until stopped: a step that fails to stop it must not hang for hours.
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renox-cli
          path: dist
      - name: renox.exe new, build, dev
        shell: pwsh
        run: |
          $v = if ($env:VERSION) { $env:VERSION } else { '0.0.0-dev' }
          $exe = (Resolve-Path "dist/renox-$v-windows-x64.exe").Path
          Remove-Item Env:RENOX_WORKER_PATH -ErrorAction SilentlyContinue
          $first = (& $exe --version | Out-String).Trim()
          Write-Host $first
          # A tag or dispatch run names the version; a PR run builds 0.0.0-dev
          # file names from the package version, so only the prefix is checked.
          $want = if ($env:VERSION) { "renox $v" } else { 'renox ' }
          if ($LASTEXITCODE -ne 0 -or -not $first.StartsWith($want)) { throw "--version printed '$first', expected '$want'" }
          $work = Join-Path $env:RUNNER_TEMP 'smoke-windows'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Set-Location $work
          & $exe new smoke
          if ($LASTEXITCODE -ne 0) { throw "renox new exited $LASTEXITCODE" }
          Set-Location smoke
          & $exe build
          if ($LASTEXITCODE -ne 0) { throw "renox build exited $LASTEXITCODE" }
          # #532: the CLI pins the Windows worker, so renox dev downloads it
          # into ~/.renox/bin, checks its sha256 and serves the app.
          $log = Join-Path $work 'dev.log'
          $err = Join-Path $work 'dev.err.log'
          $dev = Start-Process -FilePath $exe -ArgumentList 'dev' -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err
          if (-not $dev) { throw 'renox dev did not start' }
          # Up to about 2 minutes: the first run downloads the worker.
          $code = 0
          for ($i = 0; $i -lt 120 -and $code -ne 200 -and -not $dev.HasExited; $i++) {
            try { $code = (Invoke-WebRequest -Uri 'http://localhost:8787/api/health' -UseBasicParsing -TimeoutSec 2).StatusCode } catch { Start-Sleep -Milliseconds 500 }
          }
          # Stop renox dev and its renox-worker.exe: the whole process tree.
          if (-not $dev.HasExited) { & taskkill /F /T /PID $dev.Id | Out-Null }
          Write-Host '--- renox dev output'
          Get-Content -LiteralPath $log, $err -ErrorAction SilentlyContinue | Write-Host
          if ($code -ne 200) { throw "renox dev: GET /api/health did not answer 200 (last: $code)" }
          Write-Host "GET /api/health -> $code"
          "windows-x64 smoke test of renox-${v}: ok (renox dev served /api/health with the pinned worker)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          # The runner exits with the last native exit code (taskkill's).
          exit 0

  # #440, D30: @renoxium/cli (one bundled file for Bun) and create-renox on
  # npm, at the version of the tag. A tag run publishes after the GitHub
  # Release exists; a pull request or a manual run without a version only
  # packs and runs `npm publish --dry-run` (the release job is skipped then,
  # which `!failure()` allows). A version npm already has is not published
  # again (npm refuses it); its dry run uses a throwaway prerelease.
  npm:
    needs: [build, release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm provenance and trusted publishing: the OIDC token is the identity.
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # A pull request from a fork gets no OIDC token: its dry run cannot
      # attest provenance and runs without --provenance.
      HEAD_IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # npm 11.5.1 or later for trusted publishing; Node 24 ships it. No
      # registry-url here: setup-node would write an .npmrc with a token
      # placeholder that gets in the way of the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Pack
        run: bun cli/scripts/pack-npm.ts
      - name: Publish (tag) or dry run
        run: |
          flags=(--provenance)
          if [[ "$HEAD_IS_FORK" == "true" ]]; then
            echo "::notice::pull request from a fork: no OIDC token, so the dry run skips --provenance"
            flags=()
          fi
          for dir in dist/npm/cli dist/npm/create-renox; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            # 404 (no such package or version) and a network error both read as
            # "not published"; the publish fails loudly if that is wrong.
            found=$(npm view "$name@$version" version 2>/dev/null || true)
            if [[ -n "$VERSION" ]]; then
              if [[ "$found" == "$version" ]]; then
                echo "::notice::$name@$version is already on npm; not publishing it again"
                echo "$name@$version is already on npm" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              (cd "$dir" && npm publish --provenance --access public)
              echo "published $name@$version" >> "$GITHUB_STEP_SUMMARY"
            else
              dry=(--dry-run --access public "${flags[@]}")
              if [[ "$found" == "$version" ]]; then
                # npm 11 refuses a dry run of a published version, and a prerelease without a dist-tag.
                (cd "$dir" && npm pkg set version="$version-dryrun.$GITHUB_RUN_ID")
                dry+=(--tag dryrun)
                echo "::notice::$name@$version is already on npm; the dry run uses $version-dryrun.$GITHUB_RUN_ID"
              fi
              (cd "$dir" && npm publish "${dry[@]}")
            fi
          done

  release:
    needs: [build, smoke-windows]
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      # Creating a release and uploading assets.
      contents: write
      # Keyless signing (the OIDC token is the signing identity) and the
      # provenance attestation (#129).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renox-cli
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          { cat renox-*.sha256; sha256sum install.sh install.ps1; } > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Sign
        run: |
          cd dist
          for f in SHA256SUMS $(cut -d ' ' -f 3 SHA256SUMS); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach the provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/renox-$VERSION.provenance.sigstore.json"
      # #129: the published files verify with cosign alone, in a container
      # that has neither this checkout nor the signing token.
      - name: Verify in a fresh container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$(command -v cosign):/usr/local/bin/cosign:ro" \
            -e REPO="$GITHUB_REPOSITORY" -e V="$VERSION" ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq ca-certificates >/dev/null
              cd /dist
              id="^https://github\.com/$(printf %s "$REPO" | sed "s/\./\\\\./g")/\.github/workflows/release-cli\.yml@refs/tags/cli-v"
              sha256sum -c SHA256SUMS
              for f in SHA256SUMS $(cut -d " " -f 3 SHA256SUMS); do
                cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
              done
              for f in $(cut -d " " -f 3 SHA256SUMS); do
                cosign verify-blob-attestation --bundle "renox-$V.provenance.sigstore.json" --new-bundle-format \
                  --type slsaprovenance1 --certificate-identity-regexp "$id" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
              done
            '
          echo "fresh container: SHA256SUMS, cosign signatures and provenance verify" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cli-v$VERSION"
          worker=$(cat dist/worker-version.txt)
          # A version with a suffix (0.2.0-rc.1) is a pre-release.
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* "${pre[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "renox CLI $VERSION" \
              --notes "renox CLI $VERSION built from $GITHUB_SHA, signed with sigstore, with SLSA provenance; pins renox-worker $worker. Install: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh | sh (verifies the checksums, and the signatures when cosign is installed). Verify by hand: docs/12-developer-experience.md, \"Installing the CLI\"."
          fi
