name: lighthouse

# Lighthouse accessibility and performance of the home-services dispatch board
# and technician visit page, English and Arabic, on the phone profile
# (bench/lighthouse, #725): nightly and on demand. `make lighthouse` fails when
# a median accessibility is under 90 or a performance under 80. Not part of
# the PR checks.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: lighthouse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Playwright's version for its Chromium; the package lives outside the
      # repository (the repository has no Playwright dependency).
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Lighthouse runs in Node (>= 22.19), bench/lighthouse/lh-node.mjs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Fetch the pinned worker (PDF variant)
        run: |
          worker=$(bun cli/scripts/fetch-worker.ts --pdf | sed 's/.* -> //')
          echo "RENOX_WORKER_PATH=$worker" >> "$GITHUB_ENV"
      - name: Install Playwright and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Lighthouse
        run: make lighthouse
      # Every page in Arabic at 390 and 1280 px: no sideways scroll, lang/dir, the Arabic face (#729).
      - name: RTL audit
        run: bun bench/lighthouse/rtl-audit.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-home-services
          path: |
            bench/results/*-lighthouse-home-services.md
            bench/results/raw/lighthouse/
          if-no-files-found: warn
