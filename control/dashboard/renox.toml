[app]
name = "dashboard"
timezone = "Asia/Dubai"

# ADR D23: the dashboard is an ordinary tenant. It reaches the control API at
# its public hostname, allowlisted here like any other host, with the
# signed-in user's own token. DASHBOARD_KEY (at least 32 characters) derives
# the key that encrypts stored sign-ins; RENOX_API_URL (optional, https only)
# points at another API, whose host must then be added to `network`.
[permissions]
network = ["api.renox.app"]
secrets = ["DASHBOARD_KEY", "OPS_CONSOLE", "RENOX_API_URL"]

# #325: the card form of /billing is Stripe's own (public/billing.js): its
# script, its frames, and its API calls from the browser. Card numbers never
# reach the dashboard.
[security.csp]
script_src = ["https://js.stripe.com"]
frame_src = ["https://js.stripe.com", "https://hooks.stripe.com"]
connect_src = ["https://api.stripe.com"]
