[app]
name = "dashboard"
timezone = "Asia/Dubai"

# ADR D23: the dashboard is an ordinary tenant. It reaches the control API at
# its public hostname, allowlisted here like any other host, with the
# signed-in user's own token. DASHBOARD_KEY (at least 32 characters) derives
# the key that encrypts stored sign-ins; RENOX_API_URL (optional, https only)
# points at another API, whose host must then be added to `network`.
# RENOX_CAPTCHA_SITE_KEY (optional, #540) is the public Cloudflare Turnstile
# site key of the sign-up; empty shows no widget.
# RENOX_PLATFORM_DOMAIN (optional) is the API's CONTROL_PLATFORM_DOMAIN, shown
# as `<name>.<domain>` on the new-app page; default `renoxium.app`.
[permissions]
network = ["api.renoxium.com"]
secrets = ["DASHBOARD_KEY", "OPS_CONSOLE", "RENOX_API_URL", "RENOX_CAPTCHA_SITE_KEY", "RENOX_PLATFORM_DOMAIN"]

# #325: the card form of /billing is Stripe's own (public/billing.js): its
# script, its frames, and its API calls from the browser. Card numbers never
# reach the dashboard.
[security.csp]
# #540: the sign-up's Turnstile widget (script and frame) is Cloudflare's own;
# its token goes to the control API with the form, so connect_src is unchanged.
script_src = ["https://js.stripe.com", "https://challenges.cloudflare.com"]
frame_src = ["https://js.stripe.com", "https://hooks.stripe.com", "https://challenges.cloudflare.com"]
# #445: sign-in, sign-up, the second factor, password reset, device approval
# and tokens are called from the browser (public/account.js; ADR D23: the
# dashboard must not proxy them). A RENOX_API_URL elsewhere needs its origin
# here too.
connect_src = ["https://api.stripe.com", "https://api.renoxium.com"]
