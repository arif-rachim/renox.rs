<r-layout use="main">
  <r-group slot="title"><r-t key="dash.forgot.title" /> · <r-t key="dash.brand" /></r-group>
  <section class="narrow" id="account" :data-api="api" data-page="forgot">
    <h1><r-t key="dash.forgot.title" /></h1>
    <div class="problem" role="alert" id="account-error" hidden><p><strong></strong></p></div>
    <noscript><p class="problem"><r-t key="dash.account.needs_js" /></p></noscript>
    <form id="forgot-form" class="stack">
      <p><r-t key="dash.forgot.intro" /></p>
      <label><r-t key="dash.common.email" /> <input type="email" name="email" required autocomplete="email" maxlength="254" autofocus></label>
      <button type="submit" class="primary"><r-t key="dash.forgot.submit" /></button>
    </form>
    <p class="notice" id="forgot-sent" hidden><r-t key="dash.forgot.sent" /></p>
    <p><a href="/signin"><r-t key="dash.forgot.back" /></a></p>
    <div hidden id="account-msgs">
      <span data-k="too_many"><r-t key="dash.account.too_many" /></span>
      <span data-k="unreachable"><r-t key="dash.account.unreachable" /></span>
      <span data-k="failed"><r-t key="dash.account.failed" /></span>
    </div>
    <script src="/account.js" defer></script>
  </section>
</r-layout>
