<r-layout use="main">
  <r-group slot="title"><r-t key="dash.nav.secrets" /> · {{ app }} · <r-t key="dash.brand" /></r-group>
  <r-group slot="nav"><x-app-nav :app="app" :section="section" /></r-group>
  <section id="page" r-fragment="page">
    <h1><r-t key="dash.nav.secrets" /></h1>
    <x-problem :problem="problem" r-if="problem" />
    <p class="notice" r-if="notice">{{ notice }}</p>
    <p class="problem" r-if="form_error">{{ form_error }}</p>
    <x-problem :problem="action_problem" r-if="action_problem" />
    <r-group r-if="!problem">
      <table class="list">
        <thead><tr><th><r-t key="dash.common.name" /></th><th><r-t key="dash.secrets.updated" /></th><th><r-t key="dash.common.actions" /></th></tr></thead>
        <tbody>
          <tr r-for="s in secrets">
            <td><code>{{ s.name }}</code></td>
            <td>{{ s.updated }}</td>
            <td>
              <x-form action="remove" hx-target="#page" hx-swap="outerHTML" :hx-confirm="'dash.secrets.confirm_delete' | t({'name': s.name})" class="inline">
                <input type="hidden" name="name" :value="s.name">
                <button type="submit"><r-t key="dash.common.delete" /></button>
              </x-form>
            </td>
          </tr>
          <tr r-empty="secrets"><td colspan="3"><r-t key="dash.secrets.empty" /></td></tr>
        </tbody>
      </table>
      <p class="muted"><r-t key="dash.secrets.set" /> v{{ version }}. <r-t key="dash.secrets.encrypted" /></p>
      <h2><r-t key="dash.secrets.add" /></h2>
      <x-form action="set" hx-target="#page" hx-swap="outerHTML" class="row">
        <label><r-t key="dash.common.name" /> <input name="name" required maxlength="64" pattern="[A-Z][A-Z0-9_]*" autocomplete="off" spellcheck="false"></label>
        <label><r-t key="dash.secrets.value" /> <input type="password" name="value" required minlength="8" autocomplete="off" spellcheck="false"></label>
        <button type="submit"><r-t key="dash.common.save" /></button>
      </x-form>
    </r-group>
  </section>
</r-layout>
