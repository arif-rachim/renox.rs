<r-layout use="main">
  <r-group slot="title">Secrets · {{ app }} · Renox dashboard</r-group>
  <r-group slot="nav"><x-app-nav :app="app" :section="section" /></r-group>
  <section id="page" r-fragment="page">
    <h1>Secrets</h1>
    <x-problem :problem="problem" r-if="problem" />
    <p class="notice" r-if="notice">{{ notice }}</p>
    <p class="problem" r-if="form_error">{{ form_error }}</p>
    <x-problem :problem="action_problem" r-if="action_problem" />
    <r-group r-if="!problem">
      <table class="list">
        <thead><tr><th>Name</th><th>Updated</th><th>Actions</th></tr></thead>
        <tbody>
          <tr r-for="s in secrets">
            <td><code>{{ s.name }}</code></td>
            <td>{{ s.updated }}</td>
            <td>
              <x-form action="remove" hx-target="#page" hx-swap="outerHTML" hx-confirm="Delete {{ s.name }}? Deployments that declare it lose it from the next deploy or rollback." class="inline">
                <input type="hidden" name="name" :value="s.name">
                <button type="submit">Delete</button>
              </x-form>
            </td>
          </tr>
          <tr r-empty="secrets"><td colspan="3">No secrets yet.</td></tr>
        </tbody>
      </table>
      <p class="muted">Secret set v{{ version }}. Values are encrypted at rest, injected per deployment, and never shown again.</p>
      <h2>Add or replace a secret</h2>
      <x-form action="set" hx-target="#page" hx-swap="outerHTML" class="row">
        <label>Name <input name="name" required maxlength="64" pattern="[A-Z][A-Z0-9_]*" autocomplete="off" spellcheck="false"></label>
        <label>Value <input type="password" name="value" required minlength="8" autocomplete="off" spellcheck="false"></label>
        <button type="submit">Save</button>
      </x-form>
    </r-group>
  </section>
</r-layout>
