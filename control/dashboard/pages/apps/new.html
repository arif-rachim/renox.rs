<r-layout use="main">
  <r-group slot="title"><r-t key="dash.apps.new" /> · <r-t key="dash.brand" /></r-group>
  <section id="page" r-fragment="page" class="narrow">
    <r-group r-if="created">
      <h1>{{ created.app }} <r-t key="dash.new.is_live" /></h1>
      <p class="notice"><r-t key="dash.new.deployed_from" /> {{ created.template }} <r-t key="dash.new.template_link" /> <a :href="created.url">{{ created.url }}</a></p>
      <h2><r-t key="dash.new.locally" /></h2>
      <ol>
        <li><code>bunx renox new {{ created.app }} --template {{ created.template }}</code></li>
        <li><code>bunx renox dev</code></li>
        <li><code>bunx renox deploy</code></li>
      </ol>
      <p><a href="/apps/{{ created.app }}"><r-t key="dash.common.open" /> {{ created.app }}</a></p>
    </r-group>
    <r-group r-if="!created">
      <h1><r-t key="dash.apps.new" /></h1>
      <p class="problem" r-if="form_error">{{ form_error }}</p>
      <x-problem :problem="action_problem" r-if="action_problem" />
      <x-form action="create" hx-target="#page" hx-swap="outerHTML">
        <label><r-t key="dash.common.name" /> <input name="name" :value="name" required maxlength="50" pattern="[a-z][a-z0-9-]*" spellcheck="false"></label>
        <fieldset>
          <legend><r-t key="dash.new.template" /></legend>
          <label r-for="t in templates"><input type="radio" name="template" :value="t.id" :checked="t.id == template"> <strong>{{ t.name }}</strong> <span class="muted">{{ t.about }}</span></label>
        </fieldset>
        <p class="muted"><r-t key="dash.new.we_create" /> <code>&lt;name&gt;.renox.app</code> <r-t key="dash.new.we_create_after" /></p>
        <button type="submit"><r-t key="dash.apps.create" /></button>
      </x-form>
    </r-group>
  </section>
</r-layout>
