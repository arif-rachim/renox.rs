<r-layout use="main">
  <r-group slot="title"><r-t key="dash.signup.title" /> · <r-t key="dash.brand" /></r-group>
  <section class="narrow" id="account" :data-api="api" data-page="signup">
    <h1><r-t key="dash.signup.heading" /></h1>
    <div class="problem" role="alert" r-if="error"><p><strong>{{ error }}</strong></p></div>
    <div class="problem" role="alert" id="account-error" hidden><p><strong></strong></p></div>
    <p class="notice" role="status" id="account-notice" hidden></p>
    <noscript><p class="problem"><r-t key="dash.account.needs_js" /></p></noscript>
    <p class="notice" id="signup-sent" hidden><r-t key="dash.signup.sent" /> <strong id="sent-email"></strong> <r-t key="dash.signup.sent_after" /></p>
    <form id="signup-form" class="stack">
      <label><r-t key="dash.common.email" /> <input type="email" name="email" required autocomplete="email" maxlength="254" aria-describedby="hint-email"></label>
      <small class="muted hint" id="hint-email"><r-t key="dash.signup.hint_email" /> <r-t key="dash.signup.example" /> <code>you@example.com</code>.</small>
      <label><r-t key="dash.common.password" /> <input type="password" name="password" required minlength="12" maxlength="1024" autocomplete="new-password" aria-describedby="hint-password"></label>
      <small class="muted hint" id="hint-password"><r-t key="dash.signup.hint_password" /> <r-t key="dash.signup.example" /> <code>three dates and a coffee</code>.</small>
      <label><r-t key="dash.signup.workspace_name" /> <input name="tenant_name" required maxlength="128" autocomplete="organization" aria-describedby="hint-name"></label>
      <small class="muted hint" id="hint-name"><r-t key="dash.signup.hint_name" /> <r-t key="dash.signup.example" /> <code>Al Noor Clinic</code>. <r-t key="dash.signup.hint_name_after" /></small>
      <label><r-t key="dash.signup.workspace_id" /> <input name="tenant_id" required pattern="[a-z0-9][a-z0-9_-]*" maxlength="63" spellcheck="false" autocapitalize="none" dir="ltr" aria-describedby="hint-id id-error"></label>
      <small class="muted hint" id="hint-id"><r-t key="dash.signup.hint_id" /> <r-t key="dash.signup.example" /> <code>al-noor-clinic</code>.</small>
      <small class="problem" id="id-error" role="status" hidden></small>
      <label><input type="checkbox" name="dpa" value="yes" required aria-describedby="hint-dpa"> <r-t key="dash.signup.accept" /> <a href="/legal/dpa"><r-t key="dash.signup.dpa_link" /></a> <r-t key="dash.signup.and" /> <a href="/legal/terms"><r-t key="dash.signup.terms_link" /></a>.</label>
      <small class="muted hint" id="hint-dpa"><r-t key="dash.signup.hint_dpa" /></small>
      <!-- #540: Cloudflare Turnstile, only when RENOX_CAPTCHA_SITE_KEY is set. The widget adds the hidden cf-turnstile-response field; public/account.js sends it as captcha_token. -->
      <div class="cf-turnstile" id="captcha" r-if="captcha_site_key" :data-sitekey="captcha_site_key" :data-language="captcha_lang" data-callback="renoxCaptchaOk" data-error-callback="renoxCaptchaError"></div>
      <button type="submit" class="primary"><r-t key="dash.signup.submit" /></button>
    </form>
    <p class="muted" id="signup-more"><r-t key="dash.signup.have_account" /> <a href="/signin"><r-t key="dash.common.sign_in" /></a>. <r-t key="dash.signup.agreement_note" /></p>
    <div hidden id="account-msgs">
      <span data-k="err_password"><r-t key="dash.signup.err_password" /></span>
      <span data-k="err_accept"><r-t key="dash.signup.err_accept" /></span>
      <span data-k="err_taken"><r-t key="dash.signup.err_taken" /></span>
      <span data-k="err_workspace"><r-t key="dash.signup.err_workspace" /></span>
      <span data-k="id_bad_char"><r-t key="dash.signup.id_bad_char" /></span>
      <span data-k="id_bad_start"><r-t key="dash.signup.id_bad_start" /></span>
      <span data-k="id_space"><r-t key="dash.signup.id_space" /></span>
      <span data-k="id_try"><r-t key="dash.signup.id_try" /></span>
      <span data-k="err_disposable"><r-t key="dash.signup.err_disposable" /></span>
      <span data-k="err_too_many"><r-t key="dash.signup.err_too_many" /></span>
      <span data-k="captcha_required"><r-t key="dash.signup.captcha_required" /></span>
      <span data-k="captcha_rejected"><r-t key="dash.signup.captcha_rejected" /></span>
      <span data-k="captcha_error"><r-t key="dash.signup.captcha_error" /></span>
      <span data-k="too_many"><r-t key="dash.account.too_many" /></span>
      <span data-k="unreachable"><r-t key="dash.account.unreachable" /></span>
      <span data-k="failed"><r-t key="dash.account.failed" /></span>
    </div>
    <script src="/account.js" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer r-if="captcha_site_key"></script>
  </section>
</r-layout>
