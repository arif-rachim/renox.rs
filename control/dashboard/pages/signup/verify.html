<r-layout use="main">
  <r-group slot="title"><r-t key="dash.verify.title" /> · <r-t key="dash.brand" /></r-group>
  <section class="narrow" id="account" :data-api="api" data-page="verify">
    <h1><r-t key="dash.verify.title" /></h1>
    <div class="problem" role="alert" id="account-error" hidden><p><strong></strong></p></div>
    <p class="notice" role="status" id="account-notice" hidden></p>
    <noscript><p class="problem"><r-t key="dash.account.needs_js" /></p></noscript>
    <p class="notice" id="verified" hidden><r-t key="dash.verify.done" /> <r-t key="dash.verify.workspace" /> <code id="verified-tenant"></code> <r-t key="dash.verify.ready" />. <r-t key="dash.verify.continuing" /></p>
    <h2><r-t key="dash.verify.cli_title" /></h2>
    <p><r-t key="dash.verify.cli_intro" /></p>
    <pre data-lang="sh">curl -fsSL {{ install_url }} | sh
renox login</pre>
    <p class="muted"><r-t key="dash.install.windows" /></p>
    <p><a href="/signin"><r-t key="dash.verify.sign_in_here" /></a></p>
    <div hidden id="account-msgs">
      <span data-k="err_incomplete"><r-t key="dash.verify.err_incomplete" /></span>
      <span data-k="err_used"><r-t key="dash.verify.err_used" /></span>
      <span data-k="err_attempts"><r-t key="dash.verify.err_attempts" /></span>
      <span data-k="verifying"><r-t key="dash.verify.verifying" /></span>
      <span data-k="too_many"><r-t key="dash.account.too_many" /></span>
      <span data-k="unreachable"><r-t key="dash.account.unreachable" /></span>
      <span data-k="failed"><r-t key="dash.account.failed" /></span>
    </div>
    <script src="/account.js" defer></script>
  </section>
</r-layout>
