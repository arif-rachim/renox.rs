<r-layout use="main">
  <r-group slot="title">Verify your address · Renox dashboard</r-group>
  <section class="narrow">
    <h1>Verify your address</h1>
    <r-group r-if="verified">
      <p class="notice">Your address is verified<span r-if="tenant_id"> and the workspace <code>{{ tenant_id }}</code> is ready</span>.</p>
      <p>Next: sign in with the CLI (<code>bunx renox login</code>), then <a href="/signin">sign in here</a> with the token it creates, and create your first app.</p>
    </r-group>
    <r-group r-if="!verified">
      <div class="problem" role="alert" r-if="error"><p><strong>{{ error }}</strong></p></div>
      <form method="post" action="/signup/verify" id="verify">
        <x-csrf />
        <input type="hidden" name="token" id="verify-token">
        <button type="submit">Verify</button>
      </form>
      <script>
        // The token is in the fragment (#token=…): copy it into the form and submit once.
        (() => {
          const m = /(?:^|[#&])token=([a-z2-7]{32})(?:&|$)/.exec(location.hash);
          const input = document.getElementById("verify-token");
          if (m === null || input === null || sessionStorage.getItem("renox-verify") === m[1]) return;
          sessionStorage.setItem("renox-verify", m[1]);
          input.value = m[1];
          document.getElementById("verify").submit();
        })();
      </script>
    </r-group>
  </section>
</r-layout>
