<r-layout use="main">
  <r-group slot="title"><r-t key="dash.reset.title" /> · <r-t key="dash.brand" /></r-group>
  <section class="narrow" id="account" :data-api="api" data-page="reset">
    <h1><r-t key="dash.reset.title" /></h1>
    <div class="problem" role="alert" id="account-error" hidden><p><strong></strong></p></div>
    <noscript><p class="problem"><r-t key="dash.account.needs_js" /></p></noscript>
    <form id="reset-form" class="stack">
      <label><r-t key="dash.reset.new_password" /> <input type="password" name="password" required minlength="12" maxlength="1024" autocomplete="new-password" autofocus></label>
      <label><r-t key="dash.reset.again" /> <input type="password" name="again" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
      <button type="submit" class="primary"><r-t key="dash.reset.submit" /></button>
    </form>
    <div id="reset-done" hidden>
      <p class="notice"><r-t key="dash.reset.done" /></p>
      <p><a class="button primary" href="/signin"><r-t key="dash.common.sign_in" /></a></p>
    </div>
    <div hidden id="account-msgs">
      <span data-k="err_incomplete"><r-t key="dash.verify.err_incomplete" /></span>
      <span data-k="err_used"><r-t key="dash.reset.err_used" /></span>
      <span data-k="err_password"><r-t key="dash.signup.err_password" /></span>
      <span data-k="err_mismatch"><r-t key="dash.reset.err_mismatch" /></span>
      <span data-k="too_many"><r-t key="dash.account.too_many" /></span>
      <span data-k="unreachable"><r-t key="dash.account.unreachable" /></span>
      <span data-k="failed"><r-t key="dash.account.failed" /></span>
    </div>
    <script src="/account.js" defer></script>
  </section>
</r-layout>
