<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title><slot name="title">Renox dashboard</slot></title>
  <link rel="stylesheet" href="/app.css">
  <script src="/htmx-2.0.4.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/apps"><strong>Renox</strong></a>
    <a href="/apps" r-if="signed_in">Apps</a>
    <span class="spacer"></span>
    <span class="muted" r-if="signed_in">API {{ api_host }}</span>
    <form method="post" action="/signout" class="inline" r-if="signed_in">
      <x-csrf />
      <button type="submit" class="link">Sign out</button>
    </form>
  </header>
  <div class="frame">
    <slot name="nav" />
    <main>
      <slot />
    </main>
  </div>
</body>
</html>
