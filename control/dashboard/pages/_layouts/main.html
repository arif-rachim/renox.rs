<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title><slot name="title">{{ 'dash.brand' | t }}</slot></title>
  <link rel="stylesheet" href="/renox-ui.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/htmx-2.0.4.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/apps">Renoxium</a>
    <span class="pill quiet" r-if="tenant_id">{{ tenant_id }}</span>
    <span class="spacer"></span>
    <a href="https://renoxium.com/docs" r-if="!signed_in"><r-t key="dash.nav.docs" /></a>
    <nav class="lang" :aria-label="'dash.nav.language' | t"><a href="?lang=en" lang="en">English</a> <a href="?lang=ar" lang="ar">العربية</a></nav>
    <a href="/account" r-if="signed_in"><r-t key="dash.nav.account" /></a>
    <form method="post" action="/signout" class="inline" r-if="signed_in">
      <x-csrf />
      <button type="submit" class="link"><r-t key="dash.nav.sign_out" /></button>
    </form>
    <a class="button primary" href="/signin" r-if="!signed_in && here != 'signin'"><r-t key="dash.common.sign_in" /></a>
  </header>
  <p class="banner impersonation" role="alert" r-if="impersonation"><r-t key="dash.banner.access" /> <code>{{ impersonation.tenant_id }}</code> (<r-t key="dash.banner.break_glass" /> <code>{{ impersonation.impersonation_id }}</code>) <r-t key="dash.banner.until" /> {{ impersonation.until }}. <r-t key="dash.banner.audited" /></p>
  <div class="frame">
    <nav class="side" :aria-label="'dash.nav.main' | t" r-if="signed_in">
      <a href="/apps" :class="{ current: nav == 'apps' }"><r-t key="dash.nav.apps" /></a>
      <a href="/usage" :class="{ current: nav == 'usage' }"><r-t key="dash.nav.usage" /></a>
      <a href="/billing" :class="{ current: nav == 'billing' }"><r-t key="dash.nav.billing" /></a>
      <a href="/account" :class="{ current: nav == 'account' }"><r-t key="dash.nav.account" /></a>
      <a href="/account/security" :class="{ current: nav == 'security' }"><r-t key="dash.nav.security" /></a>
      <a href="/account/tokens" :class="{ current: nav == 'tokens' }"><r-t key="dash.nav.tokens" /></a>
      <a href="/ops/registry" :class="{ current: nav == 'ops' }" r-if="ops_on"><r-t key="dash.nav.ops" /></a>
      <a href="https://renoxium.com/docs" class="docs-link"><r-t key="dash.nav.docs" /></a>
    </nav>
    <main>
      <slot name="nav" />
      <slot />
    </main>
  </div>
</body>
</html>
