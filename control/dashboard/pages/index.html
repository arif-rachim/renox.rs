<r-layout use="main">
  <r-group slot="title"><r-t key="dash.home.title" /> · <r-t key="dash.brand" /></r-group>
  <section class="narrow">
    <h1><r-t key="dash.home.title" /></h1>
    <ol class="checklist">
      <li r-for="s in steps" :class="{ done: s.done }">
        <span r-if="s.done">✓</span><span r-if="!s.done">○</span>
        <a :href="s.href" r-if="s.href">{{ s.text }}</a><span r-if="!s.href">{{ s.text }}</span>
      </li>
    </ol>
    <p class="muted"><r-t key="dash.home.hint" /></p>
  </section>
</r-layout>
