<r-layout use="main">
  <r-group slot="title"><r-t key="dash.ops.operator" /> · <r-t key="dash.ops.registry_lc" /> · <r-t key="dash.brand" /></r-group>
  <section id="page" r-fragment="page">
    <h1><r-t key="dash.ops.registry_h" /></h1>
    <p class="muted"><r-t key="dash.ops.registry_intro" /> {{ reason_min }} <r-t key="dash.ops.to" /> {{ reason_max }} <r-t key="dash.ops.characters" /></p>
    <p class="problem" r-if="form_error">{{ form_error }}</p>
    <x-problem :problem="action_problem" r-if="action_problem" />
    <r-group r-if="result">
      <p class="notice">{{ result.notice }}</p>
      <p><r-t key="dash.ops.tree" /> <code>{{ result.hash }}</code></p>
    </r-group>
    <h2><r-t key="dash.ops.disable_h" /></h2>
    <x-form action="disable" hx-target="#page" hx-swap="outerHTML" class="row">
      <label><r-t key="dash.ops.tree_hash" /> <input name="hash" required pattern="[0-9a-f]{64}" autocomplete="off" spellcheck="false"></label>
      <label><r-t key="dash.ops.reason" /> <input name="reason" required :minlength="reason_min" :maxlength="reason_max"></label>
      <label><r-t key="dash.ops.token" /> <input type="password" name="token" required autocomplete="off" spellcheck="false"></label>
      <button type="submit"><r-t key="dash.ops.disable" /></button>
    </x-form>
    <h2><r-t key="dash.ops.enable_h" /></h2>
    <x-form action="enable" hx-target="#page" hx-swap="outerHTML" class="row">
      <label><r-t key="dash.ops.tree_hash" /> <input name="hash" required pattern="[0-9a-f]{64}" autocomplete="off" spellcheck="false"></label>
      <label><r-t key="dash.ops.reason" /> <input name="reason" required :minlength="reason_min" :maxlength="reason_max"></label>
      <label><r-t key="dash.ops.token" /> <input type="password" name="token" required autocomplete="off" spellcheck="false"></label>
      <button type="submit"><r-t key="dash.ops.enable" /></button>
    </x-form>
  </section>
</r-layout>
