# Local development stack for the control plane (issue #51):
#   docker compose -f control/docker-compose.yml up -d
# Postgres 16 and MinIO (S3-compatible) with the artifact bucket created.
# Credentials are local-only development values, not secrets of any
# environment. The API itself runs on the host:
#   CONTROL_DATABASE_URL=postgres://renox:renox-dev@localhost:5432/renox \
#   CONTROL_S3_ENDPOINT=http://localhost:9000 CONTROL_S3_ACCESS_KEY_ID=renox \
#   CONTROL_S3_SECRET_ACCESS_KEY=renox-dev-minio bun control/api/src/main.ts

name: renox-control

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: renox
      POSTGRES_PASSWORD: renox-dev
      POSTGRES_DB: renox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./api/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renox -d renox"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: renox
      MINIO_ROOT_PASSWORD: renox-dev-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the private artifact bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 renox renox-dev-minio && mc mb --ignore-existing local/renox-artifacts && mc anonymous set none local/renox-artifacts

volumes:
  postgres:
  minio:
