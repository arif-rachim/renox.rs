# Local development stack for the control plane (issue #51):
#   docker compose -f control/docker-compose.yml up -d
# Postgres 16 and an S3-compatible artifact store (versitygw) with the
# artifact bucket created. Credentials are local-only development values, not
# secrets of any environment. The API itself runs on the host:
#   CONTROL_DATABASE_URL=postgres://renox:renox-dev@localhost:5432/renox \
#   CONTROL_S3_ENDPOINT=http://localhost:9000 CONTROL_S3_ACCESS_KEY_ID=renox \
#   CONTROL_S3_SECRET_ACCESS_KEY=renox-dev-minio bun control/api/src/main.ts
# The secret keeps its MinIO-era value because the renox-cell test stack
# (crates/renox-cell/tests/support/control_stack.rs) defaults to it.

name: renox-control

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: renox
      POSTGRES_PASSWORD: renox-dev
      POSTGRES_DB: renox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./api/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renox -d renox"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The artifact store (#389). MinIO stopped publishing images (Docker Hub
  # answers "repository does not exist", quay.io 401), so this is versitygw,
  # Apache 2.0, from GitHub's registry, pinned by the digest of its v1.0.16
  # multi-arch index. Its POSIX backend treats each top-level directory as a
  # bucket, so the private artifact bucket is a mkdir before the server
  # starts; versitygw has no anonymous access unless a bucket policy grants
  # it. VGW_REGION=auto is the region control/api signs with by default
  # (CONTROL_S3_REGION, as for R2); versitygw refuses a request signed for
  # another region, so the renox-cell tests that use this store
  # (RENOX_TEST_S3) need RENOX_TEST_S3_REGION=auto.
  s3:
    image: ghcr.io/versity/versitygw:v1.0.16@sha256:605de57c0cdc297fc5bc905ece592965d542d8df70d6eedf755734c80f2eb797
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/renox-artifacts && exec /app/versitygw posix /data
    environment:
      ROOT_ACCESS_KEY_ID: renox
      ROOT_SECRET_ACCESS_KEY: renox-dev-minio
      VGW_PORT: ":9000"
      VGW_REGION: auto
      VGW_HEALTH: /health
      VGW_QUIET: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
  s3:
