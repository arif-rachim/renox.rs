# Alertmanager routing for the Renox rules (#296, #450). One receiver,
# `operator`, configured on the monitoring host; its secrets are files there,
# never in this repository:
#
#   /etc/alertmanager/secrets/webhook_url   one line: the https URL of a chat
#       incoming webhook or a pager's webhook (the same URL as
#       ALERT_WEBHOOK_URL in /etc/renox/secrets/alert.env, which
#       renox-alert@.service uses for failed units)
#
# Email instead of (or beside) the webhook: uncomment `email_configs` and put
# the SMTP password in /etc/alertmanager/secrets/smtp_password. Install and
# check: ops/observability/README.md, "Alertmanager on the single host".
global:
  resolve_timeout: 5m

route:
  receiver: operator
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="page"']
      receiver: operator
      repeat_interval: 1h

receivers:
  - name: operator
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        max_alerts: 20
