# Prometheus for a Renox region (#296; README.md in this directory).
#
# - Workers are scraped on their control endpoint (`[control] health_listen`,
#   a private address on the node network: never the public listener). The
#   node list is a file the provisioning writes (targets/nodes.json, one
#   entry per node with its node_id and region); Prometheus re-reads it
#   without a restart.
# - The control plane is scraped at `GET /v1/ops/metrics` with an operator
#   token that holds `ops:read`, read from a file (never in this file).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: renox

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: renox-worker
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files: ["/etc/prometheus/targets/nodes.json"]
        refresh_interval: 1m
    relabel_configs:
      # The node id is the instance label: dashboards and alerts name nodes, not addresses.
      - source_labels: [node_id]
        target_label: instance

  - job_name: renox-control-plane
    metrics_path: /v1/ops/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ops-read-token
    static_configs:
      - targets: ["api.renox.app"]
        labels:
          instance: control-plane
