# Installed as /etc/needrestart/conf.d/renox.conf by
# ops/scripts/bootstrap-node.sh --single-host (#546, ops/single-host.md
# "Packages and upgrades"). Ubuntu's needrestart restarts the services that
# use an upgraded library after every apt run; on node-small an
# `apt-get install sqlite3` restarted renox-tunnel (about 3 s offline). The
# renox-* services are never restarted by it: needrestart lists them, and
# the operator restarts them in a maintenance window.
$nrconf{override_rc}{qr(^renox-)} = 0;
