<!DOCTYPE html>
<html lang="{{ locale | default('en') }}" dir="{{ dir | default('ltr') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Renox Shop</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Renox Shop</a>
    <nav><a href="/products">Products</a> <a href="/cart">Cart ({{ cart_count }})</a></nav>
  </header>
  <main id="main">{% block body %}{% endblock %}</main>
  <footer class="site-footer"><small>Prices include VAT. Dubai, United Arab Emirates.</small></footer>
</body>
</html>
