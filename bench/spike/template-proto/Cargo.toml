[package]
name = "template-proto"
version = "0.0.0"
description = "F0 prototype: attribute templates -> minijinja source (issue #9)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
minijinja = "3.0.4"
thiserror = "2.0.21"

[dev-dependencies]
# unstable_machinery exposes compiled instructions, used only to prove that
# consecutive static HTML compiles to one EmitRaw (tests/static_chunks.rs).
minijinja = { version = "3.0.4", features = ["unstable_machinery"] }
