[package]
name = "marshal-bench"
version = "0.0.0"
description = "F0 benchmark B9: V8 value -> minijinja::Value marshaling cost (issue #10)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Same V8 as crates/renox-runtime (v8 150.4.0, the serde_v8 of deno_core 0.413).
# One V8 per workspace: every `v8` version downloads its static library to the
# same target/<profile>/gn_out/obj/librusty_v8.a, so two versions race at link
# time. B9 was measured on v8 130.0.7 (Edge Runtime v1.77.8); see
# docs/14-benchmarks.md for those results. Prebuilt V8 only.
v8 = "=150.4.0"
serde_v8 = "=0.322.0"
minijinja = { version = "3.0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it, from_str misparses some doubles (3.85 -> 3.8499999999999996)
# and path 4 would not equal the others; tests/equality.rs catches it.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "marshal"
harness = false
