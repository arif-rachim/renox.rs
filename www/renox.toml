# The public site of Renoxium, served at renoxium.com (#326): a platform
# service, so never under the tenant domain renoxium.app. The documentation under
# docs/, rendered
# from the repository's markdown at build time; the pricing page from
# pricing.toml; the DPA and terms. No network, no secrets, no database.
[app]
name = "www"
timezone = "Asia/Dubai"

[permissions]
network = []
secrets = []

# The waitlist form posts to the control-plane API (#740): the CSP's form-action
# is 'self' plus this origin and nothing else.
[security.csp]
form_action = ["https://api.renoxium.com"]
