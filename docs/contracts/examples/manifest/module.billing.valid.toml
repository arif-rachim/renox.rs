# The billing manifest of docs/10-modules.md, with permissions.slots (MF8),
# imports (MF7), and the 1.1 keys: permissions.roles, [[tools]] carried,
# [authz] sensitive / ownership / entities / default_roles, [realtime.feeds].
[module]
name = "billing"
version = "1.2.0"

[dependencies]
auth = "^1.0"
org = "^1.0"

[config]
provider = { type = "enum", values = ["stripe", "checkout", "telr", "paytabs", "ngenius"] }
currency = { type = "string", default = "AED", max_length = 3 }

[permissions]
network = ["api.stripe.com", "api.checkout.com", "secure.telr.com", "secure.paytabs.com", "api-gateway.ngenius-payments.com"]
tables = "billing__*"
secrets = ["BILLING_PROVIDER_KEY"]
slots = ["admin.sidebar"]
roles = ["finance", "viewer"]

[exports]
views = ["billing__public_user_plans_v1"]

[exports.services]
getActivePlan = "The user's active plan, or null"
createInvoice = "Creates an invoice for an order in the current transaction"

[exports.events."billing.invoice_paid"]
payload = { type = "object", required = ["invoice_id", "user_id", "amount"], properties = { invoice_id = { type = "string" }, user_id = { type = "string" }, amount = { type = "integer", minimum = 0 } } }

[imports]
services = ["auth.currentUser", "org.currentOrg"]
views = ["auth__public_users_v1"]

[[slots]]
name = "admin.sidebar"
template = "partials/admin-menu.html"
requires = "invoice.read"

[[tools]]
name = "create_invoice"
file = "tools/create-invoice.ts"
action = "invoice.create"
confirm = false

[[tools]]
name = "refund_invoice"
file = "tools/refund-invoice.ts"
action = "invoice.refund"
confirm = true
description = "Refund a paid invoice after a preview"

[authz]
actions = ["invoice.read", "invoice.create", "invoice.refund"]
sensitive = ["invoice.refund"]

[authz.ownership]
"billing__invoices" = { owner = "user_id", org = "org_id" }

[authz.entities]
Invoice = { table = "billing__invoices", attrs = ["amount", "org_id", "status"] }

[authz.default_roles]
finance = ["invoice.read", "invoice.refund"]
viewer = ["invoice.read"]

[realtime.feeds]
"billing__invoices" = "invoices:{org_id}"
