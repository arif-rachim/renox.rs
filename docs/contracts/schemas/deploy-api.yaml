  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: The caller's own tenant with its erasure state (deploy-api.md section 3, 0.4)
      description: Another tenant's id is 404, like any resource of another tenant; the path repeats what the token says.
      x-renox-scope: apps:read
      security:
        - tenantToken: []
        - sessionCookie: []
      responses:
        "200":
          description: The tenant; `erasure` is null until a deletion is requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDetail" }
              examples:
                active: { value: { tenant_id: t_hello, name: Hello Trading LLC, tier: free, state: active, created_at: 1793000000000, erasure: null } }
                erasing: { value: { tenant_id: t_hello, name: Hello Trading LLC, tier: free, state: active, created_at: 1793000000000, erasure: { state: erasing, requested_at: 1793318000000, completed_at: null, failure: null } } }
                done: { value: { tenant_id: t_hello, name: Hello Trading LLC, tier: free, state: suspended, created_at: 1793000000000, erasure: { state: done, requested_at: 1793318000000, completed_at: 1793320000000, failure: null } } }
                done-purged: { value: { tenant_id: t_hello, name: Hello Trading LLC, tier: free, state: suspended, created_at: 1793000000000, erasure: { state: done, requested_at: 1793318000000, completed_at: 1793320000000, failure: null, replica_purged_at: 1793319000000 } } }
              x-renox-invalid-examples:
                purged-negative: { x-expect: minimum, value: { tenant_id: t_hello, name: Hello Trading LLC, tier: free, state: suspended, created_at: 1793000000000, erasure: { state: done, requested_at: 1793318000000, completed_at: 1793320000000, failure: null, replica_purged_at: -5 } } }
                done-without-completion: { x-expect: completed_at, value: { tenant_id: t_hello, name: Hello Trading LLC, tier: free, state: suspended, created_at: 1793000000000, erasure: { state: done, requested_at: 1793318000000, completed_at: null, failure: null } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Erase the tenant (owner, session only; deploy-api.md section 3, 0.4)
      description: >-
        Starts the erasure state machine: routes removed, tokens revoked, the node drops the tenant,
        the Litestream generations and the exports are deleted, then `done` with `completed_at`.
        A second call while an erasure exists answers the same record.
      x-renox-scope: tenant:delete
      security:
        - sessionCookie: []
      x-renox-audit: deleteTenant (tenant, state reached, completed_at)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_CONFLICT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteTenantRequest" }
            examples:
              confirm: { value: { confirm: t_hello } }
            x-renox-invalid-examples:
              no-confirm: { value: {}, x-expect: confirm }
              bad-confirm: { value: { confirm: "Hello Trading" }, x-expect: pattern }
      responses:
        "202":
          description: Recorded; the erasure runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erasure" }
              examples:
                pending: { value: { state: pending, requested_at: 1793318000000, completed_at: null, failure: null } }
              x-renox-invalid-examples:
                unknown-state: { x-expect: enum, value: { state: deleted, requested_at: 1793318000000, completed_at: null, failure: null } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A restore, an import or a move of the tenant is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                restoring:
                  value:
                    error:
                      code: RENOX_CONFLICT
                      message: The request conflicts with the current state.
                      request_id: 01JBQ3Z7MA0000000000000040
                      details: [{ field: tenant, reason: restore in progress }]

