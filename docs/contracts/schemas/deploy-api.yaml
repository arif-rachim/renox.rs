      x-renox-scope: apps:read
      x-renox-audit: none (read)
      x-renox-errors: [RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND]
      responses:
        "200":
          description: Status of the app's database.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
              examples:
                litestream: { $ref: "#/components/examples/BackupStatusLitestream" }
                none:
                  value:
                    app: hello
                    database: t_hello
                    replication: none
                    state: "off"
                    replica: null
                    last_sync_at: null
                    lag_seconds: null
                    retention_hours: 0
                    generations: []
                    db: { size_bytes: 4096, quota_bytes: 104857600, wal_bytes: 0 }
                    last_failover: null
                    stale: false
              x-renox-invalid-examples:
                lag-negative:
                  x-expect: minimum
                  value:
                    app: hello
                    database: t_hello
                    replication: litestream
                    state: replicating
                    replica: { kind: s3, region: me-central-1 }
                    last_sync_at: 1793318406000
                    lag_seconds: -1
                    retention_hours: 24
                    generations: []
                    db: { size_bytes: 4096, quota_bytes: 104857600, wal_bytes: 0 }
                    last_failover: null
                    stale: false
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/apps/{app}/backups/export:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: exportBackup
      tags: [backups]
      summary: A signed URL to a consistent snapshot of the app's database (section 14)
      description: >-
        The control plane asks the owning node for a consistent snapshot (node listener,
        `POST /nodes/{node_id}/tenants/{tenant_id}/snapshot`), stores it under the private
        prefix `exports/<tenant_id>/<database>/<created_at>.db`, and answers a signed URL that
        expires after at most 15 minutes. Column masking is not part of 0.3 (F7); the file
        is the whole database.
      x-renox-scope: apps:write
      x-renox-audit: exportBackup (app, size_bytes, sha256; never the URL)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_TENANT_MOVING, RENOX_BACKUP_UNAVAILABLE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
            examples:
              now: { value: {} }
              short: { value: { expires_in_seconds: 300 } }
            x-renox-invalid-examples:
              too-long: { value: { expires_in_seconds: 86400 }, x-expect: maximum }
      responses:
        "201":
          description: The snapshot is stored; the URL is the only way to read it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportCreated" }
              examples:
                created:
                  value:
                    url: "https://backups.renox.app/exports/t_hello/t_hello/1793318500000.db?X-Amz-Expires=900&X-Amz-Signature=0a1b2c3d4e5f"
                    expires_at: 1793319400000
                    created_at: 1793318500000
                    size_bytes: 39845888
                    sha256: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                    masking: none
              x-renox-invalid-examples:
                http-url:
                  x-expect: pattern
                  value:
                    url: "http://backups.renox.app/exports/t_hello/t_hello/1793318500000.db"
                    expires_at: 1793319400000
                    created_at: 1793318500000
                    size_bytes: 39845888
                    sha256: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                    masking: none
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /v1/apps/{app}/backups/restore:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: restoreBackup
      tags: [backups]
      summary: Restore the app's database as of a time into a new app (section 14)
      description: >-
        0.3 restores into a new app only. The control plane creates the app `name` in the
        caller's tenant with a database of its own (`<tenant_id>.<name>`), asks the owning
        node to restore the source database's replica as of `timestamp` into it (node
        listener, `restore_request` with `source_database`), creates the new app's first
        deployment from the source app's active artifact and activates it (section 6). The
        source app is not touched.
      x-renox-scope: apps:write
      x-renox-audit: restoreBackup (source app, new app, timestamp, generation)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_CONFLICT, RENOX_RESTORE_POINT_UNKNOWN, RENOX_ACTIVATION_FAILED, RENOX_BACKUP_UNAVAILABLE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
            examples:
              yesterday: { value: { timestamp: 1793318400000, target: new_app, name: hello-restored } }
            x-renox-invalid-examples:
              in-place: { value: { timestamp: 1793318400000, target: in_place, name: hello }, x-expect: const }
              no-name: { value: { timestamp: 1793318400000, target: new_app }, x-expect: name }
      responses:
        "201":
          description: The new app exists, holds the database as of `restored_to`, and serves its first deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreCreated" }
              examples:
                restored:
                  value:
                    app: { name: hello-restored, tenant_id: t_hello, created_at: 1793318600000, active_deployment: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6", hostnames: [hello-restored.renox.app] }
                    deployment:
                      app: hello-restored
                      hash: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                      state: active
                      created_at: 1793318600000
                      updated_at: 1793318600000
                      size_bytes: 2048
                      permissions: { network: ["api.stripe.com"], secrets: [STRIPE_KEY] }
                      secrets_version: 0
                      activated_at: 1793318600000
                      last_error: null
                      violations: null
                    source_app: hello
                    database: t_hello.hello-restored
                    generation: a1b2c3d4e5f60718
                    restored_to: 1793318399000
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/RestorePointUnknown" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /v1/apps/{app}/db/import:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: importDatabase
      tags: [backups]
      summary: Replace a staging app's database with an uploaded SQLite file (section 14)
      description: >-
        Only an app created with `staging: true` (it has a database of its own) accepts an
        import; any other app answers 422 RENOX_IMPORT_REJECTED, so a production file can
        never be overwritten this way. The body is at most the tier's database quota
        (`db_quota_bytes`, 100 MB free and 10 GB paid). The owning node checks the file
        (`PRAGMA quick_check`; every table, view, index and trigger name follows the
        authorizer's rules: `<module>__<name>`, nothing under `sqlite_` but the internal
        tables) before it swaps it in (node listener `PUT …/import`); the staging app's
        cells are recycled.
