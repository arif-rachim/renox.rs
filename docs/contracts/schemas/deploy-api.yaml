      summary: Control messages for one node as Server-Sent Events
      description: >-
        One `message` event per control message (route_delta, resync, prepare,
        certificate_update, certificate_remove). The first event after connect is
        always `resync` with the current route version. `: keep-alive` every 15 s.
      security:
        - nodeToken: []
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
              x-renox-events:
                message:
                  oneOf:
                    - { $ref: "control-messages.schema.json#/$defs/route_delta" }
                    - { $ref: "control-messages.schema.json#/$defs/resync" }
                    - { $ref: "control-messages.schema.json#/$defs/prepare" }
                    - { $ref: "control-messages.schema.json#/$defs/certificate_update" }
                    - { $ref: "control-messages.schema.json#/$defs/certificate_remove" }
              examples:
                connect:
                  value: "event: message\ndata: {\"type\":\"resync\",\"schema_version\":0,\"version\":42}\n\nevent: message\ndata: {\"type\":\"route_delta\",\"schema_version\":0,\"prev_version\":42,\"version\":43,\"upserts\":[{\"hostname\":\"hello.renox.app\",\"tenant_id\":\"t_hello\",\"app\":\"hello\",\"deployment_hash\":\"2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6\",\"status\":\"active\",\"updated_at\":1793318500000,\"version\":43,\"tier\":\"free\",\"node_id\":\"node-dxb-01\",\"secrets_version\":2}],\"removals\":[]}\n\n"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }

  /v1/nodes/{node_id}/routes:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: routeSnapshot
      tags: [nodes]
      summary: The full route table (#97 resync); ETag is the route version
      security:
        - nodeToken: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, pattern: '^"[0-9]+"$' }
          example: '"42"'
      responses:
        "200":
          description: The snapshot, with an ETag header equal to the quoted route version.
          headers:
            ETag:
              schema: { type: string }
              example: '"42"'
          content:
            application/json:
              schema: { $ref: "control-messages.schema.json#/$defs/route_snapshot" }
              examples:
                two:
                  value:
                    type: route_snapshot
                    schema_version: 0
                    version: 42
                    entries:
                      - { hostname: hello.renox.app, tenant_id: t_hello, app: hello, deployment_hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", status: active, updated_at: 1793318400000, version: 41, tier: free, node_id: node-dxb-01, secrets_version: 0 }
        "304": { description: The table did not change since the version in If-None-Match. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }

  /v1/nodes/{node_id}/prepare-results:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: prepareResult
      tags: [nodes]
      summary: The node's answer to a prepare message
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "control-messages.schema.json#/$defs/prepare_result" }
            examples:
              ok: { value: { type: prepare_result, schema_version: 0, activation_id: act_01JBQ40000000000AB, node_id: node-dxb-01, ok: true, migrations_applied: [] } }
            x-renox-invalid-examples:
              error-on-success: { value: { type: prepare_result, schema_version: 0, activation_id: act_01JBQ40000000000AB, node_id: node-dxb-01, ok: true, error: { stage: probe, reason: x } }, x-expect: not }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/nodes/{node_id}/artifacts/{hash}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: fetchArtifact
      tags: [nodes]
      summary: The artifact tar for a deployment assigned to this node
      description: >-
        307 to a presigned object-storage URL valid for 300 s, or 200 with the
        tar itself when storage has no presigning. The node recomputes the hash
        (artifact.md section 2) and applies the same T rules before loading.
      security:
        - nodeToken: []
      responses:
        "200":
          description: The tar.
          content:
            application/x-tar:
              schema: { type: string, format: binary }
              examples:
                hello: { value: "<tar bytes>" }
        "307":
          description: Redirect to a presigned GET.
          headers:
            Location:
              schema: { type: string }
              example: "https://s3.me-central-1.amazonaws.com/renox-artifacts/artifacts/8029...d7a.tar?X-Amz-Expires=300"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/nodes/{node_id}/secrets/{app}/{hash}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: fetchSecrets
      tags: [nodes]
      summary: The secret bundle of one deployment (deploy-api.md section 9)
      description: >-
        Only for a deployment whose tenant is assigned to this node and whose
        state is activating, active, or suspended. Values are filtered to the
        names in the manifest's permissions.secrets. `Cache-Control: no-store`.
      security:
        - nodeToken: []
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The bundle.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "control-messages.schema.json#/$defs/secrets_bundle" }
              examples:
                shop: { value: { type: secrets_bundle, schema_version: 0, tenant_id: t_shop, app: shop, deployment_hash: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6", version: 3, secrets: { STRIPE_KEY: sk_test_exampleexample } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/nodes/{node_id}/certificates/{hostname}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/Hostname"
    get:
      operationId: fetchCertificate
      tags: [nodes]
      summary: Certificate chain and key for a verified hostname (#59)
      security:
        - nodeToken: []
      responses:
        "200":
          description: The bundle, sent with Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "control-messages.schema.json#/$defs/certificate_bundle" }
              examples:
                www: { value: { type: certificate_bundle, schema_version: 0, hostname: www.example.com, version: 2, not_after: 1801094400000, chain_pem: "-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----\n", key_pem: "-----BEGIN PRIVATE KEY-----\nMIIE\n-----END PRIVATE KEY-----\n" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ingest/meters:
    post:
      operationId: ingestMeters
      tags: [ingest]
      summary: The meter.md HTTP sink; one batch envelope per request
      description: >-
        node_id in the batch must equal the token's node. Records are
        de-duplicated on request_id (meter.md section 4); 202 means persisted.
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "meter-record.schema.json" }
            examples:
              one:
                value:
                  schema_version: 0
                  cell_id: t_hello@node-dxb-01
                  node_id: node-dxb-01
                  records:
                    - { request_id: 01JBQ3Z7M8K5V6W9X2Y4A1B3C5, tenant_id: t_hello, deployment_hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", route: "GET /api/hello", started_at: 1793318400123, cpu_ms: 0.834, wall_ms: 1.302, peak_heap_bytes: 4216480, ingress_bytes: 0, egress_bytes: 11, fetch_sent_bytes: 0, fetch_received_bytes: 0, fetch_blocked: 0, db_ms: 0, db_rows: 0, render_fuel: 0, logs_dropped: 0, http_status: 200, status: ok }
            x-renox-invalid-examples:
              empty: { value: { schema_version: 0, cell_id: t_hello@node-dxb-01, node_id: node-dxb-01, records: [] }, x-expect: minItems }
      responses:
        "202":
          description: Persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
              examples:
                one: { value: { accepted: 1, duplicates: 0 } }
                replay: { value: { accepted: 0, duplicates: 1 } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }

  /v1/ingest/logs:
    post:
      operationId: ingestLogs
      tags: [ingest]
      summary: Tenant log lines from a node (HttpLogSink, #55)
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "control-messages.schema.json#/$defs/log_batch" }
            examples:
              one: { value: { type: log_batch, schema_version: 0, node_id: node-dxb-01, lines: [{ ts: 1793318400200, tenant_id: t_hello, deployment_hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", request_id: 01JBQ3Z7M8K5V6W9X2Y4A1B3C5, module: functions/api/hello, level: info, message: hello, fields: null, source: server }] } }
            x-renox-invalid-examples:
              level: { value: { type: log_batch, schema_version: 0, node_id: node-dxb-01, lines: [{ ts: 1, tenant_id: t_hello, deployment_hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", request_id: null, module: m, level: fatal, message: x, fields: null, source: server }] }, x-expect: enum }
      responses:
        "202":
          description: Persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
              examples:
                one: { value: { accepted: 1, duplicates: 0 } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }

components:
  securitySchemes:
    tenantToken:
      type: http
      scheme: bearer
      description: "`renox_pat_<32 base32>`; scoped (x-renox-scope on each operation), expiring, sha256 at rest."
    nodeToken:
      type: http
      scheme: bearer
      description: "`renox_node_<32 base32>`; bound to one node_id; the {node_id} path parameter and every node_id in a body must equal it."
    operatorToken:
      type: http
      scheme: bearer
      description: "`renox_op_<32 base32>`; its sha256 is configured in the API's environment."

  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AppName" }
    Hash:
      name: hash
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Sha256" }
    SecretName:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SecretName" }
    Hostname:
      name: hostname
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Hostname" }
    NodeId:
      name: node_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/NodeId" }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/TenantId" }

  schemas:
    Sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    TenantId: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,62}$" }
    AppName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,49}$"
      description: The artifact's app.name, at most 50 characters so that preview hosts fit one DNS label.
    NodeId: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    SecretName: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
    TokenId: { type: string, pattern: "^tok_[0-9A-Za-z]{16,32}$" }
    Hostname:
      type: string
      maxLength: 253
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$"
    UnixMs: { type: integer, minimum: 0 }
    Tier: { enum: [free, paid] }
    Scope:
      type: string
      pattern: "^(\\*|(apps:read|apps:write|deploy|logs:read|secrets:read|secrets:write|domains:write|tokens:write)(:[a-z][a-z0-9-]{0,49})?)$"
      description: "`<action>` for every app of the tenant, `<action>:<app>` for one app, `*` for all."

    Health:
      type: object
      additionalProperties: false
      required: [status, postgres, object_storage]
      properties:
        status: { enum: [ok, degraded] }
        postgres: { enum: [ok, unreachable] }
        object_storage: { enum: [ok, unreachable] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, pattern: "^RENOX_[A-Z0-9]+(_[A-Z0-9]+)*$" }
            message: { type: string, minLength: 1, maxLength: 200 }
            request_id: { type: string, pattern: "^[0-9A-Za-z_-]{8,64}$" }
            deployment: { $ref: "#/components/schemas/Sha256" }
            details:
              type: array
              maxItems: 50
              items:
                anyOf:
                  - { $ref: "#/components/schemas/Violation" }
                  - { $ref: "#/components/schemas/FieldError" }
                  - { $ref: "control-messages.schema.json#/$defs/activation_error" }

    Violation:
      type: object
      additionalProperties: false
      required: [rule, reason]
      description: >-
        One broken artifact rule (artifact.md section 6), upload rule (T1-T8) or bundle-hygiene
        rule (H1, H2) of deploy-api.md section 4. Never a filesystem path of the server, never
        the text of a secret an H2 violation found (only its pattern and a masked prefix).
      properties:
        rule: { type: string, pattern: "^(V([1-9]|1[0-6])|T[1-8]|H[12])$" }
        path: { type: string, maxLength: 1024 }
        field: { type: string, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 512 }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 512 }

    CreateAppRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/AppName" }

    App:
      type: object
      additionalProperties: false
      required: [name, tenant_id, created_at, active_deployment, hostnames]
      properties:
        name: { $ref: "#/components/schemas/AppName" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        active_deployment:
          anyOf:
            - { $ref: "#/components/schemas/Sha256" }
            - { type: "null" }
        hostnames: { type: array, items: { $ref: "#/components/schemas/Hostname" } }

    DeploymentState:
      enum: [uploaded, validated, rejected, activating, active, superseded, suspended, pruned]

    Deployment:
      type: object
      additionalProperties: false
      required: [app, hash, state, created_at, updated_at, size_bytes, permissions, secrets_version, activated_at, last_error, violations]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        hash: { $ref: "#/components/schemas/Sha256" }
        state: { $ref: "#/components/schemas/DeploymentState" }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        updated_at: { $ref: "#/components/schemas/UnixMs" }
        size_bytes: { type: integer, minimum: 0, description: Uncompressed bytes of the artifact's files. }
        permissions:
          type: object
          additionalProperties: false
          required: [network, secrets]
          description: The manifest's permissions as approved at upload.
          properties:
            network: { type: array, items: { type: string } }
            secrets: { type: array, items: { $ref: "#/components/schemas/SecretName" } }
        secrets_version:
          type: [integer, "null"]
          minimum: 0
          description: Secret-set version pinned at the last activation; null before the first.
        activated_at: { type: [integer, "null"], minimum: 0 }
        last_error:
          anyOf:
            - { $ref: "control-messages.schema.json#/$defs/activation_error" }
            - { type: "null" }
        violations:
          type: [array, "null"]
          maxItems: 50
          items: { $ref: "#/components/schemas/Violation" }
          description: Set when state is rejected.

    Usage:
      type: object
      additionalProperties: false
      required: [requests, cpu_ms, wall_ms, egress_bytes, fetch_sent_bytes, db_ms, db_rows, render_fuel]
      description: Sums of the meter record fields of the same names (meter.md section 2); the *_ms sums are rounded to 3 decimals.
      properties:
        requests: { type: integer, minimum: 0 }
        cpu_ms: { type: number, minimum: 0 }
        wall_ms: { type: number, minimum: 0 }
        egress_bytes: { type: integer, minimum: 0 }
        fetch_sent_bytes: { type: integer, minimum: 0 }
        db_ms: { type: number, minimum: 0 }
        db_rows: { type: integer, minimum: 0 }
        render_fuel: { type: integer, minimum: 0 }

    UsageHour:
      type: object
      additionalProperties: false
      required: [hour_start, requests, cpu_ms, wall_ms, egress_bytes, fetch_sent_bytes, db_ms, db_rows, render_fuel]
      description: One hour of the rollup; hour_start is a multiple of 3,600,000.
      properties:
        hour_start: { $ref: "#/components/schemas/UnixMs" }
        requests: { type: integer, minimum: 0 }
        cpu_ms: { type: number, minimum: 0 }
        wall_ms: { type: number, minimum: 0 }
        egress_bytes: { type: integer, minimum: 0 }
        fetch_sent_bytes: { type: integer, minimum: 0 }
        db_ms: { type: number, minimum: 0 }
        db_rows: { type: integer, minimum: 0 }
        render_fuel: { type: integer, minimum: 0 }

    QuotaAmounts:
      type: object
      additionalProperties: false
      required: [requests, cpu_ms, egress_bytes]
      description: >-
        The billing dimensions (meter.md section 7): charged requests, billed CPU
        (cpu_ms + render_ms), billed egress (egress_bytes + fetch_sent_bytes).
      properties:
        requests: { type: integer, minimum: 0 }
        cpu_ms: { type: number, minimum: 0 }
        egress_bytes: { type: integer, minimum: 0 }

    QuotaState:
      type: object
      additionalProperties: false
      required: [tenant_id, tier, period_start, period_end, used, limits, over]
      description: The tenant's monthly quota state (all apps); `over` lists the dimensions above their limit.
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        tier: { $ref: "#/components/schemas/Tier" }
        period_start: { $ref: "#/components/schemas/UnixMs" }
        period_end: { $ref: "#/components/schemas/UnixMs" }
        used: { $ref: "#/components/schemas/QuotaAmounts" }
        limits: { $ref: "#/components/schemas/QuotaAmounts" }
        over:
          type: array
          maxItems: 3
          items: { enum: [requests, cpu_ms, egress_bytes] }

    AppUsage:
      type: object
      additionalProperties: false
      required: [app, from, to, hours, total, quota]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        from: { $ref: "#/components/schemas/UnixMs" }
        to: { $ref: "#/components/schemas/UnixMs" }
        hours: { type: array, items: { $ref: "#/components/schemas/UsageHour" } }
        total: { $ref: "#/components/schemas/Usage" }
        quota: { $ref: "#/components/schemas/QuotaState" }
        client_events: { $ref: "#/components/schemas/ClientEventsQuota" }

    ClientEventsQuota:
      type: object
      additionalProperties: false
      required: [used_today, daily_cap, warning]
      description: >-
        The tenant's browser events since 00:00 UTC against the daily cap (client-events.md
        section 7: 10 % of the daily log allowance, proposed). `warning` is true from 80 %
        of the cap. Client events count here only, never toward the per-minute log cap.
      properties:
        used_today: { type: integer, minimum: 0 }
        daily_cap: { type: integer, minimum: 1 }
        warning: { type: boolean }

    ClientErrorFingerprint:
      type: string
      pattern: "^[0-9a-f]{16}$"
      description: 16 lowercase hex characters; computed by the control plane at ingestion from kind, top frame and normalised message.

    ClientErrorStatus: { enum: [open, resolved, ignored] }

    ClientErrorKind:
      enum: [js.error, js.unhandledrejection, js.console.error, htmx.responseError, htmx.sendError, htmx.timeout, htmx.targetError, htmx.swapError, csp.violation, realtime.connectError, realtime.closed]

    OriginalPosition:
      type: object
      additionalProperties: false
      required: [file, line, column]
      properties:
        file: { type: string, minLength: 1, maxLength: 2048 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 0 }

    ClientErrorFrame:
      type: object
      additionalProperties: false
      required: [file, line, column, function, original]
      description: >-
        One stack frame as the browser reported it (client-events.md section 8: file, line,
        column, function only) and, when a private sourcemap of the event's deployment matched,
        its original position. `original` is null when none matched; the raw position is always kept.
        Lines and columns are 1-based, like the browser's stack; 0 means the browser gave none.
      properties:
        file: { type: string, minLength: 1, maxLength: 2048 }
        line: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }
        function: { type: [string, "null"], maxLength: 256 }
        original:
          anyOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/OriginalPosition" }

    ClientErrorDeploymentCount:
      type: object
      additionalProperties: false
      required: [deployment_hash, count]
      properties:
        deployment_hash: { $ref: "#/components/schemas/Sha256" }
        count: { type: integer, minimum: 1 }

    ClientErrorGroup:
      type: object
      additionalProperties: false
      required: [fingerprint, kind, message, status, first_seen, last_seen, count, regressed, deployments, top_frame]
      properties:
        fingerprint: { $ref: "#/components/schemas/ClientErrorFingerprint" }
        kind: { $ref: "#/components/schemas/ClientErrorKind" }
        message: { type: string, maxLength: 2048, description: "Message of the most recent event, already redacted." }
        status: { $ref: "#/components/schemas/ClientErrorStatus" }
        first_seen: { $ref: "#/components/schemas/UnixMs" }
        last_seen: { $ref: "#/components/schemas/UnixMs" }
        count: { type: integer, minimum: 1, description: "Events in the group, all deployments." }
        regressed: { type: boolean, description: "True while the group is open again after having been resolved on an older deployment." }
        deployments:
          type: array
          maxItems: 100
          description: Count per deployment, newest deployment first (the sparkline of the Logs screen).
          items: { $ref: "#/components/schemas/ClientErrorDeploymentCount" }
        top_frame:
          anyOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/ClientErrorFrame" }

    ClientErrorGroupList:
      type: object
      additionalProperties: false
      required: [groups, next_cursor]
      properties:
        groups: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ClientErrorGroup" } }
        next_cursor: { type: [string, "null"], maxLength: 256 }

    ClientErrorEvent:
      type: object
      additionalProperties: false
      required: [ts, client_ts, deployment_hash, request_id, message, url, ua, frames]
      properties:
        ts: { $ref: "#/components/schemas/UnixMs", description: "Gateway receive time." }
        client_ts: { $ref: "#/components/schemas/UnixMs", description: "Browser clock." }
        deployment_hash: { $ref: "#/components/schemas/Sha256" }
        request_id: { type: [string, "null"], pattern: "^[0-9A-Za-z_-]{8,64}$", description: "Links the event to the server log lines of the same request." }
        message: { type: string, maxLength: 2048 }
        url: { type: string, maxLength: 2048 }
        ua: { enum: [chrome, edge, firefox, safari, samsung, other], description: "The browser family only (client-events.md section 4)." }
        frames: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/ClientErrorFrame" } }

    ClientErrorDetail:
      type: object
      additionalProperties: false
      required: [group, events]
      properties:
        group: { $ref: "#/components/schemas/ClientErrorGroup" }
        events: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ClientErrorEvent" } }

    SetClientErrorStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ClientErrorStatus" }

    ActivateRequest:
      type: object
      additionalProperties: false
      required: [hash]
      properties:
        hash: { $ref: "#/components/schemas/Sha256" }

    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        hash: { $ref: "#/components/schemas/Sha256" }

    PutSecretRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 8
          maxLength: 65536
          description: At least 8 characters and 8 UTF-8 bytes (ops.md section 3); at most 64 KiB.

    SecretWritten:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        version: { type: integer, minimum: 1 }

    SecretList:
      type: object
      additionalProperties: false
      required: [version, secrets]
      properties:
        version: { type: integer, minimum: 0 }
        secrets:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [name, updated_at]
            properties:
              name: { $ref: "#/components/schemas/SecretName" }
              updated_at: { $ref: "#/components/schemas/UnixMs" }

    AddDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: { $ref: "#/components/schemas/Hostname" }

    DomainState: { enum: [pending, verified, detached, released] }

    Domain:
      type: object
      additionalProperties: false
      required: [hostname, app, state, verification, dns, certificate, created_at, verified_at, last_checked_at]
      properties:
        hostname: { $ref: "#/components/schemas/Hostname" }
        app: { $ref: "#/components/schemas/AppName" }
        state: { $ref: "#/components/schemas/DomainState" }
        verification:
          type: object
          additionalProperties: false
          required: [record_type, record_name, record_value]
          properties:
            record_type: { const: TXT }
            record_name: { type: string, pattern: "^_renox-verify\\." }
            record_value: { type: string, pattern: "^rnx-verify-[0-9a-z]{26}$" }
        dns: { enum: [pending, ok, not_pointing] }
        certificate:
          type: object
          additionalProperties: false
          required: [state, not_after]
          properties:
            state: { enum: [none, issuing, issued, failed] }
            not_after: { type: [integer, "null"], minimum: 0 }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        verified_at: { type: [integer, "null"], minimum: 0 }
        last_checked_at: { type: [integer, "null"], minimum: 0 }

    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expires_in_days]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9 ._-]{1,64}$" }
        scopes: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: "#/components/schemas/Scope" } }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }

    Token:
      type: object
      additionalProperties: false
      required: [id, name, scopes, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { $ref: "#/components/schemas/TokenId" }
        name: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }
        last_used_at: { type: [integer, "null"], minimum: 0 }
        revoked_at: { type: [integer, "null"], minimum: 0 }

    TokenCreated:
      type: object
      additionalProperties: false
      required: [id, name, token, scopes, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/TokenId" }
        name: { type: string }
        token: { type: string, pattern: "^renox_pat_[a-z2-7]{32}$" }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, name, tier]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        name: { type: string, minLength: 1, maxLength: 128 }
        tier: { $ref: "#/components/schemas/Tier" }

    Tenant:
      type: object
      additionalProperties: false
      required: [tenant_id, name, tier, state, created_at]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        name: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        state: { enum: [active, suspended] }
        created_at: { $ref: "#/components/schemas/UnixMs" }

    TenantCreated:
      type: object
      additionalProperties: false
      required: [tenant, token]
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }
        token: { $ref: "#/components/schemas/TokenCreated" }

    CreateNodeRequest:
      type: object
      additionalProperties: false
      required: [node_id]
      properties:
        node_id: { $ref: "#/components/schemas/NodeId" }

    NodeTokenCreated:
      type: object
      additionalProperties: false
      required: [node_id, token, created_at]
      properties:
        node_id: { $ref: "#/components/schemas/NodeId" }
        token: { type: string, pattern: "^renox_node_[a-z2-7]{32}$" }
        created_at: { $ref: "#/components/schemas/UnixMs" }

    IngestResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }

