  responses:
    Validation:
      description: The request body, a parameter, or a header is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            secret:
              value:
                error:
                  code: RENOX_VALIDATION
                  message: The request is not valid.
                  request_id: 01JBQ3Z7MA0000000000000010
                  details: [{ field: value, reason: "secret values are at least 8 bytes" }]
    Unauthenticated:
      description: No token, an unknown, expired, or revoked token, or a token of the wrong kind.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: 'Bearer realm="renox"'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missing: { value: { error: { code: RENOX_UNAUTHENTICATED, message: Authentication is required., request_id: 01JBQ3Z7MA0000000000000011 } } }
    TokenScope:
      description: The token is valid but lacks the operation's scope, or a node token names another node.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            scope: { value: { error: { code: RENOX_TOKEN_SCOPE, message: The token does not allow this action., request_id: 01JBQ3Z7MA0000000000000012 } } }
    NotFound:
      description: No such resource in the caller's tenant. Another tenant's resources are also 404, never 403.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            app: { value: { error: { code: RENOX_NOT_FOUND, message: Not found., request_id: 01JBQ3Z7MA0000000000000013 } } }
    Conflict:
      description: The state machine does not allow the transition, the name is taken, or another activation of the app is in progress.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            state: { value: { error: { code: RENOX_CONFLICT, message: The request conflicts with the current state., request_id: 01JBQ3Z7MA0000000000000014, details: [{ field: state, reason: "rejected -> activating is not allowed" }] } } }
    BodyTooLarge:
      description: The body is over the operation's limit (deploy-api.md section 4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            upload: { value: { error: { code: RENOX_BODY_TOO_LARGE, message: The request body is too large., request_id: 01JBQ3Z7MA0000000000000015 } } }
    RateLimited:
      description: The token's bucket is empty. `Retry-After` says when to retry.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 5
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            bucket: { value: { error: { code: RENOX_RATE_LIMITED, message: Too many requests. Try again later., request_id: 01JBQ3Z7MA0000000000000016 } } }
    Unavailable:
      description: No healthy worker can take the tenant, or a dependency is down.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 5
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            no-worker: { value: { error: { code: RENOX_UNAVAILABLE, message: The service is temporarily unavailable., request_id: 01JBQ3Z7MA0000000000000017 } } }
