  /v1/apps/{app}/usage:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: getUsage
      tags: [usage]
      summary: Hourly metered usage of one app, and the tenant's quota signal
      description: >-
        Reads the hourly rollup of meter records (meter.md section 7) for the app's
        deployments in [from, to), oldest hour first; hours without records are absent.
        `total` sums the returned hours. `quota` is the tenant's state for the current
        calendar month (UTC) over all its apps; a non-empty `quota.over` is the over-quota
        signal. In F3 it is a signal only: nothing is suspended or throttled on it. `client_events` is
        the tenant's browser-event count against its daily cap (client-events.md section 7).
      x-renox-scope: apps:read
      parameters:
        - name: from
          in: query
          required: false
          description: Unix time in milliseconds, inclusive. Default the start of the current month (UTC).
          schema: { type: integer, minimum: 0 }
        - name: to
          in: query
          required: false
          description: Unix time in milliseconds, exclusive. Default the start of next month (UTC). After `from`, at most 366 days later.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The app's hours, their total, and the tenant's quota state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUsage" }
              examples:
                one-hour:
                  value:
                    app: hello
                    from: 1790812800000
                    to: 1793491200000
                    hours:
                      - { hour_start: 1793318400000, requests: 1200, cpu_ms: 2834.512, wall_ms: 9120.25, egress_bytes: 5242880, fetch_sent_bytes: 40960, db_ms: 310.5, db_rows: 4800, render_fuel: 0 }
                    total: { requests: 1200, cpu_ms: 2834.512, wall_ms: 9120.25, egress_bytes: 5242880, fetch_sent_bytes: 40960, db_ms: 310.5, db_rows: 4800, render_fuel: 0 }
                    quota:
                      tenant_id: t_hello
                      tier: free
                      period_start: 1790812800000
                      period_end: 1793491200000
                      used: { requests: 1200, cpu_ms: 2834.512, egress_bytes: 5283840 }
                      limits: { requests: 3000000, cpu_ms: 30000000, egress_bytes: 10737418240 }
                      over: []
                    client_events: { used_today: 120, daily_cap: 144000, warning: false }
                over-quota:
                  value:
                    app: hello
                    from: 1793318400000
                    to: 1793322000000
                    hours: []
                    total: { requests: 0, cpu_ms: 0, wall_ms: 0, egress_bytes: 0, fetch_sent_bytes: 0, db_ms: 0, db_rows: 0, render_fuel: 0 }
                    quota:
                      tenant_id: t_hello
                      tier: free
                      period_start: 1790812800000
                      period_end: 1793491200000
                      used: { requests: 3000001, cpu_ms: 12000000, egress_bytes: 2147483648 }
                      limits: { requests: 3000000, cpu_ms: 30000000, egress_bytes: 10737418240 }
                      over: [requests]
                    client_events: { used_today: 120000, daily_cap: 144000, warning: true }
              x-renox-invalid-examples:
                unknown-dimension:
                  x-expect: over
                  value:
                    app: hello
                    from: 1793318400000
                    to: 1793322000000
                    hours: []
                    total: { requests: 0, cpu_ms: 0, wall_ms: 0, egress_bytes: 0, fetch_sent_bytes: 0, db_ms: 0, db_rows: 0, render_fuel: 0 }
                    quota:
                      tenant_id: t_hello
                      tier: free
                      period_start: 1790812800000
                      period_end: 1793491200000
                      used: { requests: 0, cpu_ms: 0, egress_bytes: 0 }
                      limits: { requests: 3000000, cpu_ms: 30000000, egress_bytes: 10737418240 }
                      over: [wall_ms]
                hour-without-start:
                  x-expect: hour_start
                  value:
                    app: hello
                    from: 1793318400000
                    to: 1793322000000
                    hours:
                      - { requests: 1, cpu_ms: 1, wall_ms: 1, egress_bytes: 0, fetch_sent_bytes: 0, db_ms: 0, db_rows: 0, render_fuel: 0 }
                    total: { requests: 1, cpu_ms: 1, wall_ms: 1, egress_bytes: 0, fetch_sent_bytes: 0, db_ms: 0, db_rows: 0, render_fuel: 0 }
                    quota:
                      tenant_id: t_hello
                      tier: free
                      period_start: 1790812800000
                      period_end: 1793491200000
                      used: { requests: 1, cpu_ms: 1, egress_bytes: 0 }
                      limits: { requests: 3000000, cpu_ms: 30000000, egress_bytes: 10737418240 }
                      over: []
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

