              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/AppModule" } }
              examples:
                one: { value: { items: [{ name: tax_gcc, source: "registry:gulfsoft/tax_gcc", version: "2.1.0", hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, approved: { tables: "tax_gcc__*", network: [], secrets: [], slots: [], hooks: [] }, approved_at: 1793318400000, approved_by: usr_01JBQ40000000000US, disabled: null }] } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: installModule
      tags: [registry]
      summary: Record the approval of a module version for an app (section 19)
      description: >-
        The dashboard's install and upgrade review end here; the CLI still writes renox.lock.
        `approved` must equal the version's permission request, so the record says what the
        tenant saw. An upload whose artifact carries a registry module without a matching
        record is accepted (the lock is the tenant's approval), and the record is written then.
      x-renox-scope: apps:write
      x-renox-audit: installModule (app, name, version, hash, approved)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_CONFLICT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, version, hash, approved]
              properties:
                source: { type: string, pattern: "^registry:[a-z0-9][a-z0-9-]{0,38}/[a-z][a-z0-9_]{0,31}$" }
                version: { $ref: "#/components/schemas/Semver" }
                hash: { $ref: "#/components/schemas/Sha256" }
                approved: { $ref: "#/components/schemas/ModulePermissions" }
            examples:
              tax: { value: { source: "registry:gulfsoft/tax_gcc", version: "2.1.0", hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, approved: { tables: "tax_gcc__*", network: [], secrets: [], slots: [], hooks: [] } } }
            x-renox-invalid-examples:
              git: { value: { source: "git:https://github.com/acme/x#v1", version: "1.0.0", hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, approved: { network: [], secrets: [], slots: [], hooks: [] } }, x-expect: pattern }
      responses:
        "201":
          description: The approval record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppModule" }
              examples:
                tax: { value: { name: tax_gcc, source: "registry:gulfsoft/tax_gcc", version: "2.1.0", hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, approved: { tables: "tax_gcc__*", network: [], secrets: [], slots: [], hooks: [] }, approved_at: 1793318400000, approved_by: usr_01JBQ40000000000US, disabled: null } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

