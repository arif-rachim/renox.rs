    get:
      operationId: listAppModules
      tags: [registry]
      summary: The registry modules an app has approved, with any disable (section 19)
      x-renox-scope: apps:read
      x-renox-audit: none (read)
      x-renox-errors: [RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND]
      responses:
        "200":
          description: One row per approved module of the app.
          content:
