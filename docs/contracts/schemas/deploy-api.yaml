            application/json:
              schema: { $ref: "#/components/schemas/DeviceStart" }
              examples:
                started: { value: { device_code: "dvc_abcdefghijklmnopqrstuvwxyz234567", user_code: "WDJB-MJHT", verification_uri: "https://dashboard.renox.app/device", expires_in: 600, interval: 5 } }
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/account/device/token:
    post:
      operationId: pollDeviceLogin
      tags: [account]
      summary: Poll the device flow; 202 until a person approves, then the token once (section 18)
      security: []
      x-renox-audit: pollDeviceLogin (token, tenant, user on 201)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code: { type: string, minLength: 16, maxLength: 128 }
            examples:
              poll: { value: { device_code: "dvc_abcdefghijklmnopqrstuvwxyz234567" } }
            x-renox-invalid-examples:
              empty: { value: {}, x-expect: device_code }
      responses:
        "201":
          description: Approved; the token is returned once and the code is used up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceToken" }
              examples:
                token: { value: { tenant_id: t_hello, id: tok_01JBQ40000000000DV, name: renox login, token: renox_pat_abcdefghijklmnopqrstuvwxyz234567, scopes: [apps:read, apps:write, deploy, logs:read], created_at: 1793318000000, expires_at: 1795910000000 } }
        "202":
          description: Not approved yet; poll again after `interval` seconds.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, interval]
                properties:
                  status: { const: authorization_pending }
                  interval: { type: integer, minimum: 1 }
              examples:
                pending: { value: { status: authorization_pending, interval: 5 } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/account/device/approve:
    post:
      operationId: approveDeviceLogin
      tags: [account]
      summary: A signed-in person approves a device code for their current tenant (section 18; stepped up)
      x-renox-scope: tokens:write
      security:
        - sessionCookie: []
      x-renox-audit: approveDeviceLogin (device)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code]
              properties:
                user_code: { type: string, pattern: "^[A-Za-z]{4}-?[A-Za-z]{4}$" }
                scopes: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { $ref: "#/components/schemas/Scope" } }
            examples:
              approve: { value: { user_code: WDJB-MJHT } }
              narrowed: { value: { user_code: WDJB-MJHT, scopes: ["deploy:hello", "logs:read"] } }
            x-renox-invalid-examples:
              bad-code: { value: { user_code: "1234" }, x-expect: pattern }
      responses:
        "200":
          description: Approved; the CLI's next poll receives the token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [approved]
                properties:
                  approved: { const: true }
              examples:
                ok: { value: { approved: true } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StepUp" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/account/mfa:
    get:
      operationId: getMfa
      tags: [account]
      summary: The user's second factors and the session state (section 18; a session or a user token)
      security:
        - sessionCookie: []
        - tenantToken: []
      responses:
        "200":
          description: Factors, recovery codes left, the requirement and grace period, the session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatus" }
              examples:
                enrolled: { value: { totp: true, passkeys: 1, recovery_left: 9, enrolled: true, required: true, grace_until: null, session_state: null, verified_at: 1793318000000 } }
                enrol: { value: { totp: false, passkeys: 0, recovery_left: 0, enrolled: false, required: true, grace_until: 1793000000000, session_state: enrol, verified_at: null } }
                token: { value: { totp: true, passkeys: 0, recovery_left: 10, enrolled: true, required: true, grace_until: null, session_state: null, verified_at: null } }
              x-renox-invalid-examples:
                eleven-codes: { x-expect: maximum, value: { totp: true, passkeys: 0, recovery_left: 11, enrolled: true, required: true, grace_until: null, session_state: null, verified_at: null } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/account/mfa/totp:
    post:
      operationId: startTotp
      tags: [account]
      summary: Start a TOTP enrolment; answers the secret once (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      x-renox-audit: startTotp (user)
      responses:
        "201":
          description: The secret and its otpauth URI; confirm with a code to finish.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secret, otpauth_uri]
                properties:
                  secret: { type: string, pattern: "^[A-Z2-7]{16,64}$" }
                  otpauth_uri: { type: string, pattern: "^otpauth://totp/" }
              examples:
                started: { value: { secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP, otpauth_uri: "otpauth://totp/Renox:owner%40hello.ae?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Renox" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StepUp" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/account/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [account]
      summary: Confirm the TOTP enrolment with a current code (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      x-renox-audit: confirmTotp (user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
            examples:
              code: { value: { code: "492039" } }
            x-renox-invalid-examples:
              letters: { value: { code: abcdef }, x-expect: pattern }
      responses:
        "200":
          description: TOTP is on. `recovery_codes` is the first set, once, or null when the user already has one.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [totp, recovery_codes]
                properties:
                  totp: { const: true }
                  recovery_codes: { oneOf: [{ $ref: "#/components/schemas/RecoveryCodes" }, { type: "null" }] }
              examples:
                first: { value: { totp: true, recovery_codes: [a1b2c-d3e4f, g5h6j-k7m8n, p9q2r-s3t4u, v5w6x-y7z2a, b3c4d-e5f6g, h7j8k-m9n2p, q3r4s-t5u6v, w7x8y-z9a2b, c3d4e-f5g6h, j7k8m-n9p2q] } }
                again: { value: { totp: true, recovery_codes: null } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/account/mfa/passkeys/options:
    post:
      operationId: passkeyOptions
      tags: [account]
      summary: WebAuthn registration options for a new passkey (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      responses:
        "200":
          description: The PublicKeyCredentialCreationOptions, with the challenge base64url-encoded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
              examples:
                options: { value: { challenge: Y2hhbGxlbmdlLTAxMjM0NTY3ODk, rp: { id: dashboard.renox.app, name: Renox }, user: { id: dXNyXzAxSkJRNDAwMDAwMDAwMDBVUw, name: owner@hello.ae, displayName: owner@hello.ae }, pubKeyCredParams: [{ type: public-key, alg: -7 }, { type: public-key, alg: -257 }], excludeCredentials: [], authenticatorSelection: { userVerification: preferred } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StepUp" }

  /v1/account/mfa/passkeys:
    post:
      operationId: registerPasskey
      tags: [account]
      summary: Register the passkey the browser created (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      x-renox-audit: registerPasskey (user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_data, attestation_object]
              properties:
                client_data: { type: string, minLength: 1, maxLength: 4096 }
                attestation_object: { type: string, minLength: 1, maxLength: 16384 }
                name: { type: string, maxLength: 60 }
            examples:
              key: { value: { client_data: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0, attestation_object: o2NmbXRkbm9uZWdhdHRTdG10oA, name: YubiKey 5C } }
            x-renox-invalid-examples:
              no-attestation: { value: { client_data: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0 }, x-expect: attestation_object }
      responses:
        "201":
          description: Registered. `recovery_codes` as for confirmTotp.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [passkeys, recovery_codes]
                properties:
                  passkeys: { type: integer, minimum: 1 }
                  recovery_codes: { oneOf: [{ $ref: "#/components/schemas/RecoveryCodes" }, { type: "null" }] }
              examples:
                registered: { value: { passkeys: 1, recovery_codes: null } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/account/mfa/challenge:
    post:
      operationId: mfaChallenge
      tags: [account]
      summary: WebAuthn assertion options for the user's passkeys (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      responses:
        "200":
          description: The PublicKeyCredentialRequestOptions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challenge, rpId, allowCredentials, userVerification]
                properties:
                  challenge: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
                  rpId: { type: string }
                  allowCredentials:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [type, id]
                      properties:
                        type: { const: public-key }
                        id: { type: string }
                  userVerification: { enum: [preferred, required, discouraged] }
              examples:
                options: { value: { challenge: Y2hhbGxlbmdlLTAxMjM0NTY3ODk, rpId: dashboard.renox.app, allowCredentials: [{ type: public-key, id: Y3JlZC0x }], userVerification: preferred } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/account/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [account]
      summary: Pass the second factor; clears `verify`, opens the 15-minute step-up window (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      x-renox-audit: verifyMfa (user, method)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
            examples:
              totp: { value: { method: totp, code: "492039" } }
              recovery: { value: { method: recovery, code: a1b2c-d3e4f } }
              passkey: { value: { method: passkey, credential_id: Y3JlZC0x, client_data: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0, authenticator_data: SZYN5YgOjGh0NBcPZHZgW4, signature: MEUCIQDx } }
            x-renox-invalid-examples:
              sms: { value: { method: sms, code: "492039" }, x-expect: oneOf }
      responses:
        "200":
          description: Verified now.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified_at]
                properties:
                  verified_at: { $ref: "#/components/schemas/UnixMs" }
              examples:
                ok: { value: { verified_at: 1793318000000 } }
        "400": { $ref: "#/components/responses/Validation" }
        "401":
          description: The code, recovery code or assertion did not verify (or no credential).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid:
                  value:
                    error:
                      code: RENOX_UNAUTHENTICATED
                      message: Authentication is required.
                      request_id: 01JBQ3Z7MA0000000000000041
                      details: [{ field: mfa, reason: invalid }]
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [account]
      summary: A new set of ten recovery codes; the old set stops working (section 18; stepped up)
      security:
        - sessionCookie: []
        - tenantToken: []
      x-renox-audit: regenerateRecoveryCodes (user)
      responses:
        "200":
          description: The new set, shown once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovery_codes]
                properties:
                  recovery_codes: { $ref: "#/components/schemas/RecoveryCodes" }
              examples:
                codes: { value: { recovery_codes: [a1b2c-d3e4f, g5h6j-k7m8n, p9q2r-s3t4u, v5w6x-y7z2a, b3c4d-e5f6g, h7j8k-m9n2p, q3r4s-t5u6v, w7x8y-z9a2b, c3d4e-f5g6h, j7k8m-n9p2q] } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StepUp" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/account/mfa/disable:
    post:
      operationId: disableMfa
      tags: [account]
      summary: Turn two-step verification off with the password and a current code (section 18)
      security:
        - sessionCookie: []
        - tenantToken: []
      x-renox-audit: disableMfa (user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password: { type: string, minLength: 1, maxLength: 256 }
                code: { type: string, minLength: 6, maxLength: 16 }
            examples:
              off: { value: { password: "correct horse battery staple", code: "492039" } }
            x-renox-invalid-examples:
              no-code: { value: { password: "correct horse battery staple" }, x-expect: code }
      responses:
        "200":
          description: Off. `session_state` is `enrol` when the user is still required to have a factor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enrolled, session_state]
                properties:
                  enrolled: { const: false }
                  session_state: { enum: [enrol, null] }
              examples:
                off: { value: { enrolled: false, session_state: null } }
                owner: { value: { enrolled: false, session_state: enrol } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/team/mfa-required:
    post:
      operationId: setTeamMfaRequired
      tags: [account]
      summary: Require a second factor of every member of the team (section 18; stepped up)
      x-renox-scope: team:write
      security:
        - sessionCookie: []
      x-renox-audit: setTeamMfaRequired (tenant, required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [required]
              properties:
                required: { type: boolean }
            examples:
              on: { value: { required: true } }
            x-renox-invalid-examples:
              string: { value: { required: "yes" }, x-expect: type }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenant_id, mfa_required]
                properties:
                  tenant_id: { $ref: "#/components/schemas/TenantId" }
                  mfa_required: { type: boolean }
              examples:
                on: { value: { tenant_id: t_hello, mfa_required: true } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StepUp" }

  # ---------------------------------------------------------------------------
  # 0.5 (F7, #319): registry (section 19), billing (20), onboarding (21),
  # abuse (22), advisories (11.2), AI gateway (23).
  # ---------------------------------------------------------------------------

  /v1/publishers:
    post:
      operationId: createPublisher
      tags: [registry]
      summary: Claim a publisher name with its first Ed25519 key (section 19)
      x-renox-scope: registry:publish
      x-renox-audit: createPublisher (publisher, key_id)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_CONFLICT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, public_key]
              properties:
                name: { $ref: "#/components/schemas/PublisherName" }
                public_key: { $ref: "#/components/schemas/Ed25519PublicKey" }
            examples:
              gulfsoft: { value: { name: gulfsoft, public_key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8 } }
            x-renox-invalid-examples:
              upper: { value: { name: GulfSoft, public_key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8 }, x-expect: pattern }
      responses:
        "201":
          description: The publisher, owned by the caller's tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publisher" }
              examples:
                created: { $ref: "#/components/examples/PublisherNew" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/publishers/{publisher}/keys:
    parameters:
      - $ref: "#/components/parameters/Publisher"
    post:
      operationId: rotatePublisherKey
      tags: [registry]
      summary: Add a signing key and revoke older ones (section 19)
      x-renox-scope: registry:publish
      x-renox-audit: rotatePublisherKey (publisher, key_id added, key_ids revoked)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_CONFLICT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key: { $ref: "#/components/schemas/Ed25519PublicKey" }
                revoke: { type: array, maxItems: 16, uniqueItems: true, items: { $ref: "#/components/schemas/KeyId" } }
            examples:
              rotate: { value: { public_key: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8, revoke: ["ed25519:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8"] } }
            x-renox-invalid-examples:
              short: { value: { public_key: abc }, x-expect: pattern }
      responses:
        "200":
          description: The publisher with its keys. A revoked key no longer verifies new installs; installed locks keep working until the next `renox install`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publisher" }
              examples:
                rotated: { $ref: "#/components/examples/PublisherRotated" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/registry:
    get:
      operationId: listRegistryModules
      tags: [registry]
      summary: List and search the registry (section 19)
      x-renox-scope: registry:read
      x-renox-audit: none (read)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: "Words matched against publisher, name and description" }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The newest enabled version of each matching module, 50 per page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RegistryModule" } }
                  next_cursor: { type: [string, "null"], maxLength: 200 }
              examples:
                search: { $ref: "#/components/examples/RegistryList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }

  /v1/registry/{publisher}/{name}/{version}:
    parameters:
      - $ref: "#/components/parameters/Publisher"
      - $ref: "#/components/parameters/ModuleName"
      - $ref: "#/components/parameters/ModuleVersion"
    put:
      operationId: publishModuleVersion
      tags: [registry]
      summary: Publish one immutable module version (section 19)
      description: >-
        The body is the module tree as a POSIX tar with `module.sig` at its root (manifest.md 1.2,
        section 5). The API recomputes the tree hash without `module.sig`, checks the signature
        against an unrevoked key of the publisher, checks the manifest (MF1-MF15 that a single tree
        can prove) and stores the tar under registry/<publisher>/<name>/<version>.tar. A version
        that exists is refused with 409, even with the same bytes.
      x-renox-scope: registry:publish
      x-renox-audit: publishModuleVersion (publisher, name, version, hash, key_id)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_CONFLICT, RENOX_BODY_TOO_LARGE, RENOX_DEPLOY_REJECTED]
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary, maxLength: 20971520 }
            examples:
              tax: { summary: "The tax_gcc 2.1.0 tree with module.sig", value: "<tar of the tax_gcc module tree>" }
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryModule" }
              examples:
                tax: { $ref: "#/components/examples/RegistryModuleTax" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
    get:
      operationId: getModuleVersion
      tags: [registry]
      summary: One module version with the permission summary shown at install (section 19)
      x-renox-scope: registry:read
