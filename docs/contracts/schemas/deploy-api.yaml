              additionalProperties: false
              required: [email, password, dpa_accepted, captcha_token]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 256 }
                tenant_id: { $ref: "#/components/schemas/TenantId" }
                tenant_name: { type: string, minLength: 1, maxLength: 128 }
                dpa_accepted: { const: true }
                captcha_token: { type: string, minLength: 1, maxLength: 4096 }
                locale: { enum: [en, ar] }
            examples:
              new: { value: { email: "founder@hello.ae", password: "correct horse battery staple", tenant_id: t_hello, tenant_name: "Hello Trading", dpa_accepted: true, captcha_token: "0.turnstile-token", locale: en } }
            x-renox-invalid-examples:
              nodpa: { value: { email: "founder@hello.ae", password: "correct horse battery staple", tenant_name: "Hello Trading", dpa_accepted: false, captcha_token: "x" }, x-expect: const }
      responses:
        "202":
          description: A verification email is on its way (or a sign-in notice to an existing account).
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [status], properties: { status: { const: check_email } } }
              examples:
                sent: { value: { status: check_email } }
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/account/verify:
    post:
      operationId: verifyEmail
      tags: [onboarding]
      summary: Confirm the address with the emailed token (section 21; from 0.5 also signs the user in, #326)
      security: []
      x-renox-audit: verifyEmail (user, tenant)
      x-renox-errors: [RENOX_NOT_FOUND, RENOX_RATE_LIMITED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [token], properties: { token: { type: string, pattern: "^[a-z2-7]{32}$" } } }
            examples:
              token: { value: { token: "abcdefghijklmnopqrstuvwxyz234567" } }
            x-renox-invalid-examples:
              short: { value: { token: abc }, x-expect: pattern }
      responses:
        "200":
          description: Verified; the session cookie is set as by `login` (section 18).
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [user_id, email_verified], properties: { user_id: { $ref: "#/components/schemas/UserId" }, tenant_id: { $ref: "#/components/schemas/TenantId" }, email_verified: { const: true } } }
              examples:
                ok: { value: { user_id: usr_01JBQ40000000000US, tenant_id: t_hello, email_verified: true } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/apps/from-template:
    post:
      operationId: createAppFromTemplate
      tags: [onboarding]
      summary: Create an app and deploy a starter template in one call (section 21)
      x-renox-scope: apps:write
      x-renox-audit: createAppFromTemplate (app, template, hash)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_CONFLICT, RENOX_UNAVAILABLE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, template]
              properties:
                name: { $ref: "#/components/schemas/AppName" }
                template: { enum: [hello, shop, booking, invoices] }
            examples:
              shop: { value: { name: hello-shop, template: shop } }
            x-renox-invalid-examples:
              unknown: { value: { name: hello-shop, template: wordpress }, x-expect: enum }
      responses:
        "201":
          description: The app, with the template's artifact uploaded and activated; `first_deploy_at` of the tenant is set by the first activation (section 21).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [app, template, hash, url]
                properties:
                  app: { $ref: "#/components/schemas/AppName" }
                  template: { type: string }
                  hash: { $ref: "#/components/schemas/Sha256" }
                  url: { type: string, pattern: "^https://" }
              examples:
                shop: { value: { app: hello-shop, template: shop, hash: 802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a, url: "https://hello-shop.renox.app" } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/abuse:
    post:
      operationId: reportAbuse
      tags: [abuse]
      summary: Report phishing, malware or other abuse on a Renox host (section 22; public)
      security: []
      x-renox-audit: reportAbuse (ticket, hostname, category; never the reporter's address)
      x-renox-errors: [RENOX_VALIDATION, RENOX_RATE_LIMITED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, category, description, captcha_token]
              properties:
                url: { type: string, pattern: "^https?://", maxLength: 2048 }
                category: { $ref: "#/components/schemas/AbuseCategory" }
                description: { type: string, minLength: 10, maxLength: 4000 }
                reporter_email: { type: string, format: email, maxLength: 254 }
                captcha_token: { type: string, minLength: 1, maxLength: 4096 }
            examples:
              phishing: { value: { url: "https://secure-login-bank.renox.app/verify", category: phishing, description: "Imitates a UAE bank's login and posts the password to a form", captcha_token: "0.turnstile-token" } }
            x-renox-invalid-examples:
              category: { value: { url: "https://x.renox.app", category: rude, description: "a long enough text", captcha_token: x }, x-expect: enum }
      responses:
        "202":
          description: A ticket; the reporter, when an address is given, gets its id and the outcome.
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [ticket_id], properties: { ticket_id: { $ref: "#/components/schemas/AbuseTicketId" } } }
              examples:
                ticket: { value: { ticket_id: abt_01JBQ3Z7MA0000000000000001 } }
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/ops/abuse:
    get:
      operationId: listAbuseTickets
      tags: [ops]
      summary: Open and recent abuse tickets (section 22; operator)
      security:
        - operatorToken: []
      x-renox-operator-scope: ops:read
      x-renox-audit: listAbuseTickets (operator; a read)
      x-renox-errors: [RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE]
      parameters:
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/AbuseState" } }
      responses:
        "200":
          description: At most 100 tickets, oldest open first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AbuseTicket" } }
              examples:
                open: { value: { items: [{ id: abt_01JBQ3Z7MA0000000000000001, hostname: secure-login-bank.renox.app, tenant_id: t_phish, category: phishing, state: open, safe_browsing: unsafe, reported_at: 1793318400000, updated_at: 1793318400000, reason: null }] } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }

  /v1/ops/abuse/{ticket_id}:
    parameters:
      - { name: ticket_id, in: path, required: true, schema: { $ref: "#/components/schemas/AbuseTicketId" } }
    post:
      operationId: setAbuseTicket
      tags: [ops]
      summary: Move a ticket through the takedown states (section 22; operator)
      description: >-
        `taken_down` suspends every route of the hostname's tenant with the neutral page of
        section 20 (the tenant's data stays) and emails the owner with the reason; `restored`
        undoes it. Transitions follow the abuse table of section 22.
      security:
        - operatorToken: []
      x-renox-operator-scope: ops:write
      x-renox-audit: setAbuseTicket (operator, ticket, from, to, reason)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND, RENOX_CONFLICT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, reason]
              properties:
                state: { $ref: "#/components/schemas/AbuseState" }
                reason: { type: string, minLength: 10, maxLength: 500 }
            examples:
              takedown: { value: { state: taken_down, reason: "Confirmed bank phishing; Safe Browsing unsafe" } }
            x-renox-invalid-examples:
              short: { value: { state: taken_down, reason: "yes" }, x-expect: minLength }
      responses:
        "200":
          description: The ticket after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbuseTicket" }
              examples:
                down: { value: { id: abt_01JBQ3Z7MA0000000000000001, hostname: secure-login-bank.renox.app, tenant_id: t_phish, category: phishing, state: taken_down, safe_browsing: unsafe, reported_at: 1793318400000, updated_at: 1793322000000, reason: "Confirmed bank phishing; Safe Browsing unsafe" } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/apps/{app}/deployments/{hash}/advisories:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: getAdvisories
      tags: [deployments]
      summary: Known vulnerabilities of the deployment's bundled packages, from its SBOM (section 11.2)
      x-renox-scope: apps:read
      x-renox-audit: none (read)
      x-renox-errors: [RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND]
      responses:
        "200":
          description: OSV results for the components of `sbom.cdx.json`; a warning, never a block. Empty without an SBOM.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [hash, sbom, checked_at, items]
                properties:
                  hash: { $ref: "#/components/schemas/Sha256" }
                  sbom: { type: boolean, description: "Whether the artifact carries sbom.cdx.json" }
                  checked_at: { type: [integer, "null"], minimum: 0 }
                  items:
                    type: array
                    maxItems: 500
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, package, version, severity, summary, fixed_in]
                      properties:
                        id: { type: string, maxLength: 64, description: "OSV id (GHSA-..., CVE-...)" }
                        package: { type: string, maxLength: 214 }
                        version: { type: string, maxLength: 64 }
                        severity: { enum: [low, moderate, high, critical, unknown] }
                        summary: { type: string, maxLength: 500 }
                        fixed_in: { type: [string, "null"], maxLength: 64 }
              examples:
                one: { value: { hash: 802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a, sbom: true, checked_at: 1793318400000, items: [{ id: GHSA-9c47-m6qq-7p4h, package: json5, version: "2.2.1", severity: high, summary: "Prototype pollution in JSON5 via parse", fixed_in: "2.2.2" }] } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: The AI gateway for cells (section 23); the platform holds the provider keys
      description: >-
        A node calls it for a tenant's `ctx.ai.chat` in gateway mode (ops.md section 23). The
        node token's node must own the tenant. The gateway checks the tenant's monthly token
        quota before the call, meters input and output tokens after it, and answers from its
        cache for a byte-identical request of the same tenant (section 23, "Cache").
      security:
        - nodeToken: []
      x-renox-audit: none (metered; a refusal writes an audit row)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_AI_QUOTA, RENOX_AI_UNAVAILABLE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatRequest" }
            examples:
              invoice: { value: { tenant_id: t_hello, app: hello-shop, request_id: 01JBQ3Z7MA0000000000000400, model: default, system: "You write short invoice notes.", messages: [{ role: user, content: "Summarise invoice INV-42 in one line" }], max_tokens: 200 } }
            x-renox-invalid-examples:
              tokens: { value: { tenant_id: t_hello, app: hello-shop, request_id: 01JBQ3Z7MA0000000000000400, model: default, messages: [{ role: user, content: hi }], max_tokens: 0 }, x-expect: minimum }
      responses:
        "200":
          description: The model's answer and the tokens charged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatResult" }
              examples:
                invoice: { value: { model: claude-sonnet-5-5, content: [{ type: text, text: "INV-42: 3 items, AED 1,050 incl. VAT, due 15 Nov." }], stop_reason: end_turn, usage: { input_tokens: 41, output_tokens: 18 }, cached: false } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "429":
          description: The tenant's monthly AI tokens are used up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                quota: { value: { error: { code: RENOX_AI_QUOTA, message: The monthly AI quota is used up., request_id: 01JBQ3Z7MA0000000000000401 } } }
        "503":
          description: Every provider of the model's row failed or timed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                down: { value: { error: { code: RENOX_AI_UNAVAILABLE, message: The AI provider is unavailable., request_id: 01JBQ3Z7MA0000000000000402 } } }

components:
  securitySchemes:
    tenantToken:
      type: http
      scheme: bearer
      description: "`renox_pat_<32 base32>`; scoped (x-renox-scope on each operation), expiring, sha256 at rest."
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-renox_session
      description: "A signed-in user's session (section 2), with `X-Renox-CSRF` on POST, PUT, PATCH, DELETE."
    nodeToken:
      type: http
      scheme: bearer
      description: "`renox_node_<32 base32>`; bound to one node_id; the {node_id} path parameter and every node_id in a body must equal it."
    operatorToken:
      type: http
      scheme: bearer
      description: "`renox_op_<32 base32>`: the bootstrap token, whose sha256 is configured in the API's environment and which holds `ops:write` and `ops:read`, or (0.3) a token an account flagged `operator` created with `ops:write`, `ops:read` (0.3.1) or `ops:impersonate` (0.4; only when created with it explicitly, alone or with `ops:read`, at most 1 day; neither `ops:write` nor the bootstrap token grants it) (section 17)."

  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AppName" }
    Hash:
      name: hash
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Sha256" }
    SecretName:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SecretName" }
    Hostname:
      name: hostname
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Hostname" }
    NodeId:
      name: node_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/NodeId" }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/TenantId" }

    Publisher:
      name: publisher
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublisherName" }
    ModuleName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
    ModuleVersion:
      name: version
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Semver" }
  schemas:
    Sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    TenantId: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,62}$" }
    AppName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,49}$"
      description: The artifact's app.name, at most 50 characters so that preview hosts fit one DNS label.
    NodeId: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    SecretName: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
    TokenId: { type: string, pattern: "^tok_[0-9A-Za-z]{16,32}$" }
    Hostname:
      type: string
      maxLength: 253
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$"
    UnixMs: { type: integer, minimum: 0 }
    Tier: { enum: [free, paid] }
    Scope:
      type: string
      pattern: "^(\\*|(apps:read|apps:write|deploy|logs:read|secrets:read|secrets:write|domains:write|tokens:write|registry:read|registry:publish)(:[a-z][a-z0-9-]{0,49})?|ops:write|ops:read|ops:impersonate)$"
      description: "`<action>` for every app of the tenant, `<action>:<app>` for one app, `*` for all of those. `ops:write` (0.3) and `ops:read` (0.3.1, granted by `ops:write`; section 17) only on tokens an operator account creates; `*` never includes them. `ops:impersonate` (0.4) is the break-glass scope of section 17, granted by nothing else."

    Health:
      type: object
      additionalProperties: false
      required: [status, postgres, object_storage]
      properties:
        status: { enum: [ok, degraded] }
        postgres: { enum: [ok, unreachable] }
        object_storage: { enum: [ok, unreachable] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, pattern: "^RENOX_[A-Z0-9]+(_[A-Z0-9]+)*$" }
            message: { type: string, minLength: 1, maxLength: 200 }
            request_id: { type: string, pattern: "^[0-9A-Za-z_-]{8,64}$" }
            deployment: { $ref: "#/components/schemas/Sha256" }
            details:
              type: array
              maxItems: 50
              items:
                anyOf:
                  - { $ref: "#/components/schemas/Violation" }
                  - { $ref: "#/components/schemas/FieldError" }
                  - { $ref: "control-messages.schema.json#/$defs/activation_error" }

    Violation:
      type: object
      additionalProperties: false
      required: [rule, reason]
      description: >-
        One broken artifact rule (artifact.md section 6), upload rule (T1-T8) or bundle-hygiene
        rule (H1, H2) of deploy-api.md section 4. Never a filesystem path of the server, never
        the text of a secret an H2 violation found (only its pattern and a masked prefix).
      properties:
        rule: { type: string, pattern: "^(V([1-9]|1[0-6])|T[1-8]|H[12])$" }
        path: { type: string, maxLength: 1024 }
        field: { type: string, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 512 }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 512 }

    CreateAppRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/AppName" }
        staging: { type: boolean, description: "0.3: a staging app has a database of its own (`<tenant_id>.<name>`) and accepts importDatabase (section 14). Set at creation only; default false." }

    App:
      type: object
      additionalProperties: false
      required: [name, tenant_id, created_at, active_deployment, hostnames]
      properties:
        name: { $ref: "#/components/schemas/AppName" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        active_deployment:
          anyOf:
            - { $ref: "#/components/schemas/Sha256" }
            - { type: "null" }
        hostnames: { type: array, items: { $ref: "#/components/schemas/Hostname" } }
        staging: { type: boolean, description: "0.3: see CreateAppRequest." }
        database: { $ref: "#/components/schemas/DatabaseId", description: "0.3: the tenant file the app's cells open; missing means the tenant's shared file." }

    DeploymentState:
      enum: [uploaded, validated, rejected, activating, active, superseded, suspended, pruned]

    Deployment:
      type: object
      additionalProperties: false
      required: [app, hash, state, created_at, updated_at, size_bytes, permissions, secrets_version, activated_at, last_error, violations]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        hash: { $ref: "#/components/schemas/Sha256" }
        state: { $ref: "#/components/schemas/DeploymentState" }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        updated_at: { $ref: "#/components/schemas/UnixMs" }
        size_bytes: { type: integer, minimum: 0, description: Uncompressed bytes of the artifact's files. }
        permissions:
          type: object
          additionalProperties: false
          required: [network, secrets]
          description: The manifest's permissions as approved at upload.
          properties:
            network: { type: array, items: { type: string } }
            secrets: { type: array, items: { $ref: "#/components/schemas/SecretName" } }
        secrets_version:
          type: [integer, "null"]
          minimum: 0
          description: Secret-set version pinned at the last activation; null before the first.
        activated_at: { type: [integer, "null"], minimum: 0 }
        last_error:
          anyOf:
            - { $ref: "control-messages.schema.json#/$defs/activation_error" }
            - { type: "null" }
        violations:
          type: [array, "null"]
          maxItems: 50
          items: { $ref: "#/components/schemas/Violation" }
          description: Set when state is rejected.

    Usage:
      type: object
      additionalProperties: false
      required: [requests, cpu_ms, wall_ms, egress_bytes, fetch_sent_bytes, db_ms, db_rows, render_fuel]
      description: Sums of the meter record fields of the same names (meter.md section 2); the *_ms sums are rounded to 3 decimals.
      properties:
        requests: { type: integer, minimum: 0 }
        cpu_ms: { type: number, minimum: 0 }
        wall_ms: { type: number, minimum: 0 }
        egress_bytes: { type: integer, minimum: 0 }
        fetch_sent_bytes: { type: integer, minimum: 0 }
        db_ms: { type: number, minimum: 0 }
        db_rows: { type: integer, minimum: 0 }
        render_fuel: { type: integer, minimum: 0 }

    UsageHour:
      type: object
      additionalProperties: false
      required: [hour_start, requests, cpu_ms, wall_ms, egress_bytes, fetch_sent_bytes, db_ms, db_rows, render_fuel]
      description: One hour of the rollup; hour_start is a multiple of 3,600,000.
      properties:
        hour_start: { $ref: "#/components/schemas/UnixMs" }
        requests: { type: integer, minimum: 0 }
        cpu_ms: { type: number, minimum: 0 }
        wall_ms: { type: number, minimum: 0 }
        egress_bytes: { type: integer, minimum: 0 }
        fetch_sent_bytes: { type: integer, minimum: 0 }
        db_ms: { type: number, minimum: 0 }
        db_rows: { type: integer, minimum: 0 }
        render_fuel: { type: integer, minimum: 0 }
        latency_p50_ms: { type: number, minimum: 0, description: "0.4: the median of the hour's request wall_ms; absent for hours rolled up before 0.4." }
        latency_p95_ms: { type: number, minimum: 0, description: "0.4: the 95th percentile of the hour's request wall_ms." }
        realtime_conn_seconds: { type: number, minimum: 0, description: "0.4: the sum of the meter 0.3 realtime connection seconds (meter.md)." }
        realtime_messages: { type: integer, minimum: 0, description: "0.4: the sum of the meter 0.3 realtime messages (meter.md)." }

    QuotaAmounts:
      type: object
      additionalProperties: false
      required: [requests, cpu_ms, egress_bytes]
      description: >-
        The billing dimensions (meter.md section 7): charged requests, billed CPU
        (cpu_ms + render_ms), billed egress (egress_bytes + fetch_sent_bytes).
      properties:
        requests: { type: integer, minimum: 0 }
        cpu_ms: { type: number, minimum: 0 }
        egress_bytes: { type: integer, minimum: 0 }

    QuotaState:
      type: object
      additionalProperties: false
      required: [tenant_id, tier, period_start, period_end, used, limits, over]
      description: The tenant's monthly quota state (all apps); `over` lists the dimensions above their limit.
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        tier: { $ref: "#/components/schemas/Tier" }
        period_start: { $ref: "#/components/schemas/UnixMs" }
        period_end: { $ref: "#/components/schemas/UnixMs" }
        used: { $ref: "#/components/schemas/QuotaAmounts" }
        limits: { $ref: "#/components/schemas/QuotaAmounts" }
        over:
          type: array
          maxItems: 3
          items: { enum: [requests, cpu_ms, egress_bytes] }

    AppUsage:
      type: object
      additionalProperties: false
      required: [app, from, to, hours, total, quota]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        from: { $ref: "#/components/schemas/UnixMs" }
        to: { $ref: "#/components/schemas/UnixMs" }
        hours: { type: array, items: { $ref: "#/components/schemas/UsageHour" } }
        total: { $ref: "#/components/schemas/Usage" }
        quota: { $ref: "#/components/schemas/QuotaState" }
        client_events: { $ref: "#/components/schemas/ClientEventsQuota" }

    ClientEventsQuota:
      type: object
      additionalProperties: false
      required: [used_today, daily_cap, warning]
      description: >-
        The tenant's browser events since 00:00 UTC against the daily cap (client-events.md
        section 7: 10 % of the daily log allowance, proposed). `warning` is true from 80 %
        of the cap. Client events count here only, never toward the per-minute log cap.
      properties:
        used_today: { type: integer, minimum: 0 }
        daily_cap: { type: integer, minimum: 1 }
        warning: { type: boolean }

    ClientErrorFingerprint:
      type: string
      pattern: "^[0-9a-f]{16}$"
      description: 16 lowercase hex characters; computed by the control plane at ingestion from kind, top frame and normalised message.

    ClientErrorStatus: { enum: [open, resolved, ignored] }

    ClientErrorKind:
      enum: [js.error, js.unhandledrejection, js.console.error, htmx.responseError, htmx.sendError, htmx.timeout, htmx.targetError, htmx.swapError, csp.violation, realtime.connectError, realtime.closed]

    OriginalPosition:
      type: object
      additionalProperties: false
      required: [file, line, column]
      properties:
        file: { type: string, minLength: 1, maxLength: 2048 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 0 }

    ClientErrorFrame:
      type: object
      additionalProperties: false
      required: [file, line, column, function, original]
      description: >-
        One stack frame as the browser reported it (client-events.md section 8: file, line,
        column, function only) and, when a private sourcemap of the event's deployment matched,
        its original position. `original` is null when none matched; the raw position is always kept.
        Lines and columns are 1-based, like the browser's stack; 0 means the browser gave none.
      properties:
        file: { type: string, minLength: 1, maxLength: 2048 }
        line: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }
        function: { type: [string, "null"], maxLength: 256 }
        original:
          anyOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/OriginalPosition" }

    ClientErrorDeploymentCount:
      type: object
      additionalProperties: false
      required: [deployment_hash, count]
      properties:
        deployment_hash: { $ref: "#/components/schemas/Sha256" }
        count: { type: integer, minimum: 1 }

    ClientErrorGroup:
      type: object
      additionalProperties: false
      required: [fingerprint, kind, message, status, first_seen, last_seen, count, regressed, deployments, top_frame]
      properties:
        fingerprint: { $ref: "#/components/schemas/ClientErrorFingerprint" }
        kind: { $ref: "#/components/schemas/ClientErrorKind" }
        message: { type: string, maxLength: 2048, description: "Message of the most recent event, already redacted." }
        status: { $ref: "#/components/schemas/ClientErrorStatus" }
        first_seen: { $ref: "#/components/schemas/UnixMs" }
        last_seen: { $ref: "#/components/schemas/UnixMs" }
        count: { type: integer, minimum: 1, description: "Events in the group, all deployments." }
        regressed: { type: boolean, description: "True while the group is open again after having been resolved on an older deployment." }
        deployments:
          type: array
          maxItems: 100
          description: Count per deployment, newest deployment first (the sparkline of the Logs screen).
          items: { $ref: "#/components/schemas/ClientErrorDeploymentCount" }
        top_frame:
          anyOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/ClientErrorFrame" }

    ClientErrorGroupList:
      type: object
      additionalProperties: false
      required: [groups, next_cursor]
      properties:
        groups: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ClientErrorGroup" } }
        next_cursor: { type: [string, "null"], maxLength: 256 }

    ClientErrorEvent:
      type: object
      additionalProperties: false
      required: [ts, client_ts, deployment_hash, request_id, message, url, ua, frames]
      properties:
        ts: { $ref: "#/components/schemas/UnixMs", description: "Gateway receive time." }
        client_ts: { $ref: "#/components/schemas/UnixMs", description: "Browser clock." }
        deployment_hash: { $ref: "#/components/schemas/Sha256" }
        request_id: { type: [string, "null"], pattern: "^[0-9A-Za-z_-]{8,64}$", description: "Links the event to the server log lines of the same request." }
        message: { type: string, maxLength: 2048 }
        url: { type: string, maxLength: 2048 }
        ua: { enum: [chrome, edge, firefox, safari, samsung, other], description: "The browser family only (client-events.md section 4)." }
        frames: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/ClientErrorFrame" } }

    ClientErrorDetail:
      type: object
      additionalProperties: false
      required: [group, events]
      properties:
        group: { $ref: "#/components/schemas/ClientErrorGroup" }
        events: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ClientErrorEvent" } }

    SetClientErrorStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ClientErrorStatus" }

    ActivateRequest:
      type: object
      additionalProperties: false
      required: [hash]
      properties:
        hash: { $ref: "#/components/schemas/Sha256" }

    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        hash: { $ref: "#/components/schemas/Sha256" }

    PutSecretRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 8
          maxLength: 65536
          description: At least 8 characters and 8 UTF-8 bytes (ops.md section 3); at most 64 KiB.

    SecretWritten:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        version: { type: integer, minimum: 1 }

    SecretList:
      type: object
      additionalProperties: false
      required: [version, secrets]
      properties:
        version: { type: integer, minimum: 0 }
        secrets:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [name, updated_at]
            properties:
              name: { $ref: "#/components/schemas/SecretName" }
              updated_at: { $ref: "#/components/schemas/UnixMs" }

    AddDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: { $ref: "#/components/schemas/Hostname" }

    DomainState: { enum: [pending, verified, detached, released] }

    Domain:
      type: object
      additionalProperties: false
      required: [hostname, app, state, verification, dns, certificate, created_at, verified_at, last_checked_at]
      properties:
        hostname: { $ref: "#/components/schemas/Hostname" }
        app: { $ref: "#/components/schemas/AppName" }
        state: { $ref: "#/components/schemas/DomainState" }
        verification:
          type: object
          additionalProperties: false
          required: [record_type, record_name, record_value]
          properties:
            record_type: { const: TXT }
            record_name: { type: string, pattern: "^_renox-verify\\." }
            record_value: { type: string, pattern: "^rnx-verify-[0-9a-z]{26}$" }
        dns: { enum: [pending, ok, not_pointing] }
        certificate:
          type: object
          additionalProperties: false
          required: [state, not_after]
          properties:
            state: { enum: [none, issuing, issued, failed] }
            not_after: { type: [integer, "null"], minimum: 0 }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        verified_at: { type: [integer, "null"], minimum: 0 }
        last_checked_at: { type: [integer, "null"], minimum: 0 }

    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expires_in_days]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9 ._-]{1,64}$" }
        scopes: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: "#/components/schemas/Scope" } }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }

    Token:
      type: object
      additionalProperties: false
      required: [id, name, scopes, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { $ref: "#/components/schemas/TokenId" }
        name: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }
        last_used_at: { type: [integer, "null"], minimum: 0 }
        revoked_at: { type: [integer, "null"], minimum: 0 }

    TokenCreated:
      type: object
      additionalProperties: false
      required: [id, name, token, scopes, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/TokenId" }
        name: { type: string }
        token:
          type: string
          pattern: "^renox_(pat|op)_[a-z2-7]{32}$"
          description: "`renox_pat_` for a tenant token; `renox_op_` (0.3.1) for the token of an operator account (section 17), whose scopes are `ops:write` or `ops:read` only."
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, name, tier]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        name: { type: string, minLength: 1, maxLength: 128 }
        tier: { $ref: "#/components/schemas/Tier" }

    Tenant:
      type: object
      additionalProperties: false
      required: [tenant_id, name, tier, state, created_at]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        name: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        state: { enum: [active, suspended] }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        first_deploy_at: { type: [integer, "null"], minimum: 0, description: "0.5 (section 21): the tenant's first activation, or null." }
        restrictions: { type: array, uniqueItems: true, items: { enum: [reduced_quotas, no_custom_domain] }, description: "0.5 (section 21): the new-tenant limits still in force." }

    TenantCreated:
      type: object
      additionalProperties: false
      required: [tenant, token]
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }
        token: { $ref: "#/components/schemas/TokenCreated" }

    CreateNodeRequest:
      type: object
      additionalProperties: false
      required: [node_id]
      properties:
        node_id: { $ref: "#/components/schemas/NodeId" }

    NodeTokenCreated:
      type: object
      additionalProperties: false
      required: [node_id, token, created_at]
      properties:
        node_id: { $ref: "#/components/schemas/NodeId" }
        token: { type: string, pattern: "^renox_node_[a-z2-7]{32}$" }
        created_at: { $ref: "#/components/schemas/UnixMs" }

    IngestResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }


    GenerationId: { type: string, pattern: "^[0-9a-f]{16}$" }
    DatabaseId:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]{0,62}(\\.[a-z][a-z0-9-]{0,49})?$"
      description: "The tenant id (the tenant's shared file) or <tenant_id>.<app> (an app with a database of its own, section 14)."

    BackupStatus:
      type: object
      additionalProperties: false
      required: [app, database, replication, state, replica, last_sync_at, lag_seconds, retention_hours, generations, db, last_failover, stale]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        database: { $ref: "#/components/schemas/DatabaseId" }
        replication: { enum: [none, litestream] }
        state: { enum: ["off", starting, replicating, stopped] }
        replica:
          anyOf:
            - { $ref: "control-messages.schema.json#/$defs/replica" }
            - { type: "null" }
        last_sync_at:
          anyOf:
            - { $ref: "#/components/schemas/UnixMs" }
            - { type: "null" }
        lag_seconds: { type: [number, "null"], minimum: 0 }
        retention_hours: { type: integer, minimum: 0 }
        generations:
          type: array
          maxItems: 100
          description: Restore points, newest first; a restore can reach any time inside one generation's range.
          items: { $ref: "control-messages.schema.json#/$defs/generation" }
        db: { $ref: "control-messages.schema.json#/$defs/database_size" }
        last_failover:
          anyOf:
            - { $ref: "#/components/schemas/FailoverRecord" }
            - { type: "null" }
        stale: { type: boolean, description: "true: the owning node did not answer; the fields are the last status the control plane saw." }

    FailoverRecord:
      type: object
      additionalProperties: false
      required: [at, from_node, to_node, generation, elapsed_ms]
      properties:
        at: { $ref: "#/components/schemas/UnixMs" }
        from_node: { $ref: "#/components/schemas/NodeId" }
        to_node: { $ref: "#/components/schemas/NodeId" }
        generation:
          anyOf:
            - { $ref: "#/components/schemas/GenerationId" }
            - { type: "null" }
        elapsed_ms: { type: integer, minimum: 0 }

    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_seconds: { type: integer, minimum: 60, maximum: 900, description: "Lifetime of the signed URL; default and maximum 900." }

    ExportCreated:
      type: object
      additionalProperties: false
      required: [url, expires_at, created_at, size_bytes, sha256, masking]
      properties:
        url: { type: string, maxLength: 2048, pattern: "^https://", description: "Signed, expiring; the object is not readable without the signature." }
        expires_at: { $ref: "#/components/schemas/UnixMs" }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: "#/components/schemas/Sha256" }
        masking: { const: none, description: "Column masking arrives in F7 (Open 12)." }

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [timestamp, target, name]
      properties:
        timestamp: { $ref: "#/components/schemas/UnixMs" }
        target: { const: new_app, description: "0.3 restores into a new app only (Open 11)." }
        name: { $ref: "#/components/schemas/AppName" }

    RestoreCreated:
      type: object
      additionalProperties: false
      required: [app, deployment, source_app, database, generation, restored_to]
      properties:
        app: { $ref: "#/components/schemas/App" }
        deployment: { $ref: "#/components/schemas/Deployment" }
        source_app: { $ref: "#/components/schemas/AppName" }
        database: { $ref: "#/components/schemas/DatabaseId" }
        generation: { $ref: "#/components/schemas/GenerationId" }
        restored_to:
          anyOf:
            - { $ref: "#/components/schemas/UnixMs" }
            - { type: "null" }

    ImportResult:
      type: object
      additionalProperties: false
      required: [app, database, size_bytes, sha256, tables]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        database: { $ref: "#/components/schemas/DatabaseId" }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: "#/components/schemas/Sha256" }
        tables: { type: array, maxItems: 1000, items: { type: string, pattern: "^[a-z][a-z0-9]*__[a-z0-9_]+$" } }

    OperatorReason: { type: string, minLength: 10, maxLength: 500, description: "Why the operator acts; required on every operator action and kept in the audit row." }

    OperatorId:
      type: string
      pattern: "^(operator|acct_[0-9A-Za-z]{16,32})$"
      description: "0.3.1 (section 2, \"Operator ids\"): `operator` for the bootstrap token, else the operator account's id `acct_<ulid>`; the same form as `move_request.operator` on the node listener. A `usr_` id never appears here."

    OpsReplication:
      type: object
      additionalProperties: false
      description: "0.3.1: the replication of one database of the tenant as its owning node last reported it (node listener `replication_status`, section 15); the full report per app is getBackups."
      required: [database, replication, state, replica, last_sync_at, lag_seconds, reported_at, stale]
      properties:
        database: { $ref: "#/components/schemas/DatabaseId" }
        replication: { enum: [none, litestream] }
        state: { enum: ["off", starting, replicating, stopped] }
        replica:
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { enum: [file, s3] }
                region: { type: string, maxLength: 64 }
        last_sync_at: { type: [integer, "null"], minimum: 0 }
        lag_seconds: { type: [number, "null"], minimum: 0 }
        reported_at: { $ref: "#/components/schemas/UnixMs" }
        stale: { type: boolean, description: "true when the report is older than two heartbeats (section 7)." }

    OpsAction:
      type: object
      additionalProperties: false
      description: "0.3.1: one operator action on the tenant, from its audit row (section 17)."
      required: [audit_id, at, action, operator, reason, result]
      properties:
        audit_id: { type: string, pattern: "^aud_[0-9A-Za-z]{16,32}$" }
        at: { $ref: "#/components/schemas/UnixMs" }
        action: { enum: [setTenantTier, moveTenant, impersonateTenant] }
        operator: { $ref: "#/components/schemas/OperatorId" }
        reason: { $ref: "#/components/schemas/OperatorReason" }
        result: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$", description: "The audit row's result: changed, unchanged, moved, restore_failed, hook_failed; for impersonateTenant (0.4) active or ended." }
        impersonation_id: { $ref: "#/components/schemas/ImpersonationId", description: "0.4: impersonateTenant only." }
        expires_at: { $ref: "#/components/schemas/UnixMs", description: "0.4: impersonateTenant only, the end of the time box." }

    OpsTenant:
      type: object
      additionalProperties: false
      description: "0.3.1 (section 17, \"Read\"): a tenant as the operator console and the observability panel show it. Served from Postgres only."
      required: [tenant_id, name, tier, state, process, node_id, pinned_node, moving, moving_since, microvm_at, replication, actions]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        name: { type: string, minLength: 1, maxLength: 128 }
        tier: { $ref: "#/components/schemas/Tier" }
        state: { enum: [active, suspended] }
        process: { enum: [shared, own] }
        node_id: { oneOf: [{ $ref: "#/components/schemas/NodeId" }, { type: "null" }], description: "The owning node, or null while the tenant has no route entry." }
        pinned_node: { oneOf: [{ $ref: "#/components/schemas/NodeId" }, { type: "null" }], description: "The node a failover or an operator move pinned the tenant to (FO4), or null." }
        moving: { type: boolean, description: "A microVM move is in progress: requests answer 503 RENOX_TENANT_MOVING (section 17)." }
        moving_since: { type: [integer, "null"], minimum: 0 }
        microvm_at: { type: [integer, "null"], minimum: 0, description: "When a microVM move last succeeded (hook exit 0), or null." }
        replication: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/OpsReplication" } }
        actions: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/OpsAction" }, description: "The last five operator actions, newest first." }
        safe_browsing:
          type: array
          maxItems: 64
          description: "0.5 (section 22): the last Safe Browsing check of each hostname of the tenant."
          items:
            type: object
            additionalProperties: false
            required: [hostname, verdict, checked_at]
            properties:
              hostname: { $ref: "#/components/schemas/Hostname" }
              verdict: { enum: [safe, unsafe, unknown] }
              checked_at: { $ref: "#/components/schemas/UnixMs" }
        abuse_tickets: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AbuseTicketId" }, description: "0.5: the tenant's open abuse tickets." }

    SetTierRequest:
      type: object
      additionalProperties: false
      required: [tier, reason]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        reason: { $ref: "#/components/schemas/OperatorReason" }

    MoveRequest:
      type: object
      additionalProperties: false
      required: [target, reason]
      if: { properties: { target: { const: node } } }
      then: { required: [node_id] }
      else: { not: { required: [node_id] } }
      properties:
        target: { enum: [node, microvm] }
        node_id: { $ref: "#/components/schemas/NodeId" }
        reason: { $ref: "#/components/schemas/OperatorReason" }

    OperatorActionResult:
      type: object
      additionalProperties: false
      required: [tenant_id, action, changed, tier, process, node_id, route_version, audit_id]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        action: { enum: [setTenantTier, moveTenant] }
        changed: { type: boolean }
        tier: { $ref: "#/components/schemas/Tier" }
        process: { enum: [shared, own] }
        node_id: { $ref: "#/components/schemas/NodeId" }
        route_version: { type: integer, minimum: 0 }
        audit_id: { type: string, pattern: "^aud_[0-9A-Za-z]{16,32}$" }
        hook_exit_code: { type: integer, minimum: 0, maximum: 255, description: "microvm moves only: the exit code of the node's [process] microvm_hook." }

    TenantDetail:
      type: object
      additionalProperties: false
      description: "0.4 (section 3): the caller's own tenant and its erasure record."
      required: [tenant_id, name, tier, state, created_at, erasure]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        name: { type: string, minLength: 1, maxLength: 128 }
        tier: { $ref: "#/components/schemas/Tier" }
        state: { enum: [active, suspended] }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        erasure: { oneOf: [{ $ref: "#/components/schemas/Erasure" }, { type: "null" }] }

    DeleteTenantRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { $ref: "#/components/schemas/TenantId", description: "Must equal the tenant id of the path (400 otherwise)." }

    Erasure:
      type: object
      additionalProperties: false
      description: "0.4 (section 3, the erasure state machine): `completed_at` is set exactly in `done`, `failure` names the failing step exactly in `failed`."
      required: [state, requested_at, completed_at, failure]
      properties:
        state: { enum: [pending, erasing, done, failed] }
        requested_at: { $ref: "#/components/schemas/UnixMs" }
        completed_at: { type: [integer, "null"], minimum: 0 }
        failure: { oneOf: [{ type: "null" }, { enum: [routes, tokens, node_drop, replica, exports, records] }] }
        replica_purged_at: { type: [integer, "null"], minimum: 0, description: "0.4.1: Unix ms when the owning node confirmed the purge of every replica generation (nodeDropTenant with purge_replica); null until then. Optional so 0.4 records stay valid." }
      if: { properties: { state: { const: done } } }
      then: { properties: { completed_at: { type: integer }, failure: { type: "null" } } }
      else:
        properties: { completed_at: { type: "null" } }
        if: { properties: { state: { const: failed } } }
        then: { properties: { failure: { type: string } } }
        else: { properties: { failure: { type: "null" } } }

    DiskReport:
      type: object
      additionalProperties: false
      description: "0.4 (section 7): the node's data-directory level from its disk watermarks; `watermark` is the percent crossed, null at ok."
      required: [level, free_bytes, watermark]
      properties:
        level: { enum: [ok, warn, critical] }
        free_bytes: { type: integer, minimum: 0 }
        watermark: { type: [integer, "null"], minimum: 1, maximum: 100 }
      if: { properties: { level: { const: ok } } }
      then: { properties: { watermark: { type: "null" } } }
      else: { properties: { watermark: { type: integer } } }

    NodeDetail:
      type: object
      additionalProperties: false
      description: "0.4 (section 7, getNode): a node as Postgres knows it."
      required: [node_id, region, worker_version, healthy, last_heartbeat_at, route_version, cells, max_cells, disk]
      properties:
        node_id: { $ref: "#/components/schemas/NodeId" }
        region: { type: string, minLength: 1, maxLength: 64 }
        worker_version: { type: string, maxLength: 64 }
        healthy: { type: boolean }
        last_heartbeat_at: { type: [integer, "null"], minimum: 0 }
        route_version: { type: integer, minimum: 0 }
        cells: { type: integer, minimum: 0 }
        max_cells: { type: integer, minimum: 1 }
        disk: { oneOf: [{ $ref: "#/components/schemas/DiskReport" }, { type: "null" }], description: "The last heartbeat's report; null when the node never sent one (a worker older than 0.4)." }

    ImpersonationId: { type: string, pattern: "^imp_[0-9A-Za-z]{16,32}$" }

    ImpersonationScope: { enum: ["apps:read", "logs:read", "secrets:read"] }

    ImpersonateRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/OperatorReason" }
        scopes: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { $ref: "#/components/schemas/ImpersonationScope" }, description: "Default: all three. No write scope in 0.4 (Open 15)." }

    Impersonation:
      type: object
      additionalProperties: false
      description: "0.4 (section 17, break-glass): one impersonation; the token is only in the answer that starts it."
      required: [impersonation_id, tenant_id, operator, reason, scopes, started_at, expires_at, ended_at]
      properties:
        impersonation_id: { $ref: "#/components/schemas/ImpersonationId" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        operator: { $ref: "#/components/schemas/OperatorId" }
        reason: { $ref: "#/components/schemas/OperatorReason" }
        scopes: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/ImpersonationScope" } }
        started_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs", description: "started_at + 3,600,000 (the time box)." }
        ended_at: { type: [integer, "null"], minimum: 0 }

    ImpersonationStarted:
      type: object
      additionalProperties: false
      required: [impersonation_id, tenant_id, operator, reason, scopes, started_at, expires_at, ended_at, token]
      properties:
        impersonation_id: { $ref: "#/components/schemas/ImpersonationId" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        operator: { $ref: "#/components/schemas/OperatorId" }
        reason: { $ref: "#/components/schemas/OperatorReason" }
        scopes: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/ImpersonationScope" } }
        started_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }
        ended_at: { type: "null" }
        token: { type: string, pattern: "^renox_pat_[a-z2-7]{32}$", description: "A tenant token bound to the impersonation, returned once; it stops working at expires_at or at endImpersonation." }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
        tenant_id: { $ref: "#/components/schemas/TenantId" }

    SessionState: { enum: [verify, enrol, null], description: "0.4 (section 18): null when the session is complete." }

    LoginResult:
      type: object
      additionalProperties: false
      required: [user_id, email, email_verified, tenant_id, role, session_id, expires_at, csrf, mfa]
      properties:
        user_id: { type: string, pattern: "^usr_[0-9A-Za-z]{16,32}$" }
        email: { type: string }
        email_verified: { type: boolean }
        tenant_id: { oneOf: [{ $ref: "#/components/schemas/TenantId" }, { type: "null" }] }
        role: { enum: [owner, admin, developer, viewer, null] }
        session_id: { type: string, pattern: "^ses_[0-9A-Za-z]{16,32}$" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }
        csrf: { type: string, minLength: 8 }
        mfa: { $ref: "#/components/schemas/SessionState" }

    DeviceStart:
      type: object
      additionalProperties: false
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code: { type: string, minLength: 16, maxLength: 128 }
        user_code: { type: string, pattern: "^[A-Z]{4}-[A-Z]{4}$" }
        verification_uri: { type: string, pattern: "^https?://" }
        expires_in: { type: integer, minimum: 1 }
        interval: { type: integer, minimum: 1 }

    DeviceToken:
      type: object
      additionalProperties: false
      required: [tenant_id, id, name, token, scopes, created_at, expires_at]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        id: { $ref: "#/components/schemas/TokenId" }
        name: { type: string }
        token: { type: string, pattern: "^renox_pat_[a-z2-7]{32}$" }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created_at: { $ref: "#/components/schemas/UnixMs" }
        expires_at: { $ref: "#/components/schemas/UnixMs" }

    MfaStatus:
      type: object
      additionalProperties: false
      required: [totp, passkeys, recovery_left, enrolled, required, grace_until, session_state, verified_at]
      properties:
        totp: { type: boolean }
        passkeys: { type: integer, minimum: 0, description: "The number of registered passkeys." }
        recovery_left: { type: integer, minimum: 0, maximum: 10 }
        enrolled: { type: boolean }
        required: { type: boolean }
        grace_until: { type: [integer, "null"], minimum: 0 }
        session_state: { $ref: "#/components/schemas/SessionState" }
        verified_at: { type: [integer, "null"], minimum: 0, description: "The last verification of this session, or (0.4) of this token." }

    MfaCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9 ]{6,8}$" }

    RecoveryCodes: { type: array, minItems: 10, maxItems: 10, items: { type: string, pattern: "^[a-z0-9]{5}-[a-z0-9]{5}$" } }

    MfaVerifyRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [method, code]
          properties:
            method: { enum: [totp, recovery] }
            code: { type: string, minLength: 6, maxLength: 16 }
        - type: object
          additionalProperties: false
          required: [method, credential_id, client_data, authenticator_data, signature]
          properties:
            method: { const: passkey }
            credential_id: { type: string, minLength: 1 }
            client_data: { type: string, minLength: 1 }
            authenticator_data: { type: string, minLength: 1 }
            signature: { type: string, minLength: 1 }

    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [challenge, rp, user, pubKeyCredParams, excludeCredentials, authenticatorSelection]
      properties:
        challenge: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
        rp: { type: object, additionalProperties: false, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        user: { type: object, additionalProperties: false, required: [id, name, displayName], properties: { id: { type: string }, name: { type: string }, displayName: { type: string } } }
        pubKeyCredParams: { type: array, items: { type: object, additionalProperties: false, required: [type, alg], properties: { type: { const: public-key }, alg: { type: integer } } } }
        excludeCredentials: { type: array, items: { type: object, additionalProperties: false, required: [type, id], properties: { type: { const: public-key }, id: { type: string } } } }
        authenticatorSelection: { type: object, additionalProperties: false, properties: { userVerification: { enum: [preferred, required, discouraged] } } }

    # 0.5 (#319): registry, billing, abuse, AI gateway.
    UserId: { type: string, pattern: "^usr_[0-9A-Za-z]{16,32}$" }
    Semver: { type: string, maxLength: 64, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$" }
    PublisherName: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,38}$" }
    Ed25519PublicKey: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "The 32-byte public key, base64url without padding." }
    KeyId: { type: string, pattern: "^ed25519:[A-Za-z0-9_-]{43}$", description: "manifest.md 1.2 `[publisher].key_id`." }
    Publisher:
      type: object
      additionalProperties: false
      required: [name, tenant_id, keys, created_at]
      properties:
        name: { $ref: "#/components/schemas/PublisherName" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        keys:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [key_id, added_at, revoked_at]
            properties:
              key_id: { $ref: "#/components/schemas/KeyId" }
              added_at: { $ref: "#/components/schemas/UnixMs" }
              revoked_at: { type: [integer, "null"], minimum: 0 }
        created_at: { $ref: "#/components/schemas/UnixMs" }
    ModulePermissions:
      type: object
      additionalProperties: false
      required: [network, secrets, slots, hooks]
      description: "manifest.md section 2 `[permissions]`, the form of a lock entry's `approved`."
      properties:
        tables: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}__\\*$" }
        network: { type: array, maxItems: 64, items: { type: string, maxLength: 253 } }
        secrets: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/SecretName" } }
        slots: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }
        hooks: { type: array, maxItems: 64, items: { type: string, maxLength: 128 } }
        roles: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }
    RegistryModule:
      type: object
      additionalProperties: false
      required: [publisher, name, version, hash, key_id, description, isolation, permissions, migrations, price, published_at, disabled]
      properties:
        publisher: { $ref: "#/components/schemas/PublisherName" }
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
        version: { $ref: "#/components/schemas/Semver" }
        hash: { $ref: "#/components/schemas/Sha256" }
        key_id: { $ref: "#/components/schemas/KeyId" }
        description: { type: [string, "null"], maxLength: 200 }
        isolation: { enum: [shared, isolate] }
        permissions: { $ref: "#/components/schemas/ModulePermissions" }
        migrations: { type: integer, minimum: 0, description: "Number of migration files in the tree" }
        price:
          type: [object, "null"]
          additionalProperties: false
          required: [amount, currency, period]
          properties:
            amount: { type: string, pattern: "^(0|[1-9][0-9]{0,8})(\\.[0-9]{1,2})?$" }
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            period: { enum: [once, month, year] }
        published_at: { $ref: "#/components/schemas/UnixMs" }
        disabled:
          type: [object, "null"]
          additionalProperties: false
          required: [at, reason]
          properties:
            at: { $ref: "#/components/schemas/UnixMs" }
            reason: { type: string, maxLength: 500 }
    PermissionChange:
      type: object
      additionalProperties: false
      required: [network, secrets, slots, hooks, roles]
      properties:
        tables: { type: [string, "null"] }
        network: { type: array, items: { type: string } }
        secrets: { type: array, items: { type: string } }
        slots: { type: array, items: { type: string } }
        hooks: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string } }
    ModuleDiff:
      type: object
      additionalProperties: false
      required: [from, to, permissions, migrations, contract, templates]
      properties:
        from: { $ref: "#/components/schemas/Semver" }
        to: { $ref: "#/components/schemas/Semver" }
        permissions:
          type: object
          additionalProperties: false
          required: [added, removed]
          properties:
            added: { $ref: "#/components/schemas/PermissionChange" }
            removed: { $ref: "#/components/schemas/PermissionChange" }
        migrations: { type: array, maxItems: 500, items: { type: string, pattern: "^[0-9]{3}_[a-z0-9_]{1,64}\\.sql$" }, description: "Migration files in `to` that `from` lacks, in order" }
        contract:
          type: object
          additionalProperties: false
          required: [ops_from, ops_to]
          properties:
            ops_from: { type: [string, "null"], maxLength: 16 }
            ops_to: { type: [string, "null"], maxLength: 16 }
        templates: { type: array, maxItems: 500, items: { type: string, maxLength: 256 }, description: "Template files changed between the versions; an app that overrides one sees the drift (artifact.md V20)" }
    AppModule:
      type: object
      additionalProperties: false
      required: [name, source, version, hash, approved, approved_at, approved_by, disabled]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
        source: { type: string, pattern: "^registry:[a-z0-9][a-z0-9-]{0,38}/[a-z][a-z0-9_]{0,31}$" }
        version: { $ref: "#/components/schemas/Semver" }
        hash: { $ref: "#/components/schemas/Sha256" }
        approved: { $ref: "#/components/schemas/ModulePermissions" }
        approved_at: { $ref: "#/components/schemas/UnixMs" }
        approved_by: { type: [string, "null"], pattern: "^usr_[0-9A-Za-z]{16,32}$" }
        disabled:
          type: [object, "null"]
          additionalProperties: false
          required: [at, reason]
          properties:
            at: { $ref: "#/components/schemas/UnixMs" }
            reason: { type: string, maxLength: 500 }
    PlanId: { enum: [free, starter, pro, agency] }
    TierState: { enum: [active, over_quota, grace, suspended] }
    Quotas:
      type: object
      additionalProperties: false
      required: [requests, cpu_ms, egress_bytes, db_bytes, storage_bytes, ai_tokens, apps, custom_domains]
      description: "Monthly quotas per dimension (section 20); `null` = unlimited within the fair-use limits."
      properties:
        requests: { type: [integer, "null"], minimum: 0 }
        cpu_ms: { type: [integer, "null"], minimum: 0 }
        egress_bytes: { type: [integer, "null"], minimum: 0 }
        db_bytes: { type: [integer, "null"], minimum: 0 }
        storage_bytes: { type: [integer, "null"], minimum: 0 }
        ai_tokens: { type: [integer, "null"], minimum: 0 }
        apps: { type: [integer, "null"], minimum: 1 }
        custom_domains: { type: integer, minimum: 0 }
    Plan:
      type: object
      additionalProperties: false
      required: [id, name, price_month, quotas]
      properties:
        id: { $ref: "#/components/schemas/PlanId" }
        name: { type: string, maxLength: 40 }
        price_month: { type: string, pattern: "^(0|[1-9][0-9]{0,6})\\.[0-9]{2}$", description: "AED, excluding VAT" }
        quotas: { $ref: "#/components/schemas/Quotas" }
    Billing:
      type: object
      additionalProperties: false
      required: [tenant_id, plan, state, period, usage, estimate, signal, payment_method, profile, restrictions]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        plan: { $ref: "#/components/schemas/PlanId" }
        pending_plan: { type: [string, "null"], enum: [free, starter, pro, agency, null], description: "A downgrade that takes effect at the period end" }
        state: { $ref: "#/components/schemas/TierState" }
        state_since: { $ref: "#/components/schemas/UnixMs" }
        period:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: { $ref: "#/components/schemas/UnixMs" }
            end: { $ref: "#/components/schemas/UnixMs" }
        usage:
          type: object
          additionalProperties: false
          required: [requests, cpu_ms, egress_bytes, db_bytes, storage_bytes, ai_tokens]
          description: "This period so far, from meters_hourly (meter.md section 7)."
          properties:
            requests: { type: integer, minimum: 0 }
            cpu_ms: { type: integer, minimum: 0 }
            egress_bytes: { type: integer, minimum: 0 }
            db_bytes: { type: integer, minimum: 0 }
            storage_bytes: { type: integer, minimum: 0 }
            ai_tokens: { type: integer, minimum: 0 }
        estimate:
          type: object
          additionalProperties: false
          required: [subtotal, vat, total, currency]
          properties:
            subtotal: { type: string, pattern: "^(0|[1-9][0-9]{0,8})\\.[0-9]{2}$" }
            vat: { type: string, pattern: "^(0|[1-9][0-9]{0,8})\\.[0-9]{2}$" }
            total: { type: string, pattern: "^(0|[1-9][0-9]{0,8})\\.[0-9]{2}$" }
            currency: { const: AED }
        signal:
          type: object
          additionalProperties: false
          required: [over_quota, anomaly]
          description: "The tier_signal of section 20: the dimensions over quota and an anomaly flag."
          properties:
            over_quota: { type: array, uniqueItems: true, items: { enum: [requests, cpu_ms, egress_bytes, db_bytes, storage_bytes, ai_tokens] } }
            anomaly: { type: boolean }
        payment_method: { oneOf: [{ $ref: "#/components/schemas/PaymentMethod" }, { type: "null" }] }
        profile: { oneOf: [{ $ref: "#/components/schemas/BillingProfile" }, { type: "null" }] }
        restrictions:
          type: array
          uniqueItems: true
          description: "Section 21: the new-tenant limits still in force."
          items: { enum: [reduced_quotas, no_custom_domain] }
    BillingProfile:
      type: object
      additionalProperties: false
      required: [legal_name, email, address, country]
      properties:
        legal_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        trn: { type: string, pattern: "^[0-9]{15}$", description: "UAE Tax Registration Number; printed on the tax invoice when given" }
        address: { type: string, minLength: 1, maxLength: 500 }
        country: { type: string, pattern: "^[A-Z]{2}$" }
    PaymentMethod:
      type: object
      additionalProperties: false
      required: [id, provider, brand, last4, exp_month, exp_year, added_at]
      properties:
        id: { type: string, pattern: "^pm_[A-Za-z0-9]{8,64}$" }
        provider: { enum: [stripe] }
        brand: { type: string, maxLength: 20 }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2000, maximum: 2100 }
        added_at: { $ref: "#/components/schemas/UnixMs" }
    InvoiceId: { type: string, pattern: "^INV-[0-9]{4}-[0-9]{6}$" }
    Invoice:
      type: object
      additionalProperties: false
      required: [id, tenant_id, period, status, lines, subtotal, vat, total, currency, seller_trn, buyer_trn, issued_at, paid_at]
      properties:
        id: { $ref: "#/components/schemas/InvoiceId" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        period:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: { $ref: "#/components/schemas/UnixMs" }
            end: { $ref: "#/components/schemas/UnixMs" }
        status: { enum: [open, paid, failed, void] }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unit_price, amount]
            properties:
              description: { type: string, maxLength: 200 }
              quantity: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,6})?$" }
              unit_price: { type: string, pattern: "^[0-9]+\\.[0-9]{2,6}$" }
              amount: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        subtotal: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        vat: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$", description: "5 % of the subtotal, rounded half up to fils" }
        total: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        currency: { const: AED }
        seller_trn: { type: string, pattern: "^[0-9]{15}$" }
        buyer_trn: { type: [string, "null"], pattern: "^[0-9]{15}$" }
        issued_at: { $ref: "#/components/schemas/UnixMs" }
        paid_at: { type: [integer, "null"], minimum: 0 }
    AbuseCategory: { enum: [phishing, malware, spam, csam, copyright, other] }
    AbuseState: { enum: [open, reviewing, taken_down, dismissed, restored] }
    AbuseTicketId: { type: string, pattern: "^abt_[0-9A-Za-z]{16,32}$" }
    AbuseTicket:
      type: object
      additionalProperties: false
      required: [id, hostname, tenant_id, category, state, safe_browsing, reported_at, updated_at, reason]
      properties:
        id: { $ref: "#/components/schemas/AbuseTicketId" }
        hostname: { $ref: "#/components/schemas/Hostname" }
        tenant_id: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9_-]{0,62}$", description: "null when the hostname is not a Renox host" }
        category: { $ref: "#/components/schemas/AbuseCategory" }
        state: { $ref: "#/components/schemas/AbuseState" }
        safe_browsing: { enum: [safe, unsafe, unknown] }
        reported_at: { $ref: "#/components/schemas/UnixMs" }
        updated_at: { $ref: "#/components/schemas/UnixMs" }
        reason: { type: [string, "null"], maxLength: 500 }
    AiMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { enum: [user, assistant] }
        content:
          oneOf:
            - { type: string, maxLength: 200000 }
            - { type: array, maxItems: 100, items: { type: object } }
    AiChatRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, app, request_id, model, messages, max_tokens]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        app: { $ref: "#/components/schemas/AppName" }
