  responses:
    Validation:
      description: The request body, a parameter, or a header is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            secret:
              value:
                error:
                  code: RENOX_VALIDATION
                  message: The request is not valid.
                  request_id: 01JBQ3Z7MA0000000000000010
                  details: [{ field: value, reason: "secret values are at least 8 bytes" }]
    Unauthenticated:
      description: No token, an unknown, expired, or revoked token, or a token of the wrong kind.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: 'Bearer realm="renox"'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missing: { value: { error: { code: RENOX_UNAUTHENTICATED, message: Authentication is required., request_id: 01JBQ3Z7MA0000000000000011 } } }
    TokenScope:
      description: The token is valid but lacks the operation's scope, or a node token names another node.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            scope: { value: { error: { code: RENOX_TOKEN_SCOPE, message: The token does not allow this action., request_id: 01JBQ3Z7MA0000000000000012 } } }
    StepUp:
      description: "A wrong scope, or (section 18) a stepped-up operation without a verification in the last 15 minutes."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            step-up:
              value:
                error:
                  code: RENOX_TOKEN_SCOPE
                  message: The token does not allow this action.
                  request_id: 01JBQ3Z7MA0000000000000042
                  details: [{ field: mfa, reason: step_up_required }]
    NotFound:
      description: No such resource in the caller's tenant. Another tenant's resources are also 404, never 403.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            app: { value: { error: { code: RENOX_NOT_FOUND, message: Not found., request_id: 01JBQ3Z7MA0000000000000013 } } }
    Conflict:
      description: The state machine does not allow the transition, the name is taken, or another activation of the app is in progress.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            state: { value: { error: { code: RENOX_CONFLICT, message: The request conflicts with the current state., request_id: 01JBQ3Z7MA0000000000000014, details: [{ field: state, reason: "rejected -> activating is not allowed" }] } } }
    BodyTooLarge:
      description: The body is over the operation's limit (deploy-api.md section 4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            upload: { value: { error: { code: RENOX_BODY_TOO_LARGE, message: The request body is too large., request_id: 01JBQ3Z7MA0000000000000015 } } }
    RateLimited:
      description: The token's bucket is empty. `Retry-After` says when to retry.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 5
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            bucket: { value: { error: { code: RENOX_RATE_LIMITED, message: Too many requests. Try again later., request_id: 01JBQ3Z7MA0000000000000016 } } }
    Unavailable:
      description: No healthy worker can take the tenant, or a dependency is down.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 5
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            no-worker: { value: { error: { code: RENOX_UNAVAILABLE, message: The service is temporarily unavailable., request_id: 01JBQ3Z7MA0000000000000017 } } }
    BackupUnavailable:
      description: Replication is off for the database, the replica or the owning node is unreachable, or no generation exists yet. `Retry-After` in seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 30
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            replication-off: { value: { error: { code: RENOX_BACKUP_UNAVAILABLE, message: No backup is available for this database right now., request_id: 01JBQ3Z7MA0000000000000020, details: [{ field: replication, reason: none }] } } }
    RestorePointUnknown:
      description: No generation covers `timestamp` (in the future, before the oldest generation, outside retention, or in a gap between generations).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            too-old: { value: { error: { code: RENOX_RESTORE_POINT_UNKNOWN, message: No backup covers the requested time., request_id: 01JBQ3Z7MA0000000000000021, details: [{ field: timestamp, reason: "oldest restore point is 1793232000000" }] } } }
    ImportRejected:
      description: The app is not a staging app, or the file is not a SQLite database, fails `PRAGMA quick_check`, or has a name the authorizer would refuse.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            production: { value: { error: { code: RENOX_IMPORT_REJECTED, message: The database file cannot be imported., request_id: 01JBQ3Z7MA0000000000000022, details: [{ field: app, reason: "not a staging app" }] } } }
            table: { value: { error: { code: RENOX_IMPORT_REJECTED, message: The database file cannot be imported., request_id: 01JBQ3Z7MA0000000000000023, details: [{ field: table, reason: "notes has no <module>__ prefix" }] } } }
    TenantMoving:
      description: The tenant is being moved (an operator move to a microVM is in progress). `Retry-After` in seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 30
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            moving: { value: { error: { code: RENOX_TENANT_MOVING, message: The service is being moved. Try again shortly., request_id: 01JBQ3Z7MA0000000000000024 } } }
