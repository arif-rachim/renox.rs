# Renox deploy API, contract version 0.5 (F7).
# Prose: docs/contracts/deploy-api.md. Checked by `bun run docs/contracts/validate.ts`:
#   - every operation has request and response examples, and every JSON
#     example validates against its schema (the JSON Schema subset of validate.ts);
#   - x-renox-invalid-examples must fail, for the reason in x-expect;
#   - SSE examples: each `data:` line validates against x-renox-events[<event>];
#   - x-renox-state-machines equals the transition tables of deploy-api.md;
#   - every RENOX_* code used here has a row in errors.md.
# Schemas use only JSON Schema 2020-12 keywords (OpenAPI 3.1), no OpenAPI-only
# keywords, so the same subset checker validates them.
openapi: 3.1.0
info:
  title: Renox deploy API
  version: 0.5.1
  description: >-
    The control plane's HTTP API for tenant developers (CLI, dashboard, MCP),
    for worker nodes, and for operators. See docs/contracts/deploy-api.md.
  license:
    name: Proprietary
    identifier: LicenseRef-Renox-Proprietary
servers:
  - url: https://api.renox.app
    description: Production (UAE region)
  - url: http://localhost:8787
    description: Local compose stack (control/docker-compose.yml)
tags:
  - name: health
    description: "Liveness of the API"
  - name: apps
    description: "Apps of the caller's tenant"
  - name: deployments
    description: "Upload, validation, activation, rollback (sections 3-6)"
  - name: secrets
    description: "Secret names and values (section 9)"
  - name: logs
    description: "Tenant log stream"
  - name: client-errors
    description: "Browser error groups, their events and status (section 11.1)"
  - name: usage
    description: "Metered usage and the quota signal (section 11)"
  - name: domains
    description: "Custom domains (section 10)"
  - name: tokens
    description: "Tenant tokens (section 2)"
  - name: nodes
    description: "Worker registration, route table, activation, bundles (sections 7-10)"
  - name: ingest
    description: "Meter and log ingestion from nodes"
  - name: admin
    description: "Operator endpoints"
  - name: backups
    description: "Replication status, export, point-in-time restore, import (section 14, 0.3)"
  - name: ops
    description: "Operator actions on tenants: tier, move (section 17, 0.3); the node read (section 7) and break-glass impersonation (section 17, 0.4)"
  - name: tenants
    description: "The caller's own tenant and its erasure (section 3, 0.4)"
  - name: account
    description: "Sign-in, the device flow, second factors (section 18, 0.4)"
  - name: registry
    description: "Publishers, module versions, the upgrade diff, app approvals (section 19, 0.5)"
  - name: billing
    description: "Plans in AED, the billing state, payment methods, invoices, the PSP's webhooks (section 20, 0.5)"
  - name: onboarding
    description: "Sign-up, email verification, the first app from a template (section 21, 0.5)"
  - name: abuse
    description: "The public abuse report (section 22, 0.5); the operator side is tagged ops"
  - name: ai
    description: "The AI gateway for cells (section 23, 0.5)"

x-renox-state-machines:
  deployment:
    initial: [uploaded]
    transitions:
      uploaded: [validated, rejected]
      rejected: [uploaded]
      validated: [activating, pruned]
      activating: [active, validated]
      active: [superseded, suspended]
      superseded: [active, pruned]
      suspended: [active]
      pruned: [uploaded]
  domain:
    initial: [pending]
    transitions:
      pending: [verified, released]
      verified: [detached]
      detached: [verified, released]
      released: []
  erasure:
    initial: [pending]
    transitions:
      pending: [erasing]
      erasing: [done, failed]
      done: []
      failed: [erasing]
  tier:
    initial: [active]
    transitions:
      active: [over_quota, suspended]
      over_quota: [active, grace]
      grace: [active, suspended]
      suspended: [active]
  abuse:
    initial: [open]
    transitions:
      open: [reviewing, taken_down, dismissed]
      reviewing: [taken_down, dismissed]
      taken_down: [restored]
      dismissed: [reviewing]
      restored: [reviewing]

security:
  - tenantToken: []

paths:
  /v1/healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness and dependency check
      security: []
      responses:
        "200":
          description: The API process is up and Postgres and object storage answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                ok: { value: { status: ok, postgres: ok, object_storage: ok } }
        "503":
          description: A dependency does not answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                degraded: { value: { status: degraded, postgres: ok, object_storage: unreachable } }

  /v1/apps:
    post:
      operationId: createApp
      tags: [apps]
      summary: Create an app in the caller's tenant
      x-renox-scope: apps:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAppRequest" }
            examples:
              hello: { value: { name: hello } }
              staging: { value: { name: hello-staging, staging: true } }
            x-renox-invalid-examples:
              uppercase: { value: { name: Hello }, x-expect: pattern }
              too-long: { value: { name: "a234567890123456789012345678901234567890123456789012" }, x-expect: pattern }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
              examples:
                created: { $ref: "#/components/examples/AppNew" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: listApps
      tags: [apps]
      summary: List the caller's apps
      x-renox-scope: apps:read
      responses:
        "200":
          description: The tenant's apps, by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [apps]
                properties:
                  apps: { type: array, items: { $ref: "#/components/schemas/App" } }
              examples:
                two:
                  value:
                    apps:
                      - { name: hello, tenant_id: t_hello, created_at: 1793318300000, active_deployment: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", hostnames: [hello.renox.app] }
                      - { name: notes, tenant_id: t_hello, created_at: 1793318300500, active_deployment: null, hostnames: [notes.renox.app] }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/apps/{app}:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: getApp
      tags: [apps]
      summary: One app with its active deployment
      x-renox-scope: apps:read
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
              examples:
                live: { $ref: "#/components/examples/AppLive" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/apps/{app}/deployments:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: uploadDeployment
      tags: [deployments]
      summary: Upload an artifact; validate and store it
      description: >-
        The body is the artifact tree (artifact.md section 1) as a POSIX tar,
        optionally gzip-compressed, entries relative to the artifact root.
        The control plane recomputes the content hash, applies the upload caps
        (section 4) and rules V1-V16 with the shared validation package, stores
        the bytes under artifacts/<hash>.tar (never overwritten) and records the
        deployment. Uploading a hash that already has a non-rejected deployment
        in this app is idempotent and returns 200 with the existing record.
      x-renox-scope: deploy
      parameters:
        - name: x-renox-artifact-hash
          in: header
          required: true
          description: The hash the client computed (artifact.md section 2). A mismatch is rule V2.
          schema: { $ref: "#/components/schemas/Sha256" }
          example: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a"
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary, maxLength: 104857600 }
            examples:
              hello: { summary: "The examples/hello artifact as a tar", value: "<tar of docs/contracts/examples/hello-artifact/8029...d7a/>" }
          application/gzip:
            schema: { type: string, format: binary }
            examples:
              hello: { summary: "The same tar, gzip-compressed", value: "<gzip of the tar above>" }
      responses:
        "201":
          description: New deployment, state validated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
              examples:
                validated: { $ref: "#/components/examples/DeploymentValidated" }
        "200":
          description: The same hash was uploaded before; the existing record is returned unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
              examples:
                again: { $ref: "#/components/examples/DeploymentValidated" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: >-
            Validation failed; the deployment is recorded in state rejected. details lists
            every violation found (V1-V16, H1, H2), at most 50, or the one T1-T8 violation
            that stopped extraction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                route-conflict:
                  value:
                    error:
                      code: RENOX_DEPLOY_REJECTED
                      message: The artifact failed validation.
                      request_id: 01JBQ3Z7MA0000000000000002
                      deployment: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                      details:
                        - { rule: V8, field: "routes[1]", reason: "GET /api/notes/:slug conflicts with routes[0]" }
                path-escape:
                  value:
                    error:
                      code: RENOX_DEPLOY_REJECTED
                      message: The artifact failed validation.
                      request_id: 01JBQ3Z7MA0000000000000003
                      deployment: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                      details:
                        - { rule: T4, path: "code/../../etc/passwd", reason: "path escapes the artifact root" }
                bundle-hygiene:
                  value:
                    error:
                      code: RENOX_DEPLOY_REJECTED
                      message: The artifact failed validation.
                      request_id: 01JBQ3Z7MA0000000000000004
                      deployment: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                      details:
                        - { rule: H1, path: "public/.env", reason: "an environment file (.env)" }
                        - { rule: H2, path: "public/app.js", reason: "line 3: Stripe live secret key (sk_live_… (32 chars)); store it with the secrets API instead" }
              x-renox-invalid-examples:
                unknown-hygiene-rule:
                  x-expect: no branch matches
                  value:
                    error:
                      code: RENOX_DEPLOY_REJECTED
                      message: The artifact failed validation.
                      request_id: 01JBQ3Z7MA0000000000000005
                      details:
                        - { rule: H3, path: "code/app.js", reason: "a rule that does not exist" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: Deployments of an app, newest first
      x-renox-scope: apps:read
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DeploymentState" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of deployments.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deployments]
                properties:
                  deployments: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
              examples:
                one:
                  value:
                    deployments:
                      - { app: hello, hash: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6", state: active, created_at: 1793318450000, updated_at: 1793318500000, size_bytes: 2048, permissions: { network: ["api.stripe.com"], secrets: [STRIPE_KEY] }, secrets_version: 2, activated_at: 1793318500000, last_error: null, violations: null }
                      - { app: hello, hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", state: superseded, created_at: 1793318350000, updated_at: 1793318500000, size_bytes: 512, permissions: { network: [], secrets: [] }, secrets_version: 0, activated_at: 1793318360000, last_error: null, violations: null }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/apps/{app}/deployments/{hash}:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: One deployment and its state
      x-renox-scope: apps:read
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
              examples:
                active: { $ref: "#/components/examples/DeploymentActive" }
                failed-activation: { $ref: "#/components/examples/DeploymentActivationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/apps/{app}/deployments/{hash}/sourcemaps:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: putSourcemaps
      tags: [deployments]
      summary: Upload private sourcemaps for a deployment (#128)
      description: >-
        A tar (optionally gzip) of `*.map` files from `.renox/sourcemaps/<hash>/`.
        Stored under the private prefix sourcemaps/<tenant_id>/<hash>.tar, never part
        of the artifact and never served from the app's origin. Replaces an earlier upload.
      x-renox-scope: deploy
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary, maxLength: 52428800 }
            examples:
              maps: { value: "<tar of functions/api/hello.js.map>" }
      responses:
        "204": { description: Stored. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: The tar holds something other than `.map` files, or breaks a T rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not-a-map:
                  value:
                    error:
                      code: RENOX_VALIDATION
                      message: The request is not valid.
                      request_id: 01JBQ3Z7MA0000000000000004
                      details: [{ field: "functions/api/hello.js", reason: "only .map files are accepted" }]

  /v1/apps/{app}/activate:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: activateDeployment
      tags: [deployments]
      summary: Activate a validated deployment (deploy-api.md section 6)
      description: >-
        Synchronous. validated -> activating; the owning worker is sent `prepare`
        (fetch, migrations, cell creation, probe); on success the pointer moves,
        the previous active deployment becomes superseded, the secret version is
        pinned and a route_delta is published. On failure the deployment returns
        to validated with last_error and the old deployment keeps serving.
      x-renox-scope: deploy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateRequest" }
            examples:
              hash: { value: { hash: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6" } }
            x-renox-invalid-examples:
              short-hash: { value: { hash: "2b91fc05" }, x-expect: pattern }
      responses:
        "200":
          description: Active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
              examples:
                active: { $ref: "#/components/examples/DeploymentActive" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The worker reported a failure; nothing switched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                migration:
                  value:
                    error:
                      code: RENOX_ACTIVATION_FAILED
                      message: The deployment could not be activated.
                      request_id: 01JBQ3Z7MA0000000000000005
                      deployment: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                      details:
                        - { stage: migrate, reason: migration failed, module: app, file: app/003_backfill.sql, sqlite_error: "no such column: tag" }
                probe:
                  value:
                    error:
                      code: RENOX_ACTIVATION_FAILED
                      message: The deployment could not be activated.
                      request_id: 01JBQ3Z7MA0000000000000006
                      deployment: "2b91fc0592294b5d6d0c56500b8c5b38af26ed6c9f75198c497c2f529cdbd8f6"
                      details:
                        - { stage: probe, reason: "GET /api/hello answered 500", http_status: 500 }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/apps/{app}/rollback:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: rollbackDeployment
      tags: [deployments]
      summary: Move the pointer back to a superseded deployment
      description: >-
        A pointer switch: no upload, no validation, no migrations, no probe.
        Without `hash`, the most recently superseded deployment is used.
        The secret version is re-pinned to the app's latest.
      x-renox-scope: deploy
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
            examples:
              previous: { value: {} }
              explicit: { value: { hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a" } }
            x-renox-invalid-examples:
              extra: { value: { hash: "802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a", migrate: true }, x-expect: additionalProperties }
      responses:
        "200":
          description: The target is active again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
              examples:
                back: { $ref: "#/components/examples/DeploymentRolledBack" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/apps/{app}/logs:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: streamLogs
      tags: [logs]
      summary: Tenant log lines as Server-Sent Events
      description: >-
        Returns lines newer than `since` (default: the last 100 lines), then, with
        follow=true, keeps the stream open and sends new lines as they arrive. A
        comment line `: keep-alive` is sent every 15 s. Lines were redacted on the node. A line with
        `source: client` carries `fields.fingerprint`, the error group of GET /client-errors/{fingerprint}
        (deploy-api.md section 11.1). A server line whose `fields.stack` holds a stack also carries
        `fields.frames` (0.3.1, section 11): at most 50 frames of `{ file, line, column, function, original }`,
        `original` from the deployment's private sourcemaps or null.
      x-renox-scope: logs:read
      parameters:
        - name: follow
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: since
          in: query
          required: false
          description: Unix time in milliseconds.
          schema: { type: integer, minimum: 0 }
        - name: source
          in: query
          required: false
          schema: { enum: [all, server, client], default: all }
        - name: deployment
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sha256" }
      responses:
        "200":
          description: An event stream; each `log` event's data is one log line.
          content:
            text/event-stream:
              schema: { type: string }
              x-renox-events:
                log: { $ref: "control-messages.schema.json#/$defs/log_line" }
              examples:
                two-lines:
                  value: "event: log\nid: 1793318400200-0\ndata: {\"ts\":1793318400200,\"tenant_id\":\"t_hello\",\"deployment_hash\":\"802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a\",\"request_id\":\"01JBQ3Z7M8K5V6W9X2Y4A1B3C5\",\"module\":\"functions/api/hello\",\"level\":\"info\",\"message\":\"hello key=[redacted]\",\"fields\":null,\"source\":\"server\"}\n\n: keep-alive\n\n"
                frames:
                  value: "event: log\nid: 1793318400300-0\ndata: {\"ts\":1793318400300,\"tenant_id\":\"t_hello\",\"deployment_hash\":\"802957869194e4c16e462dfcb50bfa6b3e435fca606b96a1223e2b7e21271d7a\",\"request_id\":\"01JBQ3Z7M8K5V6W9X2Y4A1B3C6\",\"module\":\"functions/api/orders\",\"level\":\"error\",\"message\":\"handler threw\",\"fields\":{\"code\":\"RENOX_INTERNAL\",\"route\":\"POST /api/orders\",\"stack\":\"TypeError: x is not a function\\n    at POST (functions/api/orders.js:1:412)\",\"frames\":[{\"file\":\"functions/api/orders.js\",\"line\":1,\"column\":412,\"function\":\"POST\",\"original\":{\"file\":\"functions/api/orders.ts\",\"line\":18,\"column\":9}}]},\"source\":\"server\"}\n\n"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/apps/{app}/client-errors:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listClientErrors
      tags: [client-errors]
      summary: Browser error groups of an app, most recently seen first
      description: >-
        One group per fingerprint (deploy-api.md section 11.1). `since` keeps groups whose
        `last_seen` is at or after it; `deployment` keeps groups with at least one event on
        that deployment. `top_frame` is symbolicated when a sourcemap of the event's
        deployment matched, else `original` is null.
      x-renox-scope: logs:read
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ClientErrorStatus" }
        - name: since
          in: query
          required: false
          description: Unix time in milliseconds.
          schema: { type: integer, minimum: 0 }
        - name: deployment
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sha256" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: A page of error groups.
          content:
            application/json:
