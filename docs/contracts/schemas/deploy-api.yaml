  /v1/apps/{app}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/SecretName"
    put:
      operationId: putSecret
      tags: [secrets]
      summary: Set or rotate a secret; creates a new secret-set version
      x-renox-scope: secrets:write
      requestBody:
        required: true
        content:
