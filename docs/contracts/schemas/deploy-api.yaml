  /v1/registry/disable:
    post:
      operationId: disableModuleVersion
      tags: [ops]
      summary: Disable a module version everywhere by its tree hash (section 19; operator)
      description: >-
        Refuses new installs and downloads of the hash, marks every app that has it installed,
        and emails each owner. Deployed artifacts keep running: a disable is not a takedown of a
        tenant (section 22 is). Undone by the same call with `enabled: true`.
      security:
        - operatorToken: []
      x-renox-operator-scope: ops:write
      x-renox-audit: disableModuleVersion (operator, hash, reason, tenants notified)
      x-renox-errors: [RENOX_VALIDATION, RENOX_UNAUTHENTICATED, RENOX_TOKEN_SCOPE, RENOX_NOT_FOUND]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hash, reason]
              properties:
                hash: { $ref: "#/components/schemas/Sha256" }
                reason: { type: string, minLength: 10, maxLength: 500 }
                enabled: { type: boolean, default: false }
            examples:
              malware: { value: { hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, reason: "GHSA-xxxx: exfiltrates TRNs to a third-party host" } }
            x-renox-invalid-examples:
              short: { value: { hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, reason: bad }, x-expect: minLength }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [hash, disabled_at, tenants_notified]
                properties:
                  hash: { $ref: "#/components/schemas/Sha256" }
                  disabled_at: { type: [integer, "null"], minimum: 0, description: "Unix ms; null after `enabled: true`" }
                  tenants_notified: { type: integer, minimum: 0 }
              examples:
                malware: { value: { hash: 3f1d6c2b9a8e7f5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4, disabled_at: 1793318400000, tenants_notified: 3 } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TokenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/apps/{app}/modules:
    parameters:
