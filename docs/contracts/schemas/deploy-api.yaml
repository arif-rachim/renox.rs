              extra: { value: { value: "sk_test_exampleexample", echo: true }, x-expect: additionalProperties }
      responses:
        "200":
          description: Stored encrypted. The response never contains the value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretWritten" }
