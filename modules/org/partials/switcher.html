<span class="renox-org-switcher" r-if="org_switcher">
  <form method="post" :action="org_switcher.action" r-if="org_switcher.has_orgs">
    <x-csrf />
    <input type="hidden" name="next" :value="org_switcher.next">
    <select name="org" aria-label="Organisation">
      <option r-for="o in org_switcher.orgs" :value="o.id" :selected="o.current">{{ o.name }} · {{ o.role }}</option>
    </select>
    <button type="submit">Switch</button>
    <a r-if="org_switcher.can_manage" :href="org_switcher.members_url">Members</a>
  </form>
  <a r-else :href="org_switcher.base">Create an organisation</a>
</span>
