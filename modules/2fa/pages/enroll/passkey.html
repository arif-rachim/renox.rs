<r-layout use="twofa">
  <r-group slot="title"><r-t key="twofa.passkeys.add" /></r-group>
  <h1><r-t key="twofa.passkeys.add" /></h1>
  <p class="error" id="error" r-if="error">{{ error }}</p>
  <x-form action="default" id="passkey-form" :data-options="options">
    <label><r-t key="twofa.passkeys.name" /> <input type="text" name="name" maxlength="60"></label>
    <input type="hidden" name="client_data">
    <input type="hidden" name="attestation_object">
    <button type="button" id="passkey-go"><r-t key="twofa.passkeys.create" /></button>
  </x-form>
  <script>
    (() => {
      const form = document.getElementById("passkey-form");
      const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=")), (c) => c.charCodeAt(0));
      const enc = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      document.getElementById("passkey-go").addEventListener("click", async () => {
        const o = JSON.parse(form.dataset.options);
        const cred = await navigator.credentials.create({ publicKey: { ...o, challenge: b64(o.challenge), user: { ...o.user, id: b64(o.user.id) }, excludeCredentials: o.excludeCredentials.map((c) => ({ ...c, id: b64(c.id) })) } });
        form.client_data.value = enc(cred.response.clientDataJSON);
        form.attestation_object.value = enc(cred.response.attestationObject);
        form.submit();
      });
    })();
  </script>
</r-layout>
