<r-layout use="notifications">
  <r-group slot="title"><r-t key="notifications.prefs.title" /></r-group>
  <h1><r-t key="notifications.prefs.title" /></h1>
  <p class="notice" r-if="notice">{{ notice }}</p>
  <ul id="prefs">
    <li r-for="p in prefs">
      <code>{{ p.category }}</code> · <r-t key="notifications.channel" :channel="p.channel" /> ·
      <r-group r-if="p.enabled"><r-t key="notifications.prefs.on" /></r-group><r-group r-else><r-t key="notifications.prefs.off" /></r-group>
      <x-form action="set">
        <input type="hidden" name="category" :value="p.category">
        <input type="hidden" name="channel" :value="p.channel">
        <input type="hidden" name="enabled" :value="p.toggle">
        <button type="submit"><r-group r-if="p.enabled"><r-t key="notifications.prefs.turn_off" /></r-group><r-group r-else><r-t key="notifications.prefs.turn_on" /></r-group></button>
      </x-form>
    </li>
    <li r-empty="prefs"><r-t key="notifications.prefs.none" /></li>
  </ul>
  <p><a :href="back_url"><r-t key="notifications.prefs.back" /></a></p>
</r-layout>
