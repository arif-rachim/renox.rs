[module]
name = "otpbox"
version = "1.0.0"
description = "Test fixture: records auth.send_otp codes (for whatsapp), extends auth.principal, lists agent orgs (for org), halts auth.after_login for chosen users"

[exports.services]
addOrg = "Give a user an organisation an agent may act in: (user_id, org_id, name) -> true (#590)"
removeOrg = "Take it away: (user_id, org_id) -> true"

[permissions]
tables = "otpbox__*"
hooks = ["auth.send_otp", "auth.principal", "auth.agent_orgs", "auth.after_login"]
