<r-layout use="auth">
  <r-group slot="title">Sign in</r-group>
  <h1>Sign in</h1>
  <p class="error" id="error" r-if="error">{{ error }}</p>
  <x-form action="default">
    <input type="hidden" name="next" :value="next">
    <label>Email <input type="email" name="email" autocomplete="username" :value="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </x-form>
  <ul class="providers" r-if="providers | length > 0">
    <li r-for="p in providers"><a :href="p.href">Continue with {{ p.label }}</a></li>
  </ul>
  <p><a href="register">Create an account</a></p>
</r-layout>
