[module]
name = "email"
version = "1.0.0"
description = "Transactional email: Resend or Amazon SES, queued through the outbox with retries, a suppression list fed by bounces and complaints"

[config]
provider = { type = "enum", values = ["resend", "ses"], default = "resend", description = "The sending provider" }
from = { type = "string", default = "", max_length = 254, description = "The From address, on a domain verified with the provider" }
ses_region = { type = "string", default = "me-central-1", max_length = 30, description = "The SES region (provider = ses)" }
sends_per_minute = { type = "int", default = 120, min = 1, max = 6000, description = "Outgoing messages per minute for the tenant; past it, send rejects" }

[permissions]
tables = "email__*"
network = ["api.resend.com", "email.me-central-1.amazonaws.com", "email.eu-west-1.amazonaws.com", "email.us-east-1.amazonaws.com"]
secrets = ["EMAIL_RESEND_KEY", "EMAIL_SES_ACCESS_KEY", "EMAIL_SES_SECRET_KEY", "EMAIL_WEBHOOK_SECRET"]
hooks = ["notifications.deliver"]

[exports.services]
send = "Queue a message: ({ to, subject, text?, html? }) -> { id }; refused for a suppressed address; sent by the outbox, retried on a 5xx"
status = "A queued message's state: (id) -> { status, attempts, error } | null"
suppress = "Stop sending to an address: (address, reason) -> { ok }"
unsuppress = "Allow an address again: (address) -> { ok }"
suppressed = "Whether an address is suppressed: (address) -> boolean"

[exports.events."email.send_requested"]
payload = { type = "object", required = ["message_id"], additionalProperties = false, properties = { message_id = { type = "string" } } }
description = "A message was queued; the module's own handler sends it (a 5xx is retried by the outbox)"
