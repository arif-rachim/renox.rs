[module]
name = "storage"
version = "1.0.0"
description = "Uploads through ctx.storage: per-owner folders and quotas, the SVG sanitiser, signed links, a file browser and the x-upload partial"

[dependencies]
auth = "^1.0"
i18n = "^1.0"

[config]
max_upload_bytes = { type = "int", default = 10485760, min = 1, max = 104857600, description = "Largest file an upload accepts (the tier's limit still applies)" }
allow_svg = { type = "bool", default = false, description = "Accept SVG uploads, sanitised (scripts, event handlers, foreign objects and external references removed)" }
quota_mb = { type = "int", default = 0, min = 0, max = 102400, description = "Megabytes each owner may store (0: no per-owner quota; the tier's tenant quota still applies)" }
base_path = { type = "string", default = "/files", max_length = 100, description = "Where the app mounts the file browser" }

[permissions]
slots = ["admin.sidebar"]

[storage]
allowed_types = ["image/jpeg", "image/png", "image/webp", "image/avif", "image/gif", "application/pdf", "text/plain", "text/csv", "image/svg+xml"]

[imports]
services = ["auth.loginUrl", "i18n.detectLocale"]

[exports.services]
upload = "Store a file for an owner within its quota: (owner, name, bytes, content_type, { public? }) -> StoredFile; SVG only sanitised and when allow_svg"
quota = "What an owner stores against quota_mb: (owner) -> { used_bytes, limit_bytes, files }"
list = "An owner's files: (owner, { limit?, cursor? }) -> StoragePage"
remove = "Delete one of an owner's files: (owner, name) -> boolean"
link = "A signed link to one of an owner's files: (owner, name, ttl_seconds) -> { url, expires_at }"
sanitizeSvg = "The SVG with scripts, event handlers, foreign objects and external references removed, or null when it is not an SVG"

[authz]
actions = ["storage.manage"]
sensitive = ["storage.manage"]

[authz.default_roles]
admin = ["storage.manage"]

# The back office's sidebar (#335): a link to this module's page.
[[slots]]
name = "admin.sidebar"
template = "partials/admin-link.html"
requires = "storage.manage"
