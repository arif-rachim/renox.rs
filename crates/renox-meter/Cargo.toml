[package]
name = "renox-meter"
version = "0.0.0"
description = "Per-invocation meter records, batching, and sinks (docs/contracts/meter.md v0)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Leaf crate: no renox-* dependencies, no V8 (AGENTS.md, compile discipline).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "io-std", "io-util"] }
tracing = "0.1"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }
