[package]
name = "renox-cell"
version = "0.0.0"
description = "Renox cell: wires gateway, runtime, data, and meter into the renox-worker binary (P5)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The only crate that depends on the others; nothing depends on it
# (docs/03-architecture.md, workspace dependencies).
[dependencies]
renox-data = { path = "../renox-data" }
renox-gateway = { path = "../renox-gateway" }
renox-meter = { path = "../renox-meter" }
renox-runtime = { path = "../renox-runtime" }
# Page rendering off the isolate thread (#40), and the compiler behind
# `renox-worker transpile` for the CLI (#43).
renox-template = { path = "../renox-template" }

axum = { version = "0.8.9", default-features = false }
# Page sessions and CSRF (#41): HKDF per tenant, HMAC-signed cookies,
# constant-time comparison, form field lookup.
base64 = "0.22"
form_urlencoded = "1"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
subtle = "2.6"
bytes = "1"
http = "1"
http-body-util = "0.1"
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: loader data parsed exactly as V8 printed it (B9, #40).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# malloc_trim after evictions (src/alloc.rs, #144).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
# tests/pages.rs compiles the page templates of its test artifact.
renox-template = { path = "../renox-template" }
