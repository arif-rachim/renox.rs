[package]
name = "renox-cell"
# The worker's version: `renox-worker --version` and `worker_version` at
# registration (#401). A `worker-v<version>` tag must match it, or
# .github/workflows/release-worker.yml fails before building.
version = "0.7.0"
description = "Renox cell: wires gateway, runtime, data, and meter into the renox-worker binary (P5)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `CellManager::set_idle_timeout_for_tests`: tests force idle eviction
# instead of racing a short idle timeout (#182). Enabled for this crate's own
# tests below.
test-support = []
# The release binary carries everything (#372). A lean worker leaves one or
# more of these out; what it answers instead is in src/images/mod.rs and
# renox-runtime's src/ops/pdf.rs. Sizes per feature:
# bench/results/2026-11-01-B20-binary-size-bloat-renox-worker.md.
default = ["media", "avif", "pdf"]
# The image pipeline: `/_img` variants and the width and height of a stored
# image (`image`: decode JPEG, PNG, WebP; encode JPEG, PNG, lossless WebP).
# Without it `/_img` answers 503 `RENOX_UNAVAILABLE` and `op_storage_put`
# records no dimensions.
media = ["dep:image"]
# AVIF variants (`ravif` and the `rav1e` encoder, pure Rust). Without it
# `f=auto` picks WebP and `f=avif` is 400 `RENOX_VALIDATION`.
avif = ["media", "image/avif"]
# `ctx.pdf` through renox-runtime (typst).
pdf = ["renox-runtime/pdf"]

# The only crate that depends on the others; nothing depends on it
# (docs/03-architecture.md, workspace dependencies).
[dependencies]
renox-authz = { path = "../renox-authz" }
renox-data = { path = "../renox-data" }
renox-gateway = { path = "../renox-gateway" }
renox-meter = { path = "../renox-meter" }
# WebSocket and SSE connections, topics, fan-out (#278; wired by #281).
renox-realtime = { path = "../renox-realtime" }
renox-runtime = { path = "../renox-runtime", default-features = false, features = ["v8"] }
# Page rendering off the isolate thread (#40), and the compiler behind
# `renox-worker transpile` for the CLI (#43).
renox-template = { path = "../renox-template" }

axum = { version = "0.8.9", default-features = false }
# The static export names of each code entry, checked at prepare against
# the artifact's `entries` (artifact 1.2, V23; #265). Already in the tree
# through eszip.
deno_ast = "0.53"
# Page sessions and CSRF (#41): HKDF per tenant, HMAC-signed cookies,
# constant-time comparison, form field lookup.
base64 = "0.23"
form_urlencoded = "1"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
subtle = "2.6"
bytes = "1"
http = "1"
http-body-util = "0.1"
# The plain :80 listener of a TLS worker (#162): ACME challenges, 308. The
# control-plane client of controlled mode (#55): HTTP/1.1 over rustls with
# the webpki roots.
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: loader data parsed exactly as V8 printed it (B9, #40).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
# The files export (src/control/files_export.rs, #670): a gzip ustar of a tenant's stored files.
tar = { version = "0.4", default-features = false }
flate2 = "1"
# The image pipeline (#321; ops.md 1.7.0 section 21): decode JPEG, PNG,
# WebP; encode AVIF (ravif, pure Rust), WebP (lossless), JPEG, PNG. Already in
# the tree through deno_canvas; the `avif` feature above adds ravif and
# rav1e. README, "Images".
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "fs"] }
# Dual-stack public listeners (`[::]` with IPV6_V6ONLY off, #404). Already
# in the tree through tokio and hyper-util.
socket2 = "0.6"
# The zone of a job's `tz` (ops.md section 20, #297): the system tzdb,
# already in the tree through other crates.
jiff = "0.2.38"
toml = "1.1"
# NFC check of tar entry paths (src/tar_safe.rs, T4).
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Spans exported over OTLP/HTTP (protobuf) from `[telemetry]` (#295). The
# OpenTelemetry crates are already in the tree through deno_runtime; the
# HTTP client is this crate's hyper (src/telemetry/), no gRPC, no reqwest.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }

# malloc_trim after evictions (src/alloc.rs, #144), and statvfs for the
# disk monitor (src/disk.rs, #465).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `GetDiskFreeSpaceExW` for the disk monitor on Windows (src/disk.rs, #530); the
# same windows-sys as renox-runtime, so no new package.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The sandbox of #253 (src/sandbox/): Landlock rules and a seccomp
# allowlist, both pure Rust (no libseccomp).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = { version = "0.5.0", features = ["json"] }

[dev-dependencies]
# `default-features = false`: otherwise this dev-dependency on the crate itself
# turns the default features back on for every test build, and
# `--no-default-features` (the lean compositions of #372) would test nothing.
renox-cell = { path = ".", default-features = false, features = ["test-support"] }
# tests/images.rs and tests/storage.rs build their test pictures with it,
# whatever features the crate under test has.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# tests/storage.rs: an upload body of unknown length (a chunked stream).
futures-util = { version = "0.3.34", default-features = false }
# tests/telemetry.rs: the in-memory span exporter.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process"] }
# tests/pages.rs compiles the page templates of its test artifact.
renox-template = { path = "../renox-template" }
