# renox-worker configuration (crates/renox-cell/README.md, "Configuration").
# Relative paths are resolved against this file's directory.
#
#   renox-worker --config worker.toml
#
# SIGHUP re-reads routes_file.

listen = "127.0.0.1:8080"
data_dir = "data"            # <data_dir>/<tenant_id>/app.db, secrets.json (mode 0600)
artifacts_dir = "artifacts"  # <artifacts_dir>/<sha256>/manifest.json, code/, migrations/, public/
routes_file = "routes.json"  # docs/contracts/schemas/route-table.schema.json
meters_dir = "meters"        # <meters_dir>/<YYYY-MM-DD>.ndjson
logs_dir = "logs"            # <logs_dir>/tenant.ndjson
node_id = "node-local"
idle_timeout_secs = 600      # scale to zero after 10 minutes without a request
meter_flush_ms = 5000        # meter batches written at least this often
# The node's own public addresses and the control plane's node-facing ones
# (where [control] url resolves; not the public API address, ADR D23): tenant
# fetch is refused to them on top of the private ranges. Set this in
# production; a controlled worker does not start when [control] url resolves
# to an address that is neither listed here nor private.
fetch_blocked_addresses = []

default_tier = "free"

# Per-client limits of the gateway (defaults shown).
[gateway]
rate_limit_per_ip = 100.0
rate_limit_burst = 200
max_connections_per_ip = 100
# HTTP/2 flood budgets (renox-gateway README, "Protocol limits"); 0 is refused.
h2_max_resets_per_second = 100
h2_max_resets_per_ip_per_second = 200
h2_max_control_frames_per_second = 2000

[tenant_tiers]
t_paid_example = "paid"

# Any field of a tier can be overridden; the rest keep the defaults of
# docs/04-isolation-security.md.
[tiers.free]
# cpu_ms = 50
# wall_ms = 30000
# heap_mb = 128
# concurrency = 50
# db_quota_bytes = 104857600
# egress_bytes = 10485760
# log_lines_per_min = 1000

[tiers.paid]
# cpu_ms = 500

# The worker's own seccomp allowlist and Landlock rules (#253, README
# "Sandbox"). Required in controlled mode unless allow_unsandboxed = true.
# Linux only. Try it with: renox-worker --sandbox-selftest --config <file>
[sandbox]
enabled = false
# mode = "enforce"            # or "audit": misses are logged by the kernel, not fatal
# extra_syscalls = []
# extra_read_paths = []
# extra_connect_ports = [80]  # fetch allowlist entries with http:// or an explicit port
# allow_unsandboxed = false

# Process tiers (#254, README "Process tiers"): tenants in a child process
# of their own. Controlled mode places them by the route entry's process.
[process]
enabled = false
# own_tenants = ["t_paid_example"]   # local mode
# launcher = "direct"                # or "systemd" (ops/systemd/renox-child@.service)
# run_dir = "run"
# max_children = 64
# child_idle_secs = 600
# restart_backoff_ms = 200
# child_cpu_quota_us = 200000        # cpu.max per 100 ms period
# child_memory_bytes = 1073741824
# child_pids = 512

# Litestream per tenant file (#255, README "Replication").
[replication]
enabled = false
# replica = "file"                 # or "s3"
# path = "replica"                 # file: <path>/<database>/
# bucket = "renox-replica"         # s3
# prefix = "tenants"
# region = "me-central-1"          # controlled mode: one of allowed_regions
# sse_kms_key_id = "…"             # controlled mode, s3: required
# sync_interval_ms = 1000
# retention_hours = 24
# snapshot_interval_secs = 3600
# stop_grace_ms = 3000
# litestream_bin = "litestream"
