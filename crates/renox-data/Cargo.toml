[package]
name = "renox-data"
version = "0.0.0"
description = "Tenant SQLite files: connections, pragmas, authorizer, limits, migrations (docs/06-data.md)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# bundled: the SQLite version is pinned by the crate, not by the host.
# hooks: authorizer and progress handler (#19, #20).
rusqlite = { version = "0.40.0", features = ["bundled", "hooks", "preupdate_hook"] }
sha2 = "0.11.1"
# db.scoped() (#277): the statement shapes the rewriter proves come from a
# parsed AST, never from string matching. `visitor`: walk every relation.
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
