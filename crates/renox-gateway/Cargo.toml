[package]
name = "renox-gateway"
version = "0.0.0"
description = "Renox gateway: hostname routing, static files, rate limiting, input limits, TLS (P3)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1.9.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "http1", "http2", "service"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "fs", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
ulid = "3.0.0"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
