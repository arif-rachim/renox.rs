[package]
name = "renox-gateway"
version = "0.0.0"
description = "Renox gateway: hostname routing, static files, rate limiting, input limits, TLS (P3)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1.9.3"
# Client events: the contract schema (#126).
jsonschema = { version = "0.60", default-features = false }
# The client script's ETag (#126).
sha2 = "0.11"
# CSP nonces (#47).
base64 = "0.23"
getrandom = "0.4"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
# Response compression (src/compress.rs, #159).
brotli = "9.1.1"
bytes = "1.12.1"
flate2 = "1.1.10"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "http2", "service"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "fs", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
# Operator log lines (#207: tenant cookie rewrites); renox-cell installs the subscriber.
tracing = "0.1"
ulid = "3.0.0"

[dev-dependencies]
# Captures the #207 log line in tests/cookies.rs.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
h2 = "0.4.20"
hyper = { version = "1.12.0", features = ["client", "http2"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
