[package]
name = "renox-runtime"
version = "0.1.0"
description = "Renox data plane runtime: V8 isolates on deno_runtime, artifact loading, dispatch, limits, ops"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `v8` links V8 through deno_runtime. Without it, only the pure modules
# (manifest, router, error, ops::net_policy, ops::fetch_connector) compile,
# so their tests run without V8: `cargo test -p renox-runtime --no-default-features`
# (docs/12-developer-experience.md, "Tests without V8 wherever possible").
default = ["v8"]
v8 = ["dep:deno_runtime", "dep:deno_core", "dep:deno_fs", "dep:deno_error", "dep:deno_resolver", "dep:sys_traits", "dep:v8", "dep:eszip", "dep:futures"]
# Embed the platform snapshot and the residual lazy sources, so the binary
# runs without the cargo registry (#154; build.rs, README "Packaging").
# Needs RENOX_PACKAGED_DIR from `Runtime::write_packaged`; release builds only.
packaged = ["v8"]
# Test-only connect override for the fetch connector (tests/fetch*.rs).
# Never enabled by renox-cell; see ops/fetch_connector.rs.
test-hooks = []

[dependencies]
argon2 = "0.6"
# deno_runtime 0.268 (latest release, 2026-10-21) with its deno_core and
# prebuilt V8 (never built from source). See README, "Upstream consumption mode".
deno_runtime = { version = "=0.268.0", features = ["snapshot"], optional = true }
deno_core = { version = "=0.413.0", optional = true }
# The `fetch` span of a tenant fetch (#295, host only).
tracing = "0.1"
deno_fs = { version = "=0.170.0", optional = true }
deno_error = { version = "=0.7.1", optional = true }
deno_resolver = { version = "0.91", features = ["sync"], optional = true }
sys_traits = { version = "0.1.28", features = ["real"], optional = true }
v8 = { version = "=150.4.0", optional = true }
eszip = { version = "*", optional = true }
futures = { version = "0.3", optional = true }

renox-data = { path = "../renox-data" }
# Principal, guard, op_authz_* (ops.md 1.5.0 section 17, #279).
renox-authz = { path = "../renox-authz" }
renox-realtime = { path = "../renox-realtime" }

bytes = "1"
http = "1"
hickory-proto = { version = "0.25", default-features = false, features = ["tokio", "std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# ops.md 1.7.0 section 22: webhook signatures (HMAC-SHA256, constant-time compare).
hmac = "0.13"
subtle = "2.6"
# ops.md 1.7.0 section 24: HTML to PDF with Arabic shaping and bidi
# (README, "PDF"). typst lays out and shapes (rustybuzz); html5ever reads
# the rendered template.
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
html5ever = "0.40.1"
markup5ever_rcdom = "0.39.0"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
url = "2"
webpki-roots = "1.0"

[dev-dependencies]
renox-runtime = { path = ".", default-features = false, features = ["test-hooks"] }
eszip = "*"
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
