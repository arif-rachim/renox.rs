<r-layout use="back-office">
  <r-group slot="title"><r-t key="backoffice.audit.title" /> · {{ brand.name }}</r-group>
  <h1><r-t key="backoffice.audit.title" /></h1>
  <p><small class="muted"><r-t key="backoffice.audit.hint" /></small></p>
  <form method="get" class="row">
    <label><r-t key="backoffice.audit.action" /> <select name="action"><option value=""><r-t key="backoffice.audit.all" /></option><option r-for="a in actions" :value="a.value" :selected="a.current">{{ a.value }}</option></select></label>
    <label><r-t key="backoffice.audit.actor" /> <input name="actor" dir="ltr" maxlength="64" :value="actor"></label>
    <button type="submit"><r-t key="backoffice.audit.filter" /></button>
  </form>
  <table id="audit">
    <thead><tr><th><r-t key="backoffice.audit.when" /></th><th><r-t key="backoffice.audit.action" /></th><th><r-t key="backoffice.audit.actor" /></th><th><r-t key="backoffice.audit.result" /></th><th><r-t key="backoffice.audit.source" /></th></tr></thead>
    <tbody>
      <tr r-for="e in events"><td dir="ltr">{{ e.at }}</td><td dir="ltr">{{ e.action }}</td><td dir="ltr">{{ e.actor }}</td><td>{{ e.result }}</td><td>{{ e.source }}</td></tr>
      <tr r-empty="events"><td colspan="5"><r-t key="backoffice.audit.none" /></td></tr>
    </tbody>
  </table>
</r-layout>
