<r-layout use="back-office">
  <r-group slot="title"><r-t key="backoffice.settings.title" /> · {{ brand.name }}</r-group>
  <h1><r-t key="backoffice.settings.title" /></h1>
  <p class="notice" id="saved" r-if="saved"><r-t key="backoffice.settings.saved" /></p>
  <x-form action="save" enctype="multipart/form-data" hx-encoding="multipart/form-data" class="stack narrow">
    <p><label><r-t key="backoffice.settings.f.brand_name" /> <input name="brand_name" maxlength="80" :value="f.brand_name" required></label></p>
    <p><label><r-t key="backoffice.settings.f.brand_name_ar" /> <input name="brand_name_ar" maxlength="80" dir="rtl" :value="f.brand_name_ar"></label></p>
    <p><label><r-t key="backoffice.settings.f.color" /> <input name="brand_color" dir="ltr" maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#1f6f5c" :value="f.brand_color" required></label></p>
    <p><label><r-t key="backoffice.settings.f.footer_en" /> <input name="brand_footer_en" maxlength="200" :value="f.brand_footer_en"></label></p>
    <p><label><r-t key="backoffice.settings.f.footer_ar" /> <input name="brand_footer_ar" maxlength="200" dir="rtl" :value="f.brand_footer_ar"></label></p>
    <p><label><r-t key="backoffice.settings.f.sender" /> <input name="sender_name" maxlength="80" :value="f.sender_name"></label> <small class="muted"><r-t key="backoffice.settings.sender_hint" /></small></p>
    <p><label><r-t key="backoffice.settings.f.accounts_email" /> <input name="accounts_email" type="email" dir="ltr" maxlength="254" :value="f.accounts_email"></label> <small class="muted"><r-t key="backoffice.settings.accounts_hint" /></small></p>
    <p><label><r-t key="backoffice.settings.f.logo" /> <input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label>
      <small class="muted"><r-t key="backoffice.settings.logo_limit" /></small>
      <img r-if="logo_src" id="current-logo" :src="logo_src" alt="" class="brand-logo"><small r-else><r-t key="backoffice.settings.logo_none" /></small></p>
    <p><button type="submit" class="btn-brand"><r-t key="backoffice.settings.save" /></button></p>
  </x-form>
</r-layout>
