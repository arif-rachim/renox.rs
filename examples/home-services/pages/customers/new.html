<r-layout use="main">
  <r-group slot="title"><r-t key="customers.new" /> · {{ brand.name }}</r-group>
  <h1><r-t key="customers.new" /></h1>
  <x-form action="create" class="stack narrow">
    <h2><r-t key="customers.details" /></h2>
    <p><label><r-t key="customers.f.kind" />
      <select name="kind">
        <option value="household" :selected="values.kind != 'company'"><r-t key="customers.kind.household" /></option>
        <option value="company" :selected="values.kind == 'company'"><r-t key="customers.kind.company" /></option>
      </select></label></p>
    <p><label><r-t key="customers.f.name" /> <input name="name" maxlength="120" :value="values.name" required></label></p>
    <p><label><r-t key="customers.f.phone" /> <input name="phone" type="tel" dir="ltr" placeholder="+971 50 123 4567" :value="values.phone" required></label></p>
    <p><label><r-t key="customers.f.trn" /> <input name="trn" dir="ltr" inputmode="numeric" maxlength="40" :value="values.trn"></label></p>
    <p><label><r-t key="customers.f.email" /> <input name="email" type="email" dir="ltr" maxlength="254" :value="values.email"></label></p>
    <p><label><r-t key="customers.f.language" />
      <select name="language">
        <option value="en" :selected="values.language != 'ar'"><r-t key="app.lang.en" /></option>
        <option value="ar" :selected="values.language == 'ar'"><r-t key="app.lang.ar" /></option>
      </select></label></p>
    <h2><r-t key="customers.first_site" /></h2>
    <x-site-fields :emirates="emirates" :values="values" />
    <p><button type="submit" class="btn-brand"><r-t key="customers.create" /></button> <a href="/customers"><r-t key="customers.cancel" /></a></p>
  </x-form>
</r-layout>
