<r-props problems="object" /><section r-if="problems" class="problem" role="alert" tabindex="-1" id="form-errors"><h2><r-t key="problem.title" /></h2><ul><li r-for="p in problems" :id="'err-' ~ p.field"><a r-if="p.control" :href="'#' ~ p.control"><strong>{{ p.label }}</strong></a><strong r-else>{{ p.label }}</strong>: {{ p.message }}</li></ul></section>
