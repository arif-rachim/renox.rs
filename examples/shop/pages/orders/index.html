<r-layout use="main">
  <r-group slot="title"><r-t key="shop.orders.title" /></r-group>
  <h1><r-t key="shop.orders.title" /></h1>
  <p class="notice" r-if="notice">{{ notice }}</p>
  <p><a href="/orders/live"><r-t key="shop.orders.live" /></a></p>
  <ul id="orders">
    <li r-for="o in orders" :id="'order-' + o.id">
      <span>#{{ o.id }}</span> · <span dir="ltr">{{ o.amount }} AED</span>
      <strong r-if="o.refunded"><r-t key="shop.orders.refunded" /></strong>
      <x-form action="refund" r-if="!o.refunded"><input type="hidden" name="order" :value="o.id"><button type="submit" r-can="invoice.refund" :resource="o"><r-t key="shop.orders.refund" /></button></x-form>
    </li>
    <li r-empty="orders"><r-t key="shop.orders.none" /></li>
  </ul>
</r-layout>
