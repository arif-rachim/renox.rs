[app]
name = "shop"
timezone = "Asia/Dubai"

# No outbound network and no secrets: the Stripe call in checkout.ts only
# builds the request object (docs/14-benchmarks.md, B1 dependency set).
[permissions]
network = []
secrets = []

[modules]
i18n = { version = "^1.0.0" }
# #291: phone-first and passkey sign-in on the login page (codes go out
# through auth.send_otp once whatsapp, or an SMS module, is installed).
auth = { version = "^1.0.0", config = { phone_login = true, passkeys = true } }
org = { version = "^1.0.0" }
